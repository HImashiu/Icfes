  const d = state.detail, sc = d.scan;
  const est = sc.estimated && !d.anchor;
  return `<div class="pdfbar">
      <button class="ib" onclick="turnPage(-1)" title="Página anterior">‹</button>
      <span class="muted">pág.</span><input id="pg" type="number" min="1" value="${state.page}"><span class="muted">${sc.count ? "de " + sc.count : ""}</span>
      <button class="ib" onclick="turnPage(1)" title="Página siguiente">›</button>
      <span class="spacer"></span>
      <span class="muted">Zoom</span>
      <button class="ib" onclick="zoomBy(1/1.25)" title="Alejar">−</button>
      <button class="ib" onclick="zoomBy(0)" title="Ajustar al ancho del panel">Ajustar</button>
      <button class="ib" onclick="zoomBy(1.25)" title="Acercar">+</button>
      ${STATIC ? "" : `<button class="ib ${state.cropping ? "on" : ""}" id="cropbtn" onclick="state.cropping ? cancelCrop() : startCrop()" title="Dibuja un recuadro en la página para recortar una figura o copiar su texto (Alt+R)">✂ Recortar o leer</button>`}
    </div>
    ${est ? `<div class="note warn" style="margin:8px 10px 0">Página estimada: busca la pregunta con ‹ ›.</div>` : ""}
    <div class="pdfscroll" id="pdfscroll">
      <div class="pdfpage ${state.cropping ? "cropping" : ""}" id="pdfpage" style="width:${Math.round(state.zoom * 100)}%">
        <img id="pdfimg" alt="página ${state.page} del PDF original" src="/api/scan/${encodeURIComponent(d.exam)}/${state.page}" draggable="false" onerror="pageMissing(this)">
        <div class="ov" id="ov">${anchorMark()}</div>
      </div>
    </div>`;
}
function pageMissing(img) {
  img.replaceWith(Object.assign(document.createElement("div"), { className: "note warn", textContent: "La página original no se pudo abrir. En esta copia en línea no hay PDF: ábrela con el editor del computador." }));
}
function anchorMark() {
  const a = state.detail.anchor;
  return a && a.page === state.page ? `<div class="anchor" style="top:${a.y * 100}%"><span>Q${state.detail.number}</span></div>` : "";
}

function bindPdf() {
  const img = $("#pdfimg");
  img.onerror = () => { img.replaceWith(Object.assign(document.createElement("p"), { className: "muted", style: "padding:16px", textContent: "No se pudo cargar esta página. Revisa pdf-sources.json, o instala PyMuPDF: python -m pip install pymupdf" })); };
  img.onload = () => scrollToAnchor();
  $("#pg").onchange = (e) => goPage(Number(e.target.value));
  $("#pdfscroll").addEventListener("wheel", (e) => { if (!e.ctrlKey) return; e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.1 : 1 / 1.1); }, { passive: false });
  const ov = $("#ov");
  let start = null;
  const frac = (ev) => { const r = ov.getBoundingClientRect(); return [Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height))]; };
  ov.onpointerdown = (ev) => {
    if (!state.cropping || ev.button !== 0) return;
    ev.preventDefault();
    ov.setPointerCapture(ev.pointerId);
    start = frac(ev);
    state.box = [...start, ...start];
    drawBox(false);
  };
  ov.onpointermove = (ev) => { if (!start) return; const p = frac(ev); state.box = [start[0], start[1], p[0], p[1]]; drawBox(false); };
  ov.onpointerup = () => {
    if (!start) return;
    start = null;
    const [x0, y0, x1, y1] = state.box;
    if (Math.abs(x1 - x0) < 0.01 || Math.abs(y1 - y0) < 0.01) { state.box = null; drawBox(false); return; }
    state.box = [Math.min(x0, x1), Math.min(y0, y1), Math.max(x0, x1), Math.max(y0, y1)];
    drawBox(true);
  };
}
function scrollToAnchor() {
  const a = state.detail.anchor, sc = $("#pdfscroll"), page = $("#pdfpage");
  if (!sc || !page || !a || a.page !== state.page || state.scrolled === `${state.detail.number}:${state.page}`) return;
  state.scrolled = `${state.detail.number}:${state.page}`;
  sc.scrollTop = Math.max(0, page.offsetTop + a.y * page.offsetHeight - 40);
}

const cleanToggle = () => `<label class="switch" style="width:100%;font-size:12px" title="Antes de guardar, quita el fondo o tapa texto encima del dibujo"><input type="checkbox" ${state.cleanCrop ? "checked" : ""} onchange="state.cleanCrop = this.checked; remember('cleanCrop', this.checked)"> ✨ Limpiar la imagen antes de guardarla</label>`;
function drawBox(withBar) {
  const ov = $("#ov");
  ov.innerHTML = anchorMark();
  if (!state.box) return;
  const [x0, y0, x1, y1] = state.box;
  const l = Math.min(x0, x1), t = Math.min(y0, y1), w = Math.abs(x1 - x0), h = Math.abs(y1 - y0);
  ov.insertAdjacentHTML("beforeend", `<div class="box" style="left:${l * 100}%;top:${t * 100}%;width:${w * 100}%;height:${h * 100}%"></div>`);
  if (!withBar) return;
  const letters = state.opts.map(o => o.letter);
  const tgt = state.cropTarget;
  const bar = document.createElement("div");
  bar.className = "cropbar";
  bar.style.left = `${l * 100}%`;
  // Near the bottom of the page the bar goes above the box, so it stays reachable.
  if (t + h > 0.7) { bar.style.bottom = `calc(${(1 - t) * 100}% + 6px)`; } else { bar.style.top = `calc(${(t + h) * 100}% + 6px)`; }
  const eng = `<select class="ib" title="Motor de OCR" onchange="setEngine(this.value)">${sel(ENGINES, state.engine)}</select>`;
  if (tgt?.kind === "replace") bar.innerHTML = `<span class="lbl">Cambiar la figura por este recorte</span>
       <button class="ib go" onclick="cropTo('${esc(tgt.option || "")}', '${esc(tgt.replaces)}')">Usar este recorte</button>
       <button class="ib" onclick="cancelCrop()">Cancelar</button>${cleanToggle()}`;
  else if (tgt?.kind === "field") bar.innerHTML = `<span class="lbl">Leer el texto del recuadro</span>
       <button class="ib go" onclick="ocrTo('${tgt.field}')">${tgt.field === "opts" ? "Repartir en opciones A–D" : `Escribir en ${esc(fieldName($("#" + tgt.field)))}`}</button>
       ${eng}<button class="ib" onclick="cancelCrop()">✕</button>`;
  else bar.innerHTML = `<span class="lbl">Imagen del recuadro en…</span>
       <button class="ib" onclick="cropTo('')">Enunciado</button>
       ${letters.map(l => `<button class="ib" onclick="cropTo('${esc(l)}')">Opción ${esc(l)}</button>`).join("")}
       ${cleanToggle()}
       <span class="lbl">Texto del recuadro (OCR)</span>
       <button class="ib go" onclick="ocrTo('last')" title="Escribe el texto en el último campo que usaste">→ ${esc(fieldName(state.lastArea))}</button>
       <button class="ib" onclick="ocrTo('opts')">Repartir en A–D</button>
       <button class="ib" onclick="ocrTo('copy')">Copiar</button>
       <button class="ib" onclick="tableFromBox()" title="Convierte la tabla del recuadro en una tabla editable">▦ Tabla</button>
       ${eng}<button class="ib" onclick="cancelCrop()">✕</button>`;
  ov.appendChild(bar);
  bar.addEventListener("pointerdown", e => e.stopPropagation());
}
function fieldName(area) {
  if (!area || !area.isConnected) return "enunciado";
  if (area.dataset.letter) return `opción ${area.dataset.letter}`;
  return { "f-stem": "enunciado", "f-stimulus": "texto propio", "f-passage": "texto compartido" }[area.id] || "campo";
}

function startCrop(replaces = null, option = "") {
  state.cropping = true;
  state.cropTarget = replaces ? { kind: "replace", replaces, option } : null;
  state.box = null;
  $("#pdfpage")?.classList.add("cropping");
  $("#cropbtn")?.classList.add("on");
  drawBox(false);
  toast(replaces ? "Dibuja un recuadro sobre la figura en la página" : "Dibuja un recuadro sobre la página");
}
function cancelCrop() {
  state.cropping = false; state.box = null; state.cropTarget = null;
  $("#pdfpage")?.classList.remove("cropping");
  $("#cropbtn")?.classList.remove("on");
  if ($("#ov")) drawBox(false);
}
async function cropTo(option, replaces = null) {
  if (state.cleanCrop) { openCleaner({ page: state.page, box: state.box, option: option || null, replaces }); return; }
  try {
    await api(`${qpath()}/crop`, J("POST", { page: state.page, box: state.box, option: option || null, replaces }));
    cancelCrop();
    await reloadFigures(option ? `Imagen guardada en la opción ${option}` : "Imagen guardada en el enunciado");
  } catch (e) { toast(e.message, true); }
}
// ----- cleaning a crop before it is saved --------------------------------------------------------------
// The crop opens on a canvas: one click turns the paper white or transparent, and a brush, a cover box and an
// eraser hide text printed over the drawing. The eraser brings back the original pixels. The result is saved as the crop PNG.

state.cleanCrop = recall("cleanCrop") ?? true;
const cleaner = { orig: null, hist: [], tool: "rect", color: "#ffffff", size: 14, bg: null, level: 200 };

async function openCleaner(target) {
  try {
    let blob;
    if (target.src) blob = await (await fetch(target.src)).blob();
    else {
      const res = await fetch(`/api/exams/${encodeURIComponent(state.exam)}/crop-image`, J("POST", { page: target.page, box: target.box }));
      if (!res.ok) throw new Error((await res.json()).error || `HTTP ${res.status}`);
      blob = await res.blob();
    }
    const img = await createImageBitmap(blob);
    Object.assign(cleaner, { target, hist: [], bg: null });
    document.body.insertAdjacentHTML("beforeend", `<div class="studio" id="cleaner">
      <div class="stbar">
        <b style="font:700 18px 'Bricolage Grotesque'">Limpiar recorte · Q${state.detail.number}${target.option ? ` · opción ${esc(target.option)}` : ""}</b>
        <span class="spacer"></span>
        <button class="ib" onclick="closeCleaner()">Cancelar (Esc)</button>
        <button class="ib go" onclick="saveCleaner()">Guardar imagen</button>
      </div>
      <div class="clgrid">
        <div class="cltools" id="cl-tools"></div>
        <div class="clstage" id="cl-stage"><canvas id="cl-canvas"></canvas></div>
      </div></div>`);
    const cv = $("#cl-canvas");
    cv.width = img.width; cv.height = img.height;
    const ctx = cv.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(img, 0, 0);
    cleaner.orig = ctx.getImageData(0, 0, cv.width, cv.height);
    cleaner.base = cleaner.orig;
    clTools();
    clBind(cv);
  } catch (e) { toast(e.message, true); }
}
function closeCleaner() { $("#cleaner")?.remove(); cleaner.orig = null; }

function clTools() {
  const t = (id, label, title) => `<button class="ib ${cleaner.tool === id ? "on" : ""}" onclick="clTool('${id}')" title="${title}">${label}</button>`;
  $("#cl-tools").innerHTML = `
    <div class="label">Fondo</div>
    <div class="row"><button class="ib ${cleaner.bg === "white" ? "on" : ""}" onclick="clBackground('white')" title="El papel gris o amarillento queda blanco">Fondo blanco</button>
      <button class="ib ${cleaner.bg === "clear" ? "on" : ""}" onclick="clBackground('clear')" title="El papel desaparece; solo queda el dibujo">Fondo transparente</button></div>
    <label class="muted" style="font-size:12px">Cuánto quitar <input type="range" min="120" max="250" value="${cleaner.level}" oninput="clLevel(this.value)" style="width:100%"></label>
    <div class="label" style="margin-top:12px">Tapar y dibujar</div>
    <div class="row">${t("rect", "▭ Tapar", "Arrastra un recuadro sobre el texto que quieres tapar")}${t("brush", "✎ Pincel", "Pinta con el color elegido")}${t("erase", "⌫ Borrador", "Devuelve la imagen original donde pasas")}</div>
    <div class="row">${[["#ffffff", "Blanco"], ["#000000", "Negro"], ["clear", "Transparente"]].map(([v, l]) => `<button class="sw ${cleaner.color === v ? "on" : ""}" title="${l}" style="background:${v === "clear" ? "repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/10px 10px" : v}" onclick="clColor('${v}')"></button>`).join("")}</div>
    <label class="muted" style="font-size:12px">Grosor <input type="range" min="2" max="60" value="${cleaner.size}" oninput="cleaner.size=+this.value" style="width:100%"></label>
    <div class="row" style="margin-top:12px"><button class="ib" onclick="clUndo()" ${cleaner.hist.length ? "" : "disabled"} title="Ctrl+Z">↶ Deshacer</button>
      <button class="ib" onclick="clReset()" title="Vuelve al recorte original">Empezar de nuevo</button></div>
    <p class="muted" style="font-size:12px">El fondo a cuadros es transparente. La imagen se guarda tal como se ve aquí.</p>`;
}
function clTool(t) { cleaner.tool = t; clTools(); }
function clColor(c) { cleaner.color = c; if (cleaner.tool === "erase") cleaner.tool = "brush"; clTools(); }
const clCtx = () => $("#cl-canvas").getContext("2d", { willReadFrequently: true });
function clPush() {
  const cv = $("#cl-canvas");
  cleaner.hist.push(clCtx().getImageData(0, 0, cv.width, cv.height));
  if (cleaner.hist.length > 40) cleaner.hist.shift();
  clTools();
}
function clUndo() { const last = cleaner.hist.pop(); if (last) clCtx().putImageData(last, 0, 0); clTools(); }
function clReset() { clPush(); cleaner.bg = null; cleaner.base = cleaner.orig; clCtx().putImageData(cleaner.orig, 0, 0); clTools(); }

// Paper is every pixel lighter than the level: it turns white, or transparent. Strokes and drawing stay as they are.
function clPaper(src, mode, level) {
  const out = new ImageData(new Uint8ClampedArray(src.data), src.width, src.height), d = out.data;
  for (let i = 0; i < d.length; i += 4) {
    const light = Math.min(d[i], d[i + 1], d[i + 2]);
    if (light >= level || d[i + 3] === 0) { if (mode === "white") { d[i] = d[i + 1] = d[i + 2] = d[i + 3] = 255; } else d[i + 3] = 0; }
  }
  return out;
}
function clBackground(mode) {
  clPush();
  cleaner.bg = mode;
  // Applied to what is on the canvas now, so covers and strokes already made are kept.
  cleaner.bgFrom = cleaner.hist[cleaner.hist.length - 1];
  clCtx().putImageData(clPaper(cleaner.bgFrom, mode, cleaner.level), 0, 0);
  cleaner.base = clPaper(cleaner.orig, mode, cleaner.level);
  clTools();
}
function clLevel(v) {
  cleaner.level = +v;
  if (!cleaner.bg || !cleaner.bgFrom) return;
  clCtx().putImageData(clPaper(cleaner.bgFrom, cleaner.bg, cleaner.level), 0, 0);
  cleaner.base = clPaper(cleaner.orig, cleaner.bg, cleaner.level);
}

function clBind(cv) {
  const at = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  let start = null, last = null, snap = null;
  const ctx = clCtx();
  // Pixels of the base (original, with the chosen background) inside a circle: the eraser paints these back.
  const restore = (x, y, r) => {
    const x0 = Math.max(0, Math.floor(x - r)), y0 = Math.max(0, Math.floor(y - r));
    const w = Math.min(cv.width, Math.ceil(x + r)) - x0, h = Math.min(cv.height, Math.ceil(y + r)) - y0;
    if (w <= 0 || h <= 0) return;
    const cur = ctx.getImageData(x0, y0, w, h), b = cleaner.base.data;
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      if ((x0 + i - x) ** 2 + (y0 + j - y) ** 2 > r * r) continue;
      const s = ((y0 + j) * cv.width + x0 + i) * 4, t = (j * w + i) * 4;
      cur.data[t] = b[s]; cur.data[t + 1] = b[s + 1]; cur.data[t + 2] = b[s + 2]; cur.data[t + 3] = b[s + 3];
    }
    ctx.putImageData(cur, x0, y0);
  };
  const stroke = (a, b) => {
    const r = cleaner.size / 2 * (cv.width / cv.getBoundingClientRect().width);
    if (cleaner.tool === "erase") {
      const n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / (r / 2)));
      for (let k = 0; k <= n; k++) restore(a[0] + (b[0] - a[0]) * k / n, a[1] + (b[1] - a[1]) * k / n, r);
      return;
    }
    ctx.save();
    ctx.globalCompositeOperation = cleaner.color === "clear" ? "destination-out" : "source-over";
    ctx.strokeStyle = cleaner.color === "clear" ? "#000" : cleaner.color;
    ctx.lineWidth = r * 2; ctx.lineCap = ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
    ctx.restore();
  };
  cv.addEventListener("pointerdown", e => {
    cv.setPointerCapture(e.pointerId);
    clPush();
    start = last = at(e);
    snap = cleaner.tool === "rect" ? ctx.getImageData(0, 0, cv.width, cv.height) : null;
    if (cleaner.tool !== "rect") stroke(start, start);
  });
  cv.addEventListener("pointermove", e => {
    if (!start) return;
    const p = at(e);
    if (cleaner.tool === "rect") {
      ctx.putImageData(snap, 0, 0);
      clCover(ctx, start, p, true);
    } else { stroke(last, p); last = p; }
  });
  cv.addEventListener("pointerup", e => {
    if (!start) return;
    if (cleaner.tool === "rect") { ctx.putImageData(snap, 0, 0); clCover(ctx, start, at(e), false); }
    start = last = snap = null;
  });
}
// The cover box takes the background: white, or a hole when the background is transparent (or that colour is chosen).
function clCover(ctx, a, b, outline) {
  const x = Math.min(a[0], b[0]), y = Math.min(a[1], b[1]), w = Math.abs(b[0] - a[0]), h = Math.abs(b[1] - a[1]);
  const hole = cleaner.color === "clear" || (cleaner.bg === "clear" && cleaner.color === "#ffffff");
  if (hole) ctx.clearRect(x, y, w, h);
  else { ctx.fillStyle = cleaner.color; ctx.fillRect(x, y, w, h); }
  if (outline) { ctx.save(); ctx.setLineDash([6, 4]); ctx.strokeStyle = "#1a6ef5"; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h); ctx.restore(); }
}

async function saveCleaner() {

      syncOpts();

// "A. uno B. dos…" split by option letter. The first option's letter is often lost under the answer bubble, so text
// before the first letter found is the option just before it.
function splitOptions(text) {
  const rx = /(^|\n|\s)([A-E])[.)]\s+/g;
  const marks = [];
  let m;
  while ((m = rx.exec(text))) marks.push({ letter: m[2], at: m.index + m[1].length, start: rx.lastIndex });
  const seq = [];
  for (const mk of marks) { const want = seq.length ? String.fromCharCode(seq[seq.length - 1].letter.charCodeAt(0) + 1) : null; if (!want || mk.letter === want) seq.push(mk); }
  if (seq.length < 2) return null;
  const out = {};
  const head = text.slice(0, seq[0].at).replace(/^[^A-Za-zÁÉÍÓÚÑáéíóúñ¿¡0-9$(]+/, "").trim();
  if (head && seq[0].letter !== "A") out[String.fromCharCode(seq[0].letter.charCodeAt(0) - 1)] = head;
  seq.forEach((mk, i) => { out[mk.letter] = text.slice(mk.start, i + 1 < seq.length ? seq[i + 1].at : undefined).replace(/\s+/g, " ").trim(); });
  return out;
}

// Joins lines cut by the scan: hyphenated word breaks, single line breaks inside a paragraph, doubled spaces.
function cleanText(t) {
  return t.replace(/\r/g, "")
    .replace(/(\p{L})-\n(\p{Ll})/gu, "$1$2")
    .replace(/([^\n])\n(?!\n|\s*[A-E][.)]\s|\s*[-•*|]|\s*\d+[.)]\s)/g, "$1 ")
    .replace(/[ \t]{2,}/g, " ")
    .replace(/ +([,.;:?!)])/g, "$1")
    .replace(/([¿¡(]) +/g, "$1")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}
function cleanField() {

}

function starter(kind) {
  const xy = { x: { label: "Eje X" }, y: { label: "Eje Y" } };
  return {
    bar: { kind, categories: ["A", "B", "C"], series: [{ name: "", values: [10, 20, 15] }], ...xy },

    combo: { kind, categories: ["A", "B", "C"], series: [{ name: "Barras", type: "bar", values: [10, 20, 15] }, { name: "Línea", type: "line", values: [12, 18, 22] }], ...xy },
    scatter: { kind, series: [{ points: [[1, 2], [2, 3], [3, 5]] }], ...xy },
    curve: { kind, series: [{ points: [[0, 0.2], [0.5, 0.8], [1, 0.4]] }], ...xy },

    table: { kind, headers: ["Columna 1", "Columna 2"], rows: [["", ""], ["", ""]] },

    diagram: { kind, shapes: [{ type: "rect", x: 10, y: 10, w: 80, h: 40 }, { type: "text", x: 50, y: 34, text: "texto", anchor: "middle" }] },
  }[kind];
}

// Moving between kinds keeps the data that fits: categories and series, or the table's cells.
function convert(spec, to) {
  const from = spec.kind;
  if (from === to) return spec;
  const keep = { title: spec.title };
  const base = starter(to);
  let cats = null, series = null;
  if (CAT_KINDS.includes(from)) { cats = spec.categories || []; series = spec.series || []; }
  if (from === "table") {
    const rows = spec.rows || [];
    const head = spec.headers || [];
    cats = rows.map(r => String(typeof r[0] === "object" ? r[0]?.text ?? "" : r[0] ?? ""));
    series = head.slice(1).map((h, i) => ({ name: String(typeof h === "object" ? h.text ?? "" : h), values: rows.map(r => parseNum(typeof r[i + 1] === "object" ? r[i + 1]?.text : r[i + 1])) }));
  }
  if (from === "pie" && spec.slices) { cats = spec.slices.map(s => s.label); series = [{ name: "", values: spec.slices.map(s => s.value) }]; }
  if (cats && series) {
    if (CAT_KINDS.includes(to)) {
      const s = series.map((x, i) => {
        const out = { name: x.name ?? "", values: x.values };
        if (to === "combo") out.type = i === 0 ? "bar" : "line";
        if (to !== "combo" && x.pattern && to === "bar") out.pattern = x.pattern;
        return out;
      });
      return { ...base, ...keep, x: spec.x || base.x, y: spec.y || base.y, categories: cats, series: s };
    }
    if (to === "table") return { ...base, ...keep, headers: [spec.x?.label || "", ...series.map(s => s.name || "")], rows: cats.map((c, j) => [c, ...series.map(s => numText(s.values?.[j]))]) };
    if (to === "pie") return { ...base, ...keep, slices: cats.map((c, j) => ({ label: c, value: series[0]?.values?.[j] ?? 0 })) };
  }
  return { ...base, ...keep };
}

// Numbers as typed in Colombia: 1.200 is twelve hundred and 12,5 is twelve and a half.
function parseNum(v) {
  if (v == null) return null;
  let s = String(v).trim().replace(/\s|%/g, "");
  if (s === "") return null;
  if (s.includes(",") && s.includes(".")) s = s.replace(/\./g, "").replace(",", ".");
  else if (s.includes(",")) s = s.replace(",", ".");
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  const n = Number(s);
  return Number.isFinite(n) ? n : v;
}

    : `<div class="note ok" style="margin-top:10px">Lista: el motor de la app la dibuja así.</div>`;
}

const sel = (opts, cur) => opts.map(([v, l]) => `<option value="${esc(v)}" ${String(cur ?? "") === v ? "selected" : ""}>${esc(l)}</option>`).join("");
const inp = (path, label, val, type = "text", extra = "") => `<label>${label}<input data-p="${path}" data-t="${type === "number" ? "num" : "str"}" value="${esc(val ?? "")}" ${extra}></label>`;
function getPath(o, path) { return path.split(".").reduce((a, k) => (a == null ? a : a[k]), o); }
function setPath(o, path, v) {
  const keys = path.split(".");
  let cur = o;
  keys.slice(0, -1).forEach(k => { if (cur[k] == null || typeof cur[k] !== "object") cur[k] = {}; cur = cur[k]; });
  const last = keys[keys.length - 1];
  if (v === undefined || v === "" || v === null) delete cur[last]; else cur[last] = v;
}

function drawStudioForm() {
  const sp = studio.draft.spec, box = $("#st-form");
  if (studio.mode === "json") {
    box.innerHTML = `<div class="sec"><div class="label">JSON de la figura</div><textarea id="st-json" style="min-height:60vh;font:13px/1.4 ui-monospace,Menlo,monospace">${esc(JSON.stringify(sp, null, 2))}</textarea>
      <p class="muted" style="font-size:12px">Para opciones avanzadas (notas, celdas combinadas, formas). La vista previa se actualiza al escribir.</p></div>`;
    $("#st-json").oninput = (e) => { try { studio.draft.spec = JSON.parse(e.target.value); studioPreview(); } catch (err) { $("#st-probs").innerHTML = `<div class="note bad">JSON: ${esc(err.message)}</div>`; } };
    studioPreview();
    return;
  }
  const kinds = Object.keys(KIND_NAMES).map(k => `<button class="${sp.kind === k ? "on" : ""}" onclick="setKind('${k}')"><svg viewBox="0 0 34 26" fill="currentColor" stroke="currentColor">${KIND_ICONS[k]}</svg>${KIND_NAMES[k]}</button>`).join("");
  let body = "";
  if (CAT_KINDS.includes(sp.kind) && !(sp.series || []).some(s => Array.isArray(s.points))) body = catForm(sp);
  else if (PT_KINDS.includes(sp.kind) || sp.kind === "line") body = ptForm(sp);
  else if (sp.kind === "pie") body = pieForm(sp);
  else if (sp.kind === "table") body = tableForm(sp);
  else if (sp.kind === "map") body = mapForm(sp);
  else body = `<div class="sec"><div class="label">${esc(KIND_NAMES[sp.kind] || sp.kind)}</div>
    <p class="muted">Las figuras de ${sp.kind === "geometry" ? "geometría" : "diagrama"} se dibujan con coordenadas. Ajústalas en la pestaña JSON viendo la vista previa.
    Si es un dibujo, foto o esquema complejo, es más rápido cerrarlo y usar «✂ Recortar del PDF».</p>
    <div class="frow">${inp("title", "Título", sp.title)}</div></div>`;
  box.innerHTML = `<div class="kinds">${kinds}</div>${body}`;
  box.oninput = box.onchange = (e) => {
    const t = e.target;
    if (t.dataset.p) {
      const v = t.type === "checkbox" ? (t.dataset.inv ? (t.checked ? undefined : false) : (t.checked || undefined)) : t.dataset.t === "num" ? parseNum(t.value) ?? undefined : t.value;
      setPath(sp, t.dataset.p, v);
      if (["x", "y", "y2"].includes(t.dataset.p.split(".")[0])) { const ax = t.dataset.p.split(".")[0]; if (sp[ax] && !Object.keys(sp[ax]).length) delete sp[ax]; }
    }
    if (t.dataset.s != null) {
      const s = sp.series[+t.dataset.s];
      const v = t.type === "checkbox" ? (t.checked || undefined) : t.value;
      if (t.dataset.k === "axis") setPath(s, "axis", v === "2" ? 2 : undefined);
      else if (t.dataset.k === "name") { s.name = v; }
      else setPath(s, t.dataset.k, v);
      if (t.dataset.k === "type" && e.type === "change") { drawStudioForm(); return; }
    }
    if (t.dataset.area != null) { sp.fills = sp.fills || {}; if (t.value) sp.fills[t.dataset.area] = t.value; else delete sp.fills[t.dataset.area]; }
    studioPreview();
  };
  bindGrids();
  studioPreview();
}
function setKind(kind) { studio.draft.spec = convert(studio.draft.spec, kind); drawStudioForm(); }

function axisBlock(sp, { x = true, xnum = false, y = true, y2 = false } = {}) {
  return `<div class="sec"><div class="label">Títulos y ejes</div>
    <div class="frow">${inp("title", "Título de la gráfica", sp.title)}</div>
    <div class="frow">${x ? inp("x.label", "Título del eje X", sp.x?.label) : ""}${y ? inp("y.label", sp.orientation === "horizontal" ? "Título del eje de valores" : "Título del eje Y", sp.y?.label) : ""}</div>
    ${y ? `<div class="frow">${inp("y.min", "Y mínimo", numText(sp.y?.min), "number")}${inp("y.max", "Y máximo", numText(sp.y?.max), "number")}${inp("y.step", "Y cada", numText(sp.y?.step), "number")}
      <label>Números Y<select data-p="y.format">${sel([["", "Normal"], ["grouped", "Miles con punto"]], sp.y?.format)}</select></label></div>` : ""}
    ${xnum ? `<div class="frow">${inp("x.min", "X mínimo", numText(sp.x?.min), "number")}${inp("x.max", "X máximo", numText(sp.x?.max), "number")}${inp("x.step", "X cada", numText(sp.x?.step), "number")}</div>` : ""}
    ${y2 ? `<div class="frow">${inp("y2.label", "Título del 2.º eje Y", sp.y2?.label)}${inp("y2.min", "mín", numText(sp.y2?.min), "number")}${inp("y2.max", "máx", numText(sp.y2?.max), "number")}${inp("y2.step", "cada", numText(sp.y2?.step), "number")}</div>` : ""}
    <div class="frow"><label>Leyenda<select data-legend onchange="studio.draft.spec.legend = this.value === 'off' ? false : undefined; if (this.value !== 'off') delete studio.draft.spec.legend;">${sel([["", "Automática (nombres de serie)"], ["off", "Sin leyenda"]], sp.legend === false ? "off" : "")}</select></label>
      ${sp.kind === "bar" ? `<label>Barras<select data-p="orientation">${sel([["", "Verticales"], ["horizontal", "Horizontales"]], sp.orientation === "horizontal" ? "horizontal" : "")}</select></label>` : ""}
      ${["line", "curve"].includes(sp.kind) ? `<label class="switch" style="flex-direction:row;align-items:center"><input type="checkbox" data-p="inverted" ${sp.inverted ? "checked" : ""}> Fondo negro</label>` : ""}
      ${sp.kind === "curve" ? `<label class="switch" style="flex-direction:row;align-items:center"><input type="checkbox" data-p="y.ticks" ${sp.y?.ticks ? "checked" : ""}> Números en Y</label><label class="switch" style="flex-direction:row;align-items:center"><input type="checkbox" data-p="x.ticks" ${sp.x?.ticks ? "checked" : ""}> Números en X</label>` : ""}
    </div></div>`;
}

function seriesOpts(sp, i) {
  const s = sp.series[i];
  const isBar = sp.kind === "bar" || (sp.kind === "combo" && s.type === "bar");
  const isLine = sp.kind === "line" || sp.kind === "curve" || sp.kind === "scatter" || (sp.kind === "combo" && s.type === "line");
  return `<div class="serrow"><b style="grid-column:1/-1;font-size:12px">${esc(s.name || `Serie ${i + 1}`)}</b>
    ${sp.kind === "combo" ? `<span class="fcol"><label>Tipo<select data-s="${i}" data-k="type">${sel([["bar", "Barras"], ["line", "Línea"]], s.type)}</select></label></span>` : ""}
    ${isBar ? `<span class="fcol"><label>Relleno<select data-s="${i}" data-k="pattern">${sel(PATTERNS, s.pattern)}</select></label></span>` : ""}
    ${isLine ? `<span class="fcol"><label>Marcador<select data-s="${i}" data-k="marker">${sel(MARKERS, s.marker)}</select></label></span>
      <span class="fcol"><label>Trazo<select data-s="${i}" data-k="style">${sel(STYLES, s.style)}</select></label></span>` : ""}
    ${sp.kind === "scatter" ? `<label class="switch" style="font-size:12px"><input type="checkbox" data-s="${i}" data-k="lines" ${s.lines ? "checked" : ""}> Unir puntos</label>` : ""}
    ${sp.kind === "line" ? `<label class="switch" style="font-size:12px"><input type="checkbox" data-s="${i}" data-k="area" ${s.area ? "checked" : ""}> Área rellena</label>` : ""}
    ${sp.kind === "curve" ? `<span class="fcol"><label>Rótulo en la curva<input data-s="${i}" data-k="label" value="${esc(s.label || "")}"></label></span>` : ""}
    ${["bar", "combo"].includes(sp.kind) ? `<span class="fcol"><label>Eje<select data-s="${i}" data-k="axis">${sel([["", "Principal"], ["2", "Segundo eje"]], s.axis === 2 ? "2" : "")}</select></label></span>` : ""}
  </div>`;
}

// Bars, lines and combos: one row per category, one column per series. Paste straight from Excel.
function catForm(sp) {
  sp.categories = sp.categories || [];
  sp.series = sp.series || [];
  const matrix = [["Categoría", ...sp.series.map(s => s.name ?? "")], ...sp.categories.map((c, j) => [c, ...sp.series.map(s => numText(s.values?.[j]))])];
  const y2 = sp.series.some(s => s.axis === 2) || sp.y2;
  return `<div class="sec"><div class="label">Datos · cada fila es una categoría, cada columna una serie</div>
      <div class="grid" data-grid="cat" data-matrix="${esc(JSON.stringify(matrix))}"></div>
      <p class="muted" style="font-size:12px;margin:6px 0 0">Puedes pegar celdas copiadas de Excel o Sheets. La primera fila son los nombres de las series (déjalo vacío si el escaneo no muestra leyenda). Usa coma para decimales.</p>
      ${sp.series.map((_, i) => seriesOpts(sp, i)).join("")}
    </div>${axisBlock(sp, { y2 })}`;
}

// Scatter, curves and lines with numeric x: each series is a list of (x, y) points.
function ptForm(sp) {
  sp.series = sp.series || [];
  const blocks = sp.series.map((s, i) => `<div style="margin-bottom:10px">
      <div class="frow" style="align-items:end"><label>Nombre de la serie ${i + 1}<input data-s="${i}" data-k="name" value="${esc(s.name || "")}"></label>
        <button class="ib warn" onclick="dropSeries(${i})" style="justify-self:start">Quitar serie</button></div>
      <div class="grid" data-grid="pts" data-series="${i}" data-matrix="${esc(JSON.stringify([["x", "y"], ...(s.points || []).map(p => [numText(p[0]), numText(p[1])])]))}"></div>
      ${seriesOpts(sp, i)}</div>`).join("");
  return `<div class="sec"><div class="label">Puntos (x, y) por serie</div>${blocks}
      <button class="ib" onclick="addPtSeries()">+ Serie</button>
      ${sp.kind === "curve" ? `<p class="muted" style="font-size:12px">En una curva los puntos son la forma (de 0 a 1 sirve); no se imprimen números salvo que actives «Números».</p>` : ""}</div>
    ${axisBlock(sp, { xnum: true })}`;
}
function addPtSeries() { studio.draft.spec.series.push({ name: "", points: [[0, 0], [1, 1]] }); drawStudioForm(); }
function dropSeries(i) { studio.draft.spec.series.splice(i, 1); drawStudioForm(); }

function pieForm(sp) {
  if (sp.rings) return `<div class="sec"><div class="label">Torta con anillos</div><p class="muted">Esta torta tiene anillos: edítala en la pestaña JSON.</p></div>`;
  sp.slices = sp.slices || [];
  const matrix = [["Etiqueta", "Valor"], ...sp.slices.map(s => [s.label ?? "", numText(s.value)])];
  return `<div class="sec"><div class="label">Partes de la torta</div>
      <div class="grid" data-grid="pie" data-matrix="${esc(JSON.stringify(matrix))}"></div>
      <div class="frow" style="margin-top:8px">
        <label class="switch" style="flex-direction:row;align-items:center"><input type="checkbox" data-p="percent" data-inv="1" ${sp.percent === false ? "" : "checked"}> Mostrar %</label>
        <label class="switch" style="flex-direction:row;align-items:center"><input type="checkbox" data-p="values" data-inv="1" ${sp.values === false ? "" : "checked"}> Mostrar valores</label>
      </div></div>
    <div class="sec"><div class="frow">${inp("title", "Título", sp.title)}</div></div>`;
}

function tableForm(sp) {
  const spans = [...(sp.headers || []), ...(sp.rows || []).flat()].some(c => c && typeof c === "object");
  if (spans) return `<div class="sec"><div class="label">Tabla con celdas combinadas</div><p class="muted">Esta tabla une celdas: edítala en la pestaña JSON (cada celda combinada es {"text", "colspan", "rowspan"}).</p></div>
    <div class="sec"><div class="frow">${inp("title", "Título", sp.title)}</div></div>`;
  const head = sp.headers && sp.headers.length;
  const matrix = [...(head ? [sp.headers.map(String)] : []), ...(sp.rows || []).map(r => r.map(c => String(c ?? "")))];
  return `<div class="sec"><div class="label">Celdas</div>
      <label class="switch" style="margin-bottom:8px"><input type="checkbox" id="st-head" ${head ? "checked" : ""}> La primera fila es el encabezado</label>
      <div class="grid" data-grid="table" data-matrix="${esc(JSON.stringify(matrix.length ? matrix : [["", ""]]))}"></div>
      <p class="muted" style="font-size:12px;margin:6px 0 0">Copia la tabla tal como está impresa; deja vacías las celdas vacías. Puedes pegar desde Excel.</p></div>
    <div class="sec"><div class="frow">${inp("title", "Título", sp.title)}${inp("maxWidth", "Ancho máximo (px)", numText(sp.maxWidth), "number")}</div></div>`;
}

function mapForm(sp) {
  const doc = MAPDOCS[sp.region];
  const names = doc ? doc.features.map(f => f.name).sort((a, b) => a.localeCompare(b, "es")) : [];
  const fills = sp.fills || {};
  const unknown = Object.keys(fills).filter(n => !names.includes(n));
  const fillOpts = (cur) => sel(MAP_FILLS.some(([v]) => v === (cur ?? "")) ? MAP_FILLS : [...MAP_FILLS, [cur, cur]], cur ?? "");
  const legend = (sp.legend || []).map((l, i) => `<div class="frow" style="grid-template-columns:1fr 140px auto;align-items:end">
      <label>Texto<input data-p="legend.${i}.label" value="${esc(l.label)}"></label><label>Relleno<select data-p="legend.${i}.fill">${fillOpts(l.fill)}</select></label>
      <button class="ib warn" onclick="studio.draft.spec.legend.splice(${i},1);drawStudioForm()">✕</button></div>`).join("");
  return `<div class="sec"><div class="label">Mapa</div>
      <div class="frow"><label>Región<select onchange="studio.draft.spec.region = this.value; drawStudioForm()">${sel(Object.entries(REGIONS), sp.region)}</select></label>${inp("title", "Título", sp.title)}</div>
      ${doc ? "" : `<div class="note bad">No se cargó el contorno de esta región.</div>`}
      ${unknown.length ? `<div class="note warn">Áreas que el mapa no tiene: ${esc(unknown.join(", "))}. <a href="#" onclick="unknownOut();return false">Quitarlas</a></div>` : ""}
    </div>
    <div class="sec"><div class="label">Relleno de cada área (como en el escaneo)</div>
      <div class="frow" style="grid-template-columns:1fr auto auto"><label>Pintar todas con<select id="st-allfill">${sel(MAP_FILLS, "")}</select></label>
        <button class="ib" style="align-self:end" onclick="fillAll()">Aplicar a todas</button></div>
      <div class="arealist">${names.map(n => `<label><span>${esc(n)}</span><select data-area="${esc(n)}">${fillOpts(fills[n])}</select></label>`).join("")}</div>
    </div>
    <div class="sec"><div class="label">Leyenda</div>${legend}<button class="ib" onclick="(studio.draft.spec.legend = studio.draft.spec.legend || []).push({label:'', fill:'#bbbbbb'});drawStudioForm()">+ Entrada</button>
      <p class="muted" style="font-size:12px">Puntos y rótulos (ciudades, nombres) van en la pestaña JSON: points y labels con lon y lat.</p></div>`;
}
function unknownOut() { const sp = studio.draft.spec, names = new Set((MAPDOCS[sp.region]?.features || []).map(f => f.name)); Object.keys(sp.fills || {}).forEach(n => { if (!names.has(n)) delete sp.fills[n]; }); drawStudioForm(); }
function fillAll() { const v = $("#st-allfill").value, sp = studio.draft.spec; sp.fills = {}; if (v) (MAPDOCS[sp.region]?.features || []).forEach(f => { sp.fills[f.name] = v; }); drawStudioForm(); }

// A small spreadsheet: edit cells, add or remove rows and columns, paste a block from Excel.
function bindGrids() {
  document.querySelectorAll("#st-form [data-grid]").forEach(el => {
    const kind = el.dataset.grid;
    let m = JSON.parse(el.dataset.matrix);
    const fixedCols = kind === "pts" || kind === "pie";
    const hasHead = () => kind !== "table" || $("#st-head")?.checked;
    const draw = () => {
      const cols = Math.max(...m.map(r => r.length));
      m = m.map(r => [...r, ...Array(cols - r.length).fill("")]);
      el.innerHTML = `<table><tbody>${m.map((r, i) => `<tr>
        <td class="rh">${i === 0 && hasHead() ? "" : `<button class="x" title="Quitar fila" data-delrow="${i}">✕</button>`}</td>
        ${r.map((c, j) => { const head = i === 0 && hasHead(); const tag = head ? "th" : "td";
          const ro = head && fixedCols ? "readonly" : "";
          return `<${tag}><input ${head ? `data-hcol="${j}"` : ""} data-r="${i}" data-c="${j}" value="${esc(c)}" ${ro} ${head && j === 0 && kind === "cat" ? "readonly" : ""} placeholder="${head && kind === "cat" && j > 0 ? `Serie ${j}` : ""}"></${tag}>`; }).join("")}
        ${i === 0 && !fixedCols && cols > 1 ? "" : ""}</tr>`).join("")}
        ${!fixedCols ? `<tr><td class="rh"></td>${m[0].map((_, j) => `<td style="text-align:center">${(kind === "cat" && j === 0) || m[0].length <= 1 ? "" : `<button class="x" data-delcol="${j}" title="Quitar columna">✕ col</button>`}</td>`).join("")}</tr>` : ""}
        </tbody></table>`;
      const btns = el.nextElementSibling?.classList?.contains("gbtns") ? el.nextElementSibling : el.insertAdjacentElement("afterend", Object.assign(document.createElement("div"), { className: "gbtns" }));
      btns.innerHTML = `<button class="ib" data-addrow>+ Fila</button>${fixedCols ? "" : `<button class="ib" data-addcol>+ ${kind === "cat" ? "Serie" : "Columna"}</button>`}`;
      btns.querySelector("[data-addrow]").onclick = () => { m.push(Array(m[0].length).fill("")); commit(true); };
      const ac = btns.querySelector("[data-addcol]"); if (ac) ac.onclick = () => { m = m.map(r => [...r, ""]); commit(true); };
    };
    const commit = (redraw) => { apply(kind, m, el); if (redraw && (kind === "cat")) { drawStudioForm(); return; } if (redraw) draw(); studioPreview(); };
    el.addEventListener("input", e => {
      const t = e.target; if (t.dataset.r == null) return;
      m[+t.dataset.r][+t.dataset.c] = t.value;
      commit(false);
      if (kind === "cat" && t.dataset.hcol) { const b = document.querySelectorAll("#st-form .serrow > b")[+t.dataset.hcol - 1]; if (b) b.textContent = t.value || `Serie ${t.dataset.hcol}`; }
    });
    el.addEventListener("click", e => {
      const t = e.target;
      if (t.dataset.delrow != null) { m.splice(+t.dataset.delrow, 1); if (!m.length) m = [Array(2).fill("")]; commit(true); }
      if (t.dataset.delcol != null) { const j = +t.dataset.delcol; m = m.map(r => r.filter((_, k) => k !== j)); commit(true); }
    });
    el.addEventListener("keydown", e => {
      const t = e.target;
      if (e.key === "Enter" && t.dataset.r != null) {
        e.preventDefault();
        const r = +t.dataset.r + 1, c = +t.dataset.c;
        if (r >= m.length) { m.push(Array(m[0].length).fill("")); commit(true); }
        el.querySelector(`[data-r="${r}"][data-c="${c}"]`)?.focus();
      }
    });
    el.addEventListener("paste", e => {
      const t = e.target, text = e.clipboardData?.getData("text/plain") || "";
      if (t.dataset.r == null || !/[\t\n]/.test(text.trim())) return;
      e.preventDefault();
      const rows = text.replace(/\r/g, "").replace(/\n$/, "").split("\n").map(l => l.split("\t"));
      const r0 = +t.dataset.r, c0 = +t.dataset.c;
      rows.forEach((row, i) => row.forEach((v, j) => {
        const r = r0 + i, c = c0 + j;
        if (fixedCols && c >= m[0].length) return;
        while (m.length <= r) m.push(Array(m[0].length).fill(""));
        if (c >= m[0].length) m = m.map(x => [...x, ""]);
        m[r][c] = v.trim();
      }));
      commit(true);
      toast(`${rows.length} filas pegadas`);
    });
    if (kind === "table") $("#st-head").onchange = () => { apply(kind, m, el); draw(); studioPreview(); };
    draw();
  });
}

// Writes the grid back into the spec. Blank rows at the end are ignored.
function apply(kind, m, el) {
  const sp = studio.draft.spec;
  const blank = r => r.every(c => String(c).trim() === "");
  const body = m.slice(1);
  while (body.length && blank(body[body.length - 1])) body.pop();
  if (kind === "cat") {
    const names = m[0].slice(1);
    sp.categories = body.map(r => r[0]);
    sp.series = names.map((nm, i) => {
      const old = sp.series[i] || (sp.kind === "combo" ? { type: "line" } : {});
      return { ...old, name: nm, values: body.map(r => { const v = parseNum(r[i + 1]); return v === null && sp.kind === "bar" ? 0 : v; }) };
    });
  } else if (kind === "pts") {
    const s = sp.series[+el.dataset.series];
    s.points = body.filter(r => !blank(r)).map(r => [parseNum(r[0]), parseNum(r[1])]);
  } else if (kind === "pie") {
    sp.slices = body.filter(r => !blank(r)).map((r, i) => ({ ...(sp.slices?.[i] || {}), label: r[0], value: parseNum(r[1]) }));
  } else if (kind === "table") {
    const all = [...m];
    while (all.length > 1 && blank(all[all.length - 1])) all.pop();
    if ($("#st-head")?.checked) { sp.headers = all[0]; sp.rows = all.slice(1); }
    else { delete sp.headers; sp.rows = all; }
  }
}

// ----- editing on the chart itself ----------------------------------------------------------
// The preview is the editor: drag a bar or point to change its value, tap a text to retype it, tap a bar,
// slice or area for its options, paint map areas with a brush, and type straight into table cells.
// Elements are matched to the spec by the order the engine draws them in; values come from the engine's own scales.

const CV_HINTS = {
  bar: "Arrastra una barra para cambiar su valor · toca una barra para más opciones · toca cualquier texto para cambiarlo",
  combo: "Arrastra las barras y los puntos de la línea · toca un texto para cambiarlo",
  line: "Arrastra un punto para cambiar su valor · toca un texto para cambiarlo",
  scatter: "Arrastra un punto para moverlo · doble clic en un espacio vacío añade un punto · Supr quita el punto elegido",
  curve: "Arrastra los puntos para dar forma a la curva · doble clic añade un punto · Supr quita el punto elegido",
  pie: "Toca una parte o su leyenda para cambiar valor, texto y relleno",
  map: "Elige un relleno y toca los departamentos para pintarlos · sin relleno elegido, tocar uno muestra su nombre y opciones",
  table: "Escribe directamente en las celdas · Tab pasa a la siguiente",
  geometry: "Toca un texto para cambiarlo · las coordenadas van en la pestaña JSON",
  diagram: "Toca un texto para cambiarlo · las formas van en la pestaña JSON",
};

function cvSnapshot() {
  studio.hist = studio.hist || [];
  studio.hist.push(JSON.stringify(studio.draft.spec));
  if (studio.hist.length > 80) studio.hist.shift();
}
// Every change made on the chart goes through here, so it can be undone and the data panel stays in sync.
function cvCommit(fn) {
  cvSnapshot();
  fn(studio.draft.spec);
  drawStudioForm();
}
function cvUndo() {
  const last = studio.hist?.pop();
  if (!last) { toast("No hay cambios de la gráfica para deshacer"); return; }
  studio.draft.spec = JSON.parse(last);
  cvPopClose();
  drawStudioForm();
}

// Sets a value at "a.b.0.c"; array slots are emptied, never deleted, so the indexes stay put.
function cvSet(o, path, v) {
  const keys = path.split(".");
  let cur = o;
  keys.slice(0, -1).forEach((k, i) => {
    if (cur[k] == null || typeof cur[k] !== "object") cur[k] = /^\d+$/.test(keys[i + 1]) ? [] : {};
    cur = cur[k];
  });
  const last = keys[keys.length - 1];
  if (Array.isArray(cur)) cur[+last] = v ?? "";
  else if (v === undefined || v === "" || v === null) delete cur[last];
  else cur[last] = v;
}

const cvNum = (v) => typeof v === "number" && Number.isFinite(v);
const cvSvgPoint = (svg, e) => { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
const cvAttr = (el, a) => parseFloat(el.getAttribute(a));

// The plot area from the engine's own axis lines: the longest black vertical and horizontal lines.
function cvPlotBox(svg) {
  let v = null, h = null;
  svg.querySelectorAll("line").forEach(l => {
    const st = (l.getAttribute("stroke") || "").toLowerCase();
    if (st !== "#000" && st !== "#fff") return;
    const x1 = cvAttr(l, "x1"), x2 = cvAttr(l, "x2"), y1 = cvAttr(l, "y1"), y2 = cvAttr(l, "y2");
    if (x1 === x2 && (!v || Math.abs(y2 - y1) > v.len || (Math.abs(y2 - y1) === v.len && x1 < v.x))) v = { x: x1, top: Math.min(y1, y2), bottom: Math.max(y1, y2), len: Math.abs(y2 - y1) };
    if (y1 === y2 && (!h || Math.abs(x2 - x1) > h.len)) h = { y: y1, left: Math.min(x1, x2), right: Math.max(x1, x2), len: Math.abs(x2 - x1) };
  });
  if (!v || !h) return null;
  return { left: v.x, top: v.top, bottom: v.bottom, right: h.right };
}

// The same scales the engine draws with. Curves without printed numbers pad their range by 4 %.
function cvScales(sp) {
  const E = window.ICFESFigures;
  const series = sp.series || [];
  const vals = (list) => list.flatMap(s => s.values || []);
  const curveRange = (a, v) => {
    const lo = a && cvNum(a.min) ? a.min : Math.min(...v), hi = a && cvNum(a.max) ? a.max : Math.max(...v);
    const pad = (hi - lo || 1) * 0.04;
    return { lo: a && cvNum(a.min) ? a.min : lo - pad, hi: a && cvNum(a.max) ? a.max : hi + pad, step: (hi - lo || 1) / 10 };
  };
  if (sp.kind === "bar" || sp.kind === "combo") {
    return { y: E.scaleFor(sp.y, vals(series.filter(s => s.axis !== 2)), true), y2: sp.y2 ? E.scaleFor(sp.y2, vals(series.filter(s => s.axis === 2)), true) : null };
  }
  if (sp.kind === "line" && !series.some(s => Array.isArray(s.points))) return { y: E.scaleFor(sp.y, vals(series), false) };
  const pts = series.flatMap(s => s.points || []);
  if (sp.kind === "curve") {
    return { x: sp.x?.ticks === true ? E.scaleFor(sp.x, pts.map(p => p[0]), false) : curveRange(sp.x, pts.map(p => p[0])),
             y: sp.y?.ticks === true ? E.scaleFor(sp.y, pts.map(p => p[1]), false) : curveRange(sp.y, pts.map(p => p[1])) };
  }
  return { x: E.scaleFor(sp.x, pts.map(p => p[0]), false), y: E.scaleFor(sp.y, pts.map(p => p[1]), false) };
}
// Value to pixel between a (at lo) and b (at hi), and back.
function cvToPx(sc, v, a, b) { const t = sc.log ? Math.log10 : (x) => x; return a + (t(v) - t(sc.lo)) / (t(sc.hi) - t(sc.lo)) * (b - a); }
function cvFromPx(sc, p, a, b) {
  const f = (p - a) / (b - a);
  return sc.log ? Math.pow(10, Math.log10(sc.lo) + f * (Math.log10(sc.hi) - Math.log10(sc.lo))) : sc.lo + f * (sc.hi - sc.lo);
}
// Rounds a dragged value to a tenth of the axis step (a hundredth with Shift), keeping the number clean.
function cvSnap(v, sc, fine) {
  if (sc.log) return +v.toPrecision(fine ? 3 : 2);
  const unit = (sc.step || 1) / (fine ? 100 : 10);
  return +(Math.round(v / unit) * unit).toPrecision(12);
}

function cvSvgEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  return el;
}

// Draws the bar and options above the chart, then wires every part of the drawing.
function bindCanvas() {
  const sp = studio.draft.spec;
  if (!studio.drag) cvBar(sp);
  $("#cv-hint").textContent = CV_HINTS[sp.kind] || "";
  if (sp.kind === "table") { cvTable(sp); return; }
  const svg = $("#st-prev svg");
  if (!svg) return;
  const ov = cvSvgEl("g", { id: "cv-ov" });
  svg.appendChild(ov);
  const ctx = { sp, svg, ov, box: cvPlotBox(svg) };
  try {
    if (["bar", "combo", "line"].includes(sp.kind) && !(sp.series || []).some(s => Array.isArray(s.points))) cvCategoryChart(ctx);
    else if (["scatter", "curve", "line"].includes(sp.kind)) cvPointChart(ctx);
    else if (sp.kind === "pie") cvPie(ctx);
    else if (sp.kind === "map") cvMap(ctx);
  } catch (e) { console.warn("canvas", e); }
  cvTexts(ctx);
  cvMarkSelection(ctx);
}

function cvBar(sp) {
  const bar = $("#cv-bar");
  if (!bar) return;
  const undo = `<button class="ib" onclick="cvUndo()" title="Deshace el último cambio hecho en la gráfica (Ctrl+Z)" ${studio.hist?.length ? "" : "disabled"}>↶ Deshacer</button>`;
  let extra = "";
  if (["bar", "combo", "line"].includes(sp.kind) && !(sp.series || []).some(s => Array.isArray(s.points))) {
    extra = `<button class="ib" onclick="cvAddCategory()">+ ${sp.kind === "line" ? "Punto" : "Barra"} (categoría)</button><button class="ib" onclick="cvAddSeries()">+ Serie</button>`;
  } else if (["scatter", "curve", "line"].includes(sp.kind)) {
    extra = `<button class="ib" onclick="cvAddSeries()">+ Serie</button>`;
  } else if (sp.kind === "pie" && !sp.rings) {
    extra = `<button class="ib" onclick="cvCommit(s => s.slices.push({ label: 'Parte ' + (s.slices.length + 1), value: 1 }))">+ Parte</button>`;
  } else if (sp.kind === "table") {
    const spans = cvTableSpans(sp);
    extra = spans ? `<span class="muted" style="font-size:12px">Tabla con celdas combinadas: filas y columnas en la pestaña JSON</span>`
      : `<button class="ib" onclick="cvTableOp('row+')">+ Fila</button><button class="ib" onclick="cvTableOp('col+')">+ Columna</button>
         <button class="ib" onclick="cvTableOp('row-')" title="Quita la fila de la celda elegida">− Fila</button><button class="ib" onclick="cvTableOp('col-')" title="Quita la columna de la celda elegida">− Columna</button>`;
  } else if (sp.kind === "map") {
    const fills = [...(sp.legend || []).map(l => [l.fill, l.label || l.fill]), ...MAP_FILLS.filter(([v]) => v && !(sp.legend || []).some(l => l.fill === v))];
    const swatch = (v) => v.startsWith("#") ? v : v === "solid" ? "#000" : v === "white" ? "#fff" : v === "hatch" ? "repeating-linear-gradient(45deg,#000 0 2px,#fff 2px 5px)" : "radial-gradient(#000 1px,#fff 1.5px) 0 0/5px 5px";
    extra = `<span class="muted" style="font-size:12px">Pincel:</span>${fills.map(([v, l]) => `<button class="sw ${studio.brush === v ? "on" : ""}" style="background:${swatch(v)}" title="${esc(l)}" onclick="cvBrush('${esc(v)}')"></button>`).join("")}
      <button class="ib ${studio.brush === "" ? "on" : ""}" onclick="cvBrush('')" title="Toca áreas para quitarles el relleno">Borrador</button>
      ${studio.brush != null ? `<button class="ib" onclick="cvBrush(null)">Soltar pincel</button>` : ""}`;
  }
  bar.innerHTML = undo + extra;
}
function cvBrush(v) { studio.brush = studio.brush === v ? null : v; cvBar(studio.draft.spec); }

// ----- bars, lines and combos with categories ------------------------------------------------

function cvCategoryChart(ctx) {
  const { sp, svg, ov, box } = ctx;
  if (!box) return;
  const sc = cvScales(sp);
  const n = sp.categories.length;
  const horizontal = sp.kind === "bar" && sp.orientation === "horizontal";
  const barSeries = sp.series.map((s, i) => ({ s, i })).filter(({ s }) => sp.kind === "bar" || (sp.kind === "combo" && s.type === "bar"));
  // Bars: the engine draws them category by category, series by series, skipping empty values.
  const rects = [...svg.querySelectorAll('rect[stroke-width="0.8"]')];
  let k = 0;
  sp.categories.forEach((_, c) => barSeries.forEach(({ s, i }) => {
    if (!cvNum(s.values?.[c])) return;
    const r = rects[k++];
    if (!r) return;
    r.classList.add(horizontal ? "cv-h" : "cv-v");
    r.dataset.cv = `${i}:${c}`;
    r.addEventListener("pointerdown", e => cvStartValueDrag(e, ctx, sc, i, c, horizontal));
  }));
  // Line points get round handles over the engine's markers.
  const lineSeries = sp.series.map((s, i) => ({ s, i })).filter(({ s }) => sp.kind === "line" || (sp.kind === "combo" && s.type === "line"));
  const band = (box.right - box.left) / n;
  const xAt = (c) => sp.kind === "line" ? box.left + (box.right - box.left) * (n === 1 ? 0.5 : c / (n - 1)) : box.left + band * (c + 0.5);
  lineSeries.forEach(({ s, i }) => (s.values || []).forEach((v, c) => {
    if (!cvNum(v)) return;
    const axisSc = s.axis === 2 && sc.y2 ? sc.y2 : sc.y;
    const h = cvSvgEl("circle", { cx: xAt(c), cy: cvToPx(axisSc, v, box.bottom, box.top), r: 7, class: "cv-pt v" });
    h.dataset.cv = `${i}:${c}`;
    h.addEventListener("pointerdown", e => cvStartValueDrag(e, ctx, sc, i, c, false));
    ov.appendChild(h);
  }));
  ctx.catCenter = (c) => horizontal ? box.top + (box.bottom - box.top) / n * (c + 0.5) : xAt(c);
  ctx.horizontal = horizontal;
}

// Dragging a bar or a line point: the axis stays still while dragging, so the bar follows the pointer;
// it rescales when the pointer is released. A press without movement opens the options instead.
function cvStartValueDrag(e, ctx, sc, si, c, horizontal) {
  e.preventDefault();
  e.stopPropagation();
  const sp = studio.draft.spec, s = sp.series[si];
  const second = s.axis === 2 && sc.y2;
  const axisSc = second ? sc.y2 : sc.y;
  const { box } = ctx;
  const start = { x: e.clientX, y: e.clientY, before: JSON.stringify(sp) };
  let moved = false;
  const view = JSON.parse(JSON.stringify(sp));
  const ax = second ? "y2" : "y";
  if (!axisSc.log) view[ax] = { ...(view[ax] || {}), min: axisSc.ticks[0], max: axisSc.ticks[axisSc.ticks.length - 1], step: axisSc.step };
  const move = (ev) => {
    if (!moved && Math.hypot(ev.clientX - start.x, ev.clientY - start.y) < 4) return;
    if (!moved) { moved = true; studio.drag = true; cvPopClose(); }
    const svg = $("#st-prev svg");
    const p = cvSvgPoint(svg, ev);
    const v = horizontal ? cvFromPx(axisSc, p.x, box.left, box.right) : cvFromPx(axisSc, p.y, box.bottom, box.top);
    const val = cvSnap(v, axisSc, ev.shiftKey);
    s.values[c] = val;
    view.series[si].values[c] = val;
    studio.view = view;
    studioPreview();
    $("#cv-hint").textContent = `${s.name || sp.categories[c] || ""}: ${numText(val)}  (Mayús para afinar)`;
  };
  const up = () => {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    studio.view = null;
    studio.drag = false;
    if (moved) { studio.hist = studio.hist || []; studio.hist.push(start.before); studio.sel = { type: "val", si, c }; drawStudioForm(); }
    else { studio.sel = { type: "val", si, c }; studioPreview(); cvPopValue(si, c); }
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
}

function cvAddCategory(after = null) {
  cvCommit(sp => {
    const at = after == null ? sp.categories.length : after + 1;
    sp.categories.splice(at, 0, `Nueva ${sp.categories.length + 1}`);
    sp.series.forEach(s => { s.values = s.values || []; const near = s.values[at - 1] ?? s.values[at] ?? 0; s.values.splice(at, 0, cvNum(near) ? near : 0); });
    studio.sel = { type: "val", si: 0, c: at };
  });
}
function cvAddSeries() {
  cvCommit(sp => {
    const pts = (sp.series || []).some(s => Array.isArray(s.points)) || ["scatter", "curve"].includes(sp.kind);
    const base = sp.series[sp.series.length - 1];
    const s = pts ? { name: `Serie ${sp.series.length + 1}`, points: (base?.points || [[0, 0], [1, 1]]).map(([x, y]) => [x, y]) }
      : { name: `Serie ${sp.series.length + 1}`, values: (base?.values || sp.categories.map(() => 0)).slice() };
    if (sp.kind === "combo") s.type = "line";
    sp.series.push(s);
  });
}

// ----- scatter, curves and lines with numeric x ------------------------------------------------

function cvPointChart(ctx) {
  const { sp, svg, ov, box } = ctx;
  if (!box) return;
  const sc = cvScales(sp);
  const right = sp.kind === "curve" ? box.right : box.right;
  const P = ([x, y]) => [cvToPx(sc.x, x, box.left, right), cvToPx(sc.y, y, box.bottom, box.top)];
  // An invisible plot area under the handles: double-click adds a point to the chosen series.
  const plot = cvSvgEl("rect", { x: box.left, y: box.top, width: right - box.left, height: box.bottom - box.top, class: "cv-plot" });
  plot.addEventListener("dblclick", e => {
    const p = cvSvgPoint(svg, e);
    const si = studio.sel?.si ?? 0;
    const pt = [cvSnap(cvFromPx(sc.x, p.x, box.left, right), sc.x), cvSnap(cvFromPx(sc.y, p.y, box.bottom, box.top), sc.y)];
    cvCommit(s => {
      const list = s.series[si].points;
      if (s.kind === "scatter") list.push(pt);
      else { const at = list.findIndex(q => q[0] > pt[0]); list.splice(at < 0 ? list.length : at, 0, pt); }
      studio.sel = { type: "pt", si, k: s.kind === "scatter" ? list.length - 1 : list.indexOf(pt) };
    });
  });
  ov.appendChild(plot);
  sp.series.forEach((s, si) => (s.points || []).forEach((pt, k) => {
    if (!cvNum(pt[0]) || !cvNum(pt[1])) return;
    const [x, y] = P(pt);
    const h = cvSvgEl("circle", { cx: x, cy: y, r: 7, class: "cv-pt" });
    h.dataset.cv = `${si}:${k}`;
    h.addEventListener("pointerdown", e => cvStartPointDrag(e, ctx, sc, si, k, right));
    ov.appendChild(h);
  }));
}

function cvStartPointDrag(e, ctx, sc, si, k, right) {
  e.preventDefault();
  e.stopPropagation();
  const sp = studio.draft.spec, { box } = ctx;
  const before = JSON.stringify(sp);
  const start = { x: e.clientX, y: e.clientY };
  let moved = false;
  // The axes stay still while dragging, as with bars.
  const view = JSON.parse(JSON.stringify(sp));
  const freeze = (ax, s) => {
    if (s.log) return;
    if (sp.kind === "curve" && sp[ax]?.ticks !== true) view[ax] = { ...(view[ax] || {}), min: s.lo, max: s.hi };
    else view[ax] = { ...(view[ax] || {}), min: s.ticks[0], max: s.ticks[s.ticks.length - 1], step: s.step };
  };
  freeze("x", sc.x); freeze("y", sc.y);
  const move = (ev) => {
    if (!moved && Math.hypot(ev.clientX - start.x, ev.clientY - start.y) < 4) return;
    if (!moved) { moved = true; studio.drag = true; cvPopClose(); }
    const p = cvSvgPoint($("#st-prev svg"), ev);
    const pt = [cvSnap(cvFromPx(sc.x, p.x, box.left, right), sc.x, ev.shiftKey), cvSnap(cvFromPx(sc.y, p.y, box.bottom, box.top), sc.y, ev.shiftKey)];
    sp.series[si].points[k] = pt;
    view.series[si].points[k] = pt;
    studio.view = view;
    studioPreview();
    $("#cv-hint").textContent = `(${numText(pt[0])}; ${numText(pt[1])})  (Mayús para afinar)`;
  };
  const up = () => {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    studio.view = null;
    studio.drag = false;
    studio.sel = { type: "pt", si, k };
    if (moved) {
      // Lines and curves keep their points in x order.
      if (sp.kind !== "scatter") { const list = sp.series[si].points, pt = list[k]; list.sort((a, b) => a[0] - b[0]); studio.sel.k = list.indexOf(pt); }
      studio.hist = studio.hist || []; studio.hist.push(before); drawStudioForm();
    } else { studioPreview(); cvPopPoint(si, k); }
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
}

// ----- pies -----------------------------------------------------------------------------------

function cvPie(ctx) {
  const { sp, svg } = ctx;
  const rings = sp.rings || [{ slices: sp.slices }];
  const shapes = [...svg.querySelectorAll(":scope > path, :scope > circle")];
  const legend = [...svg.querySelectorAll('rect[x="262"]')];
  const texts = [...svg.querySelectorAll('text[x="278"]')];
  let k = 0, idx = 0;
  rings.forEach((ring, r) => {
    const total = ring.slices.reduce((t, s) => t + (cvNum(s.value) ? s.value : 0), 0);
    ring.slices.forEach((s, j) => {
      const frac = total ? s.value / total : 0;
      const tag = (el) => { if (!el) return; el.classList.add("cv-c"); el.dataset.cv = `${r}:${j}`; el.addEventListener("click", ev => { ev.stopPropagation(); studio.sel = { type: "slice", r, j }; cvMarkSelection(ctx); cvPopSlice(r, j); }); };
      if (frac > 0) { tag(shapes[k++]); if (frac >= 0.9999 && sp.rings) k++; }
      tag(legend[idx]);
      if (texts[idx]) { texts[idx].dataset.slice = `${r}:${j}`; tag(texts[idx]); }
      idx++;
    });
  });
}

// ----- maps -----------------------------------------------------------------------------------

function cvMap(ctx) {
  const { sp, svg } = ctx;
  const doc = MAPDOCS[sp.region];
  if (!doc) return;
  const paths = [...svg.querySelectorAll('path[stroke-width="0.7"]')];
  doc.features.forEach((f, i) => {
    const p = paths[i];
    if (!p) return;
    p.classList.add("cv-c");
    p.setAttribute("pointer-events", "all");
    p.addEventListener("pointerenter", () => { $("#cv-hint").textContent = f.name + (sp.fills?.[f.name] ? ` · ${cvFillName(sp, sp.fills[f.name])}` : " · sin relleno"); });
    p.addEventListener("click", e => {
      e.stopPropagation();
      if (studio.brush != null) { cvCommit(s => { s.fills = s.fills || {}; if (studio.brush) s.fills[f.name] = studio.brush; else delete s.fills[f.name]; }); return; }
      studio.sel = { type: "area", name: f.name };
      cvPopArea(f.name);
    });
  });
  // Tapping a legend box picks up its fill as the brush.
  [...svg.querySelectorAll('rect[width="10"]')].forEach((r, i) => {
    const l = (sp.legend || [])[i];
    if (!l) return;
    r.classList.add("cv-c");
    r.addEventListener("click", e => { e.stopPropagation(); studio.brush = l.fill; cvBar(sp); toast(`Pincel: ${l.label || l.fill}. Toca los departamentos para pintarlos`); });
  });
}
function cvFillName(sp, v) { return (sp.legend || []).find(l => l.fill === v)?.label || MAP_FILLS.find(([x]) => x === v)?.[1] || v; }

// ----- texts ------------------------------------------------------------------------------------

// Every printed text that comes from the spec can be retyped in place. Category labels may be wrapped
// over several lines, so they are matched by position; everything else by its exact text.
function cvTexts(ctx) {
  const { sp, svg } = ctx;
  const strings = [];
  const walk = (o, path) => {
    if (typeof o === "string") { if (o.trim()) strings.push([o, path]); return; }
    if (Array.isArray(o)) o.forEach((v, i) => walk(v, path ? `${path}.${i}` : String(i)));
    else if (o && typeof o === "object") Object.entries(o).forEach(([k, v]) => { if (!["kind", "region", "pattern", "marker", "style", "fill", "type", "format", "orientation", "anchor", "scale", "fills"].includes(k)) walk(v, path ? `${path}.${k}` : k); });
  };
  walk(sp, "");
  const box = ctx.box;
  const sc = box && cvScales(sp);
  svg.querySelectorAll("text").forEach(t => {
    if (t.dataset.slice) return;
    const txt = t.textContent;
    let path = strings.find(([s]) => s === txt)?.[1];
    // Wrapped category lines.
    if (!path && sp.categories && ctx.catCenter) {
      const near = sp.categories.map((c, i) => [i, String(c)]).filter(([, c]) => c.replace(/\s+/g, " ").includes(txt));
      if (near.length) {
        const at = ctx.horizontal ? cvAttr(t, "y") : cvAttr(t, "x");
        path = `categories.${near.sort((a, b) => Math.abs(ctx.catCenter(a[0]) - at) - Math.abs(ctx.catCenter(b[0]) - at))[0][0]}`;
      }
    }
    if (path && /^categories\.\d+$/.test(path) && ctx.catCenter) {
      // Two categories can share a text; the closest one wins.
      const at = ctx.horizontal ? cvAttr(t, "y") : cvAttr(t, "x");
      const same = sp.categories.map((c, i) => [i, String(c)]).filter(([, c]) => c === txt);
      if (same.length > 1) path = `categories.${same.sort((a, b) => Math.abs(ctx.catCenter(a[0]) - at) - Math.abs(ctx.catCenter(b[0]) - at))[0][0]}`;
    }
    if (path) {
      t.classList.add("cv-t");
      t.addEventListener("click", e => { e.stopPropagation(); cvEditText(t, path); });
      return;
    }
    // Axis numbers open the axis options.
    if (box && sc && /^-?[\d.,]+$/.test(txt.trim())) {
      const x = cvAttr(t, "x"), y = cvAttr(t, "y");
      const ax = y > box.bottom ? (ctx.horizontal ? "y" : "x") : x < box.left ? "y" : x > box.right ? "y2" : null;
      if (!ax) return;
      t.classList.add("cv-t");
      t.addEventListener("click", e => { e.stopPropagation(); cvPopAxis(ax); });
    }
  });
  // Missing titles can be added by clicking where they go.
  if (["bar", "line", "combo", "scatter", "curve", "pie", "map"].includes(sp.kind) && !sp.title) {
    const add = cvSvgEl("text", { x: 240, y: 14, "text-anchor": "middle", "font-size": 11, fill: "#1a6ef5", class: "cv-t", "font-family": "Arial" });
    add.textContent = "+ título";
    add.addEventListener("click", e => { e.stopPropagation(); cvEditText(add, "title", ""); });
    ctx.ov.appendChild(add);
  }
}

function cvEditText(t, path, initial = null) {
  cvPopClose();
  const wrap = $("#cv-wrap"), r = t.getBoundingClientRect(), w = wrap.getBoundingClientRect();
  const cur = initial ?? getPath(studio.draft.spec, path) ?? "";
  const inp = Object.assign(document.createElement("input"), { className: "cvedit", value: String(cur) });
  inp.style.left = `${Math.max(0, r.left - w.left - 8)}px`;
  inp.style.top = `${Math.max(0, r.top - w.top - 6)}px`;
  inp.style.width = `${Math.max(140, r.width + 40)}px`;
  wrap.appendChild(inp);
  inp.focus();
  inp.select();
  let done = false;
  const finish = (keep) => {
    if (done) return;
    done = true;
    inp.remove();
    if (keep && inp.value !== String(cur)) cvCommit(sp => cvSet(sp, path, inp.value.trim()));
  };
  inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); finish(true); } if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); finish(false); } });
  inp.addEventListener("blur", () => finish(true));
}

// ----- option panels -------------------------------------------------------------------------------

function cvPopClose() { $("#cv-pop")?.remove(); }
function cvPop(html, anchor) {
  cvPopClose();
  const wrap = $("#cv-wrap");
  const pop = Object.assign(document.createElement("div"), { className: "cvpop", id: "cv-pop", innerHTML: html + `<div class="row" style="justify-content:flex-end"><button class="ib" onclick="cvPopClose()">Listo</button></div>` });
  wrap.appendChild(pop);
  const w = wrap.getBoundingClientRect();
  const a = anchor?.getBoundingClientRect?.();
  const left = a ? Math.min(w.width - 256, Math.max(0, a.right - w.left + 8)) : 8;
  const top = a ? Math.max(0, Math.min(a.top - w.top, w.height - 40)) : 8;
  pop.style.left = `${left}px`;
  pop.style.top = `${top}px`;
  // Typing in the panel changes the chart as you type; each field is one undo step.
  pop.addEventListener("focusin", e => { if (e.target.matches("input,select")) cvSnapshot(); });
  return pop;
}
const cvField = (label, attrs, val) => `<label>${label}<input ${attrs} value="${esc(val ?? "")}"></label>`;
function cvLive(pop, apply) {
  pop.addEventListener("input", e => { apply(e.target, studio.draft.spec); drawStudioForm(); });
  pop.addEventListener("change", e => { if (e.target.tagName === "SELECT") { apply(e.target, studio.draft.spec); drawStudioForm(); } });
}

function cvPopValue(si, c) {
  const sp = studio.draft.spec, s = sp.series[si];
  const isBar = sp.kind === "bar" || (sp.kind === "combo" && s.type === "bar");
  const pop = cvPop(`<b>${esc(sp.categories[c] || "")} · ${esc(s.name || `Serie ${si + 1}`)}</b>
    ${cvField("Valor", 'data-k="v" inputmode="decimal"', numText(s.values[c]))}
    ${cvField("Categoría", 'data-k="cat"', sp.categories[c])}
    ${cvField("Nombre de la serie (leyenda)", 'data-k="name"', s.name)}
    ${isBar ? `<label>Relleno<select data-k="pattern">${sel(PATTERNS, s.pattern)}</select></label>`
      : `<label>Marcador<select data-k="marker">${sel(MARKERS, s.marker)}</select></label><label>Trazo<select data-k="style">${sel(STYLES, s.style)}</select></label>`}
    <div class="row"><button class="ib" onclick="cvAddCategory(${c})">+ Categoría después</button>
      <button class="ib warn" onclick="cvDropCategory(${c})">Quitar categoría</button>
      ${sp.series.length > 1 ? `<button class="ib warn" onclick="cvDropSeries(${si})">Quitar serie</button>` : ""}</div>`,
    document.querySelector(`#st-prev [data-cv="${si}:${c}"]`));
  cvLive(pop, (t, spec) => {
    const ss = spec.series[si];
    if (t.dataset.k === "v") { const v = parseNum(t.value); if (cvNum(v)) ss.values[c] = v; }
    if (t.dataset.k === "cat") spec.categories[c] = t.value;
    if (t.dataset.k === "name") ss.name = t.value;
    if (["pattern", "marker", "style"].includes(t.dataset.k)) cvSet(ss, t.dataset.k, t.value || undefined);
  });
}
function cvDropCategory(c) {
  cvPopClose();
  cvCommit(sp => { sp.categories.splice(c, 1); sp.series.forEach(s => s.values?.splice(c, 1)); studio.sel = null; });
}
function cvDropSeries(si) { cvPopClose(); cvCommit(sp => { sp.series.splice(si, 1); studio.sel = null; }); }

function cvPopPoint(si, k) {
  const sp = studio.draft.spec, s = sp.series[si], pt = s.points[k];
  const pop = cvPop(`<b>Punto ${k + 1} · ${esc(s.name || `Serie ${si + 1}`)}</b>
    <div class="row">${cvField("x", 'data-k="x" inputmode="decimal" style="width:100px"', numText(pt[0]))}${cvField("y", 'data-k="y" inputmode="decimal" style="width:100px"', numText(pt[1]))}</div>
    ${cvField("Nombre de la serie (leyenda)", 'data-k="name"', s.name)}
    ${sp.kind === "curve" ? cvField("Rótulo sobre la curva", 'data-k="label"', s.label) : `<label>Marcador<select data-k="marker">${sel(MARKERS, s.marker)}</select></label>`}
    <label>Trazo<select data-k="style">${sel(STYLES, s.style)}</select></label>
    <div class="row"><button class="ib warn" onclick="cvDropPoint(${si}, ${k})">Quitar punto (Supr)</button>
      ${sp.series.length > 1 ? `<button class="ib warn" onclick="cvDropSeries(${si})">Quitar serie</button>` : ""}</div>`,
    document.querySelector(`#st-prev [data-cv="${si}:${k}"]`));
  cvLive(pop, (t, spec) => {
    const ss = spec.series[si];
    if (t.dataset.k === "x" || t.dataset.k === "y") { const v = parseNum(t.value); if (cvNum(v)) ss.points[k][t.dataset.k === "x" ? 0 : 1] = v; }
    if (t.dataset.k === "name") ss.name = t.value;
    if (["label", "marker", "style"].includes(t.dataset.k)) cvSet(ss, t.dataset.k, t.value || undefined);
  });
}
function cvDropPoint(si, k) {
  const pts = studio.draft.spec.series[si].points;
  if (pts.length <= 2) { toast("Una serie necesita al menos dos puntos", true); return; }
  cvPopClose();
  cvCommit(sp => { sp.series[si].points.splice(k, 1); studio.sel = null; });
}

function cvPopSlice(r, j) {
  const sp = studio.draft.spec;
  const ring = sp.rings ? sp.rings[r] : { slices: sp.slices };
  const s = ring.slices[j];
  const base = sp.rings ? `rings.${r}.slices.${j}` : `slices.${j}`;
  const pop = cvPop(`<b>${esc(s.label || `Parte ${j + 1}`)}</b>
    ${cvField("Texto", 'data-k="label"', s.label)}
    ${cvField("Valor", 'data-k="value" inputmode="decimal"', numText(s.value))}
    <label>Relleno<select data-k="pattern">${sel(PATTERNS, s.pattern)}</select></label>
    ${sp.rings ? "" : `<div class="row"><button class="ib warn" onclick="cvDropSlice(${j})">Quitar parte</button></div>`}`,
    document.querySelector(`#st-prev path[data-cv="${r}:${j}"], #st-prev circle[data-cv="${r}:${j}"]`) || document.querySelector(`#st-prev [data-cv="${r}:${j}"]`));
  cvLive(pop, (t, spec) => {
    if (t.dataset.k === "value") { const v = parseNum(t.value); if (cvNum(v)) cvSet(spec, `${base}.value`, v); }
    else cvSet(getPath(spec, base), t.dataset.k, t.value || undefined);
  });
}
function cvDropSlice(j) {
  if (studio.draft.spec.slices.length <= 1) return;
  cvPopClose();
  cvCommit(sp => { sp.slices.splice(j, 1); studio.sel = null; });
}

function cvPopArea(name) {
  const sp = studio.draft.spec;
  const cur = sp.fills?.[name] || "";
  const opts = [...(sp.legend || []).map(l => [l.fill, `${l.label} (leyenda)`]), ...MAP_FILLS];
  const pop = cvPop(`<b>${esc(name)}</b><label>Relleno<select data-k="fill">${sel(opts.some(([v]) => v === cur) ? opts : [...opts, [cur, cur]], cur)}</select></label>
    <p class="muted" style="font-size:12px;margin:0">Para pintar varias seguidas, elige un pincel arriba.</p>`,
    document.querySelector(`#st-prev`));
  cvLive(pop, (t, spec) => { spec.fills = spec.fills || {}; if (t.value) spec.fills[name] = t.value; else delete spec.fills[name]; });
}

function cvPopAxis(ax) {
  const sp = studio.draft.spec, a = sp[ax] || {};
  const name = { x: "Eje X", y: sp.orientation === "horizontal" ? "Eje de valores" : "Eje Y", y2: "Segundo eje Y" }[ax];
  const pop = cvPop(`<b>${name}</b>
    ${cvField("Título del eje", 'data-k="label"', a.label)}
    <div class="row">${cvField("Mínimo", 'data-k="min" inputmode="decimal" style="width:68px"', numText(a.min))}${cvField("Máximo", 'data-k="max" inputmode="decimal" style="width:68px"', numText(a.max))}${cvField("Cada", 'data-k="step" inputmode="decimal" style="width:68px"', numText(a.step))}</div>
    <p class="muted" style="font-size:12px;margin:0">Vacío = automático.</p>`, document.querySelector("#st-prev"));
  cvLive(pop, (t, spec) => {
    const k = t.dataset.k;
    const v = k === "label" ? t.value : parseNum(t.value);
    if (k !== "label" && t.value.trim() && !cvNum(v)) return;
    cvSet(spec, `${ax}.${k}`, k === "label" ? (v || undefined) : (t.value.trim() ? v : undefined));
    if (spec[ax] && !Object.keys(spec[ax]).length) delete spec[ax];
  });
}

// ----- the chosen element stays outlined -------------------------------------------------------------

function cvMarkSelection(ctx) {
  ctx.ov.querySelectorAll(".cv-sel").forEach(x => x.remove());
  ctx.svg.querySelectorAll(".cv-pt.sel").forEach(x => x.classList.remove("sel"));
  const s = studio.sel;
  if (!s) return;
  const key = s.type === "val" ? `${s.si}:${s.c}` : s.type === "pt" ? `${s.si}:${s.k}` : s.type === "slice" ? `${s.r}:${s.j}` : null;
  if (!key) return;
  const el = ctx.svg.querySelector(`[data-cv="${key}"]:not(text):not(rect[x="262"])`);
  if (!el) return;
  if (el.classList.contains("cv-pt")) { el.classList.add("sel"); return; }
  const b = el.getBBox();
  ctx.ov.appendChild(cvSvgEl("rect", { x: b.x - 3, y: b.y - 3, width: b.width + 6, height: b.height + 6, class: "cv-sel" }));
}

// ----- tables: type straight into the cells -------------------------------------------------------------

function cvTableSpans(sp) { return [...(sp.headers || []), ...(sp.rows || []).flat()].some(c => c && typeof c === "object"); }
function cvTable(sp) {
  const table = $("#st-prev table");
  if (!table) return;
  const rows = [...(sp.headers && sp.headers.length ? [{ path: "headers" }] : []), ...(sp.rows || []).map((_, i) => ({ path: `rows.${i}` }))];
  [...table.querySelectorAll("tr")].forEach((tr, r) => {
    const row = rows[r];
    if (!row) return;
    [...tr.children].forEach((cell, k) => {
      cell.contentEditable = "true";
      cell.dataset.cell = `${row.path}.${k}`;
      cell.dataset.r = r;
      cell.dataset.k = k;
    });
  });
  const cap = table.querySelector("caption");
  if (cap) { cap.contentEditable = "true"; cap.dataset.cell = "title"; }
  let before = null;
  table.addEventListener("focusin", e => {
    before = JSON.stringify(sp);
    studio.cell = e.target.dataset.cell ? { r: +e.target.dataset.r, k: +e.target.dataset.k } : null;
    // Typing replaces the cell, as in a spreadsheet.
    const range = document.createRange();
    range.selectNodeContents(e.target);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
  });
  table.addEventListener("input", e => {
    const p = e.target.dataset.cell;
    if (!p) return;
    const text = e.target.innerText.replace(/\n+/g, " ").trim();
    const cur = getPath(sp, p);
    if (cur && typeof cur === "object") cur.text = text;
    else cvSet(sp, p, text);
  });
  table.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); e.target.blur(); }
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); if (before) studio.draft.spec = JSON.parse(before); before = null; drawStudioForm(); }
  });
  table.addEventListener("focusout", e => {
    if (before && before !== JSON.stringify(sp)) { studio.hist = studio.hist || []; studio.hist.push(before); }
    before = null;
    // Redraw after focus moves on, so Tab still lands in the next cell.
    setTimeout(() => { if (!$("#st-prev table")?.contains(document.activeElement)) drawStudioForm(); }, 0);
  });
}
function cvTableOp(op) {
  const sp = studio.draft.spec;
  if (cvTableSpans(sp)) return;
  const head = sp.headers && sp.headers.length ? 1 : 0;
  const at = studio.cell || { r: (sp.rows || []).length - 1 + head, k: Math.max(0, (sp.headers || sp.rows?.[0] || [""]).length - 1) };
  cvCommit(s => {
    s.rows = s.rows || [];
    const width = Math.max((s.headers || []).length, ...s.rows.map(r => r.length), 1);
    if (op === "row+") s.rows.splice(Math.max(0, at.r - head + 1), 0, Array(width).fill(""));
    if (op === "row-" && at.r >= head && s.rows.length > 1) s.rows.splice(at.r - head, 1);
    if (op === "col+") { if (head) s.headers.splice(at.k + 1, 0, ""); s.rows.forEach(r => r.splice(at.k + 1, 0, "")); }
    if (op === "col-" && width > 1) { if (head) s.headers.splice(at.k, 1); s.rows.forEach(r => r.splice(at.k, 1)); }
  });
  studio.cell = null;
}

// Studio keys: Ctrl+Z undoes a chart change, Supr removes the chosen point, Esc closes a panel first.
function cvKey(e) {
  const typing = /TEXTAREA|INPUT|SELECT/.test(e.target.tagName) || e.target.isContentEditable;
  if (e.key === "Escape" && $("#cv-pop")) { cvPopClose(); return true; }
  if (typing) return false;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); cvUndo(); return true; }
  if ((e.key === "Delete" || e.key === "Backspace") && studio.sel?.type === "pt") { e.preventDefault(); cvDropPoint(studio.sel.si, studio.sel.k); return true; }
  return false;
}

async function saveStudio() {
  const dr = studio.draft;
  if (!dr) return;
  if (studio.mode === "json") { try { dr.spec = JSON.parse($("#st-json").value); } catch (e) { toast("El JSON no es válido: " + e.message, true); return; } }
  const problems = figProblems({ kind: dr.spec.kind, spec: dr.spec });
  if (problems.length && !confirm(`La figura todavía tiene problemas y la pregunta seguirá oculta:\n\n• ${problems.slice(0, 5).join("\n• ")}\n\n¿Guardar de todos modos?`)) return;
  try {
    await api(`${qpath()}/figures/${encodeURIComponent(dr.id)}`, J("PUT", { kind: dr.spec.kind, target: dr.target, option: dr.option || null, fidelity: dr.fidelity, spec: dr.spec }));
    closeStudio();
    await reloadFigures("Figura guardada");
  } catch (e) { toast(e.message, true); }
}

setTab("progress");
</script>
