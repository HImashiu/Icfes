<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cóndor · Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="katex/katex.min.css">
<style>
/* Tokens from the student app's design spec (design/spec.md §2). Dark is the default. */
:root{--bg:#0D110F;--surface:#161B18;--surface-2:#20271F;--line:#2D3630;--text:#F2F5EF;--text-2:#A7B1AA;
 --accent:#C8F04A;--accent-ink:#C8F04A;--on-accent:#0D110F;--accent-soft:rgba(200,240,74,.14);--accent-shadow:#8DB01E;
 --flame:#FF9F43;--ok:#5FD48A;--ok-soft:rgba(95,212,138,.14);--bad:#FF7F6E;--bad-soft:rgba(255,127,110,.14);
 --paper:#FBFAF5;--paper-ink:#1B1B19;--paper-2:#5B5A55;--side:#090C0A;
 --area-lectura:#8AB4FF;--area-mate:#FFB547;--area-sociales:#F59EC4;--area-ciencias:#5ED3B4;--area-ingles:#C79BFF}
:root[data-theme="light"]{--bg:#F3F5EF;--surface:#FFFFFF;--surface-2:#E9EDE4;--line:#D8DED3;--text:#121612;--text-2:#545E57;
 --accent-ink:#4A6600;--on-accent:#121612;--accent-soft:#EEF8CF;--flame:#C25A00;--ok:#1B7F45;--ok-soft:#DDF3E5;--bad:#C2372B;--bad-soft:#FBE3E0;--side:#FFFFFF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.4 Figtree,system-ui,sans-serif;min-height:100vh}
button,select,input,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 24px;background:var(--side);border-bottom:1px solid var(--line)}
.brand{font:800 20px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.01em}
.brand small{display:block;font:700 11px/1 Figtree;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);margin-top:4px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:10px;padding:8px 14px;min-height:36px;cursor:pointer;color:var(--text-2);font-weight:600}
.seg button.on{background:var(--surface);color:var(--text)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--text-2)}
main{padding:20px 24px;max-width:1280px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.label{font:700 12px/1 Figtree;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);margin:0 0 10px}
.display{font:800 30px/1.05 "Bricolage Grotesque",sans-serif}
.title{font:600 22px/1.2 "Bricolage Grotesque",sans-serif;margin:0 0 12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.stats .card{margin:0}
.muted{color:var(--text-2)} .ok{color:var(--ok)} .bad{color:var(--bad)} .flame{color:var(--flame)} .acc{color:var(--accent-ink)}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:700 11px/1 Figtree;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
tr.row{cursor:pointer} tr.row:hover td{background:var(--surface-2)}
.num{font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--accent)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
select,input[type=text],textarea{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 10px}
textarea{width:100%;min-height:110px;font:400 14px/1.45 ui-monospace,Menlo,monospace;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:2px solid var(--line);background:var(--surface);border-radius:999px;cursor:pointer;font-weight:600}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.chip i{width:10px;height:10px;border-radius:3px;display:inline-block}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.cell{min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--text-2);font-weight:700;cursor:pointer;padding:0}
.cell.ready{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cell.hidden{border-style:dashed;color:var(--text-2)}
.cell.err{border-color:var(--bad);color:var(--bad)}
.cell.cur{border-width:3px;border-color:var(--text)}
.cell.crop,.qstrip button.crop{position:relative}
.cell.crop::after,.qstrip button.crop::after{content:"✂";position:absolute;top:-7px;right:-6px;font-size:11px;line-height:16px;width:16px;border-radius:50%;background:var(--flame);color:#0D110F}
.figcard.todo{border:2px dashed var(--flame)}
.btn{min-height:52px;padding:0 20px;border-radius:16px;border:2px solid var(--line);background:transparent;cursor:pointer;font-weight:700}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);box-shadow:0 4px 0 var(--accent-shadow)}
.btn.primary:active{box-shadow:0 0 0 var(--accent-shadow);transform:translateY(4px)}
.btn:disabled{background:var(--surface-2);color:var(--text-2);border-color:transparent;box-shadow:none;cursor:not-allowed}
.btn.sm{min-height:44px;padding:0 14px}
/* The question is paper: stimulus, stem and source sit on a light card in both themes. */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:20px;padding:18px;margin-bottom:12px}
.paper .stimulus,.paper .stem{font:400 17px/1.45 Newsreader,Georgia,serif}
.paper .stem{font-weight:500;margin-top:12px}
.paper .stimulus table,.paper .stem table{border-collapse:collapse;font-size:14px}
.paper td,.paper th{border:1px solid #c9c7bd;padding:4px 8px;background:transparent;color:inherit}
.paper .src{font:400 12px/1.4 Figtree;color:var(--paper-2);margin-top:12px}
.paper p{margin:0 0 8px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;min-height:60px;padding:12px;border:2px solid var(--line);border-bottom-width:3px;border-radius:16px;background:var(--surface);margin-bottom:10px}
.opt .tile{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-weight:700}
.opt .body{font:600 16px/1.4 Figtree}
.opt.marked{border-color:var(--flame)}
.opt.marked .tile{background:var(--flame);color:#0D110F}
.opt .body table{font-size:13px;border-collapse:collapse}
.opt .body td,.opt .body th{border:1px solid var(--line);padding:3px 6px}
.note{padding:10px 12px;border-radius:12px;margin:6px 0;font-size:13px}
.note.bad{background:var(--bad-soft)} .note.warn{background:rgba(255,159,67,.14)} .note.ok{background:var(--ok-soft)}
.badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;border:1px solid var(--line);margin:2px 4px 2px 0;color:var(--text-2)}
.badge.ok{color:var(--ok);border-color:var(--ok)} .badge.hid{color:var(--flame);border-color:var(--flame)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:920px){.grid2{grid-template-columns:1fr} main{padding:16px}.top{padding:12px 16px}}
img.scan{width:100%;border-radius:12px;border:1px solid var(--line)}
.pager{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.pager button{min-width:36px;padding:4px 10px}
img.fig{max-width:100%;background:#fff;border-radius:12px;margin:4px 0}
.figure.native{background:transparent}
.figure.native svg{max-width:100%;height:auto}
.figure-slot{display:block;padding:12px;border:1px dashed #c9c7bd;border-radius:12px;color:var(--paper-2);font-size:13px}
.figure-slot.bad{color:#b42318;border-color:#b42318}
.opt .figure{background:var(--paper);color:var(--paper-ink);border-radius:12px;padding:8px;margin-top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-width:1200px){
 body{display:grid;grid-template-columns:232px minmax(0,1fr)}
 .top{position:sticky;top:0;height:100vh;flex-direction:column;align-items:stretch;gap:16px;padding:20px 16px;border-right:1px solid var(--line);border-bottom:0}
 .top .seg{flex-direction:column}
 .top .seg button{text-align:left;min-height:44px}
 .top .spacer{flex:1}
 .top .pill{justify-content:center}
 main{max-width:none;padding:24px 28px}
}
/* ----- question workspace: page, form and preview side by side ----- */
body.editing{display:block}
body.editing .top{display:none}
body.editing main{padding:0;max-width:none}
.ed{display:flex;flex-direction:column;height:100vh}
.edbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 14px;background:var(--side);border-bottom:1px solid var(--line)}
.edbar .qnum{font:800 20px/1 "Bricolage Grotesque",sans-serif;margin:0 4px}
.edbar select{padding:6px 8px}
.ib{min-height:36px;min-width:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;color:var(--text)}
.ib:hover{border-color:var(--text-2)}
.ib:disabled{opacity:.45;cursor:not-allowed}
.ib.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.ib.go{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.ib.warn{border-color:var(--bad);color:var(--bad)}
.more{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:15;min-width:280px;display:flex;flex-direction:column;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.menu[hidden]{display:none}
.menu button{display:flex;justify-content:space-between;gap:12px;text-align:left;padding:9px 10px;border:0;border-radius:8px;background:none;color:var(--text);font:inherit;cursor:pointer}
.menu button:hover:not(:disabled){background:var(--surface-2)}
.menu button:disabled{opacity:.45;cursor:default}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu kbd{font-size:11px;color:var(--text-2)}
.nextstep{position:sticky;bottom:-12px;z-index:2;margin:14px -14px -12px;padding:12px 14px;background:var(--bg);border-top:1px solid var(--line)}
.nextstep .nsrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.nextstep .nsmiss{font-size:13px;color:var(--flame);margin-bottom:8px}
.ib.big{min-height:46px;padding:0 18px;font-size:15px}
#tour{position:fixed;inset:0;z-index:40}
#tour .tspot{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.6);outline:2px solid var(--accent);pointer-events:none}
#tour .tbub{position:fixed;width:360px;padding:14px 16px;background:var(--surface);border:1px solid var(--accent);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#tour .tbub p{margin:6px 0 12px;line-height:1.45}
#tour .row{display:flex;gap:6px;align-items:center}
.savestate{font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--text-2)}
.savestate.dirty{color:var(--flame);border-color:var(--flame)}
.savestate.ok{color:var(--ok);border-color:var(--ok)}
.savestate.bad{color:var(--bad);border-color:var(--bad)}
.edgrid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,var(--pdfw,42%)) 6px minmax(0,1fr) minmax(0,1fr)}
.edgrid.noprev{grid-template-columns:minmax(0,var(--pdfw,42%)) 6px minmax(0,1fr) 0}
.edgrid.noprev .pane.prev{display:none}
.split{cursor:col-resize;background:var(--line)}
.split:hover{background:var(--accent)}
.pane{min-height:0;overflow:auto;padding:12px 14px}
.pane.form{border-right:1px solid var(--line)}
.pane.pdf{padding:0;display:flex;flex-direction:column;background:var(--surface-2)}
.pdfbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.pdfbar input{width:52px;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.pdfscroll{flex:1;overflow:auto;position:relative}
.pdfpage{position:relative;margin:10px auto;user-select:none}
.pdfpage img{display:block;width:100%;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.35)}
.pdfpage .ov{position:absolute;inset:0}
.pdfpage.cropping .ov{cursor:crosshair}
.box{position:absolute;border:2px solid var(--accent);background:rgba(200,240,74,.18);box-shadow:0 0 0 9999px rgba(0,0,0,.25)}
.anchor{position:absolute;left:0;right:0;height:0;border-top:2px dashed var(--flame);pointer-events:none}
.anchor span{position:absolute;left:4px;top:-20px;background:var(--flame);color:#0D110F;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px}
.cropbar{position:absolute;z-index:3;display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:420px}
.cropbar .ib{min-height:32px;font-size:13px}
.cropbar .lbl{width:100%;font-size:12px;color:var(--text-2)}
.fbar{position:sticky;top:-12px;z-index:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 0;background:var(--bg)}
.fld{margin-bottom:14px}
.fld > .label{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.fld textarea{min-height:44px;overflow:hidden;font:400 14px/1.45 Figtree,system-ui,sans-serif}
.rich{display:none}
#form.visual textarea.src{display:none}
#form.visual .rich{display:block;min-height:44px;background:var(--paper);color:var(--paper-ink);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font:400 16px/1.5 Georgia,'Times New Roman',serif;outline:none;overflow-wrap:anywhere}
#form.visual .rich:focus{border-color:var(--accent)}
#form.visual .rich.empty::before{content:attr(data-ph);color:#8a8a8a;pointer-events:none}
.rich ul,.rich ol{margin:4px 0;padding-left:26px}
.rich ul{list-style:disc}.rich ol{list-style:decimal}
.rich table{border-collapse:collapse;margin:6px 0;width:auto;background:#fff;border:0;border-radius:0}
.rich th,.rich td{border:1px solid #000;padding:3px 8px;min-width:40px;color:#000;background:#fff;font:inherit;font-size:15px;text-transform:none;letter-spacing:0}
.rich th{font-weight:700}
.fgroup{display:inline-flex;gap:2px;padding:0 4px;border-left:1px solid var(--line)}
.fgroup[hidden]{display:none}
.fbar .ib.on{background:var(--accent-soft);border-color:var(--accent)}
.fbar .seg button{padding:4px 10px}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent)}
.orow{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:start;margin-bottom:8px}
.ltile{width:40px;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);font-weight:800;cursor:pointer;position:relative;color:var(--text)}
.ltile.key{background:var(--ok);border-color:var(--ok);color:#0D110F}
.ltile .mk{position:absolute;right:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--flame)}
.otools{display:flex;flex-direction:column;gap:2px}
.otools button{min-height:20px;min-width:26px;white-space:nowrap;padding:0 4px;font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;color:var(--text-2)}
.figs{display:grid;gap:8px}
.figcard{border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--surface)}
.figcard .head{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:13px}
.figcard .mini{background:var(--paper);color:var(--paper-ink);border-radius:10px;padding:6px;max-height:220px;overflow:hidden}
.figcard .mini svg,.figcard .mini img{max-width:100%;max-height:200px;display:block;margin:0 auto}
.problems{margin:6px 0 0;padding-left:18px;color:var(--bad);font-size:13px}
.switch{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-weight:600}
.switch input{width:18px;height:18px}
.qstrip{display:flex;gap:4px;overflow-x:auto;padding:6px 10px;border-top:1px solid var(--line);background:var(--side)}
.qstrip button{flex:0 0 auto;min-width:34px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--text-2);font-weight:700;font-size:12px;cursor:pointer;padding:0 4px}
.qstrip button.ready{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.qstrip button.hidden{border-style:dashed}
.qstrip button.err{border-color:var(--bad);color:var(--bad)}
.qstrip button.cur{outline:3px solid var(--text);outline-offset:1px}
.toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);z-index:50;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:80vw}
.toast.bad{background:var(--bad);color:#fff}
.keys{font-size:12px;color:var(--text-2)}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 4px;font:600 11px Figtree}
.paper img.scanfig{max-width:100%;display:block;margin:8px auto}
.opt img.scanfig{max-width:100%;background:#fff}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:grid;place-items:start center;padding-top:8vh}
.sheet{width:min(720px,92vw);max-height:80vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.hits{display:grid;gap:6px}
.hit{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px;cursor:pointer;color:var(--text);font:400 13px/1.4 Figtree}
.hit:hover{border-color:var(--accent)}
table.help{border:0}
table.help td{border-bottom:1px solid var(--line);padding:8px}
select.ib{padding:0 8px}
/* Native tables keep the app's print look inside the editor's own table styles. */
table.exam-table{border-collapse:collapse;width:auto;border:0;border-radius:0;overflow:visible;background:#fff;margin:8px 0}
table.exam-table th,table.exam-table td{border:1px solid #000;padding:4px 10px;color:#000;background:#fff;font:inherit;font-size:15px;text-transform:none;letter-spacing:0;text-align:left}
table.exam-table th{font-weight:700}
.fbar .ib{min-height:30px;padding:3px 9px;white-space:nowrap}
.fbar .seg{padding:2px}
.fbar .seg button{min-height:28px}
table.icfes-table{width:auto;border:0;border-radius:0;overflow:visible;background:#fff;margin:8px auto}
table.icfes-table th,table.icfes-table td{border:1px solid #000;padding:4px 10px;text-align:center;color:#000;background:#fff;font:400 14px/1.3 Arial,Helvetica,sans-serif;text-transform:none;letter-spacing:0;vertical-align:middle}
table.icfes-table th{font-weight:700}
table.icfes-table caption{font-weight:700;color:#000;margin-bottom:4px}
/* ----- chart and table studio ----- */
.studio{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.stbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--side)}
.stgrid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,28%) minmax(0,42%) minmax(0,30%)}
.clgrid{flex:1;min-height:0;display:grid;grid-template-columns:260px 1fr}
.cltools{padding:14px;border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column;gap:8px}
.cltools .row{display:flex;gap:6px;flex-wrap:wrap}
.cltools .ib.on{background:var(--accent-soft);border-color:var(--accent)}
.cltools .sw{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);cursor:pointer}
.cltools .sw.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.clstage{overflow:auto;padding:20px;display:flex;align-items:flex-start;justify-content:center;background:repeating-conic-gradient(#d8d8d8 0 25%,#f4f4f4 0 50%) 0 0/16px 16px}
#cl-canvas{max-width:100%;height:auto;box-shadow:0 4px 24px rgba(0,0,0,.35);cursor:crosshair;touch-action:none;image-rendering:auto}
.cvbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.cvbar .sw{width:26px;height:26px;border-radius:6px;border:2px solid var(--line);cursor:pointer;padding:0}
.cvbar .sw.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}

</style>
</head>
<body>
<header class="top">
  <div class="brand">Cóndor<small>Editor de preguntas</small></div>
  <div class="seg" role="tablist">
    <button id="tab-progress" data-tab="progress" role="tab">Progreso</button>
    <button id="tab-questions" data-tab="questions" role="tab">Preguntas</button>
  </div>
  <span class="spacer"></span>
  <span id="status" class="pill">Cargando…</span>
  <button class="pill" id="theme" title="Tema">Tema</button>
</header>
<main id="app"></main>
<script src="figures-render.js"></script>
<script src="render.bundle.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const app = $("#app");
const AREA = { "Lectura crítica": "--area-lectura", "Matemáticas": "--area-mate", "Sociales y ciudadanas": "--area-sociales", "Ciencias naturales": "--area-ciencias", "Inglés": "--area-ingles" };
const state = { tab: "progress", exam: null, filter: "all", n: null, detail: null, exams: [], rows: [], natives: {},
  page: 1, zoom: 1, engine: "auto", cropping: false, box: null, dirty: false, opts: [], lastArea: null, preview: true };
const STATIC = !!window.ICFES_STATIC;
try { state.engine = JSON.parse(localStorage.getItem("icfes-editor:engine")) || "auto"; } catch (e) { /* default */ }

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function status(text, cls = "") { const el = $("#status"); if (el) { el.textContent = text; el.className = "pill " + cls; } }
function render(html) { return window.renderRich ? window.renderRich(html || "") : esc(html); }
function areaColor(name) { return AREA[name] ? `var(${AREA[name]})` : "var(--text-2)"; }
function fmt(n) { return n == null ? "—" : Number(n).toLocaleString("es-CO"); }
let toastTimer;
function toast(text, bad = false) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : "");
  t.textContent = text;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), bad ? 6000 : 2600);
}

async function api(path, opts) {
  if (STATIC) return window.ICFES_STATIC(path, opts);
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) { const err = new Error(body.error || res.statusText); err.body = body; err.status = res.status; throw err; }
  return body;
}
const J = (method, body) => ({ method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body ?? {}) });
const qpath = (d = state.detail) => `/api/exams/${encodeURIComponent(d.exam)}/questions/${d.number}`;

// Map outlines for the figure engine (the browser cannot load them by itself).
const MAPDOCS = {};
const mapsReady = STATIC ? Promise.resolve() : Promise.all((window.ICFESFigures?.MAP_KEYS || []).map(async k => {
  try {
    const res = await fetch(`maps/${k}.json`);
    if (!res.ok) return;
    MAPDOCS[k] = await res.json();
    window.ICFESFigures.registerMap(k, MAPDOCS[k]);
  } catch (e) { /* the map stays unavailable and shows as a problem */ }
}));

function setTab(tab) {
  state.tab = tab;
  document.body.classList.remove("editing");
  document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  if (tab === "progress") showProgress(); else showQuestions();
}
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => leave(() => setTab(b.dataset.tab)));
$("#theme").onclick = () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme !== "light" ? "light" : "dark";
  remember("theme", root.dataset.theme);
};
if (recall("theme")) document.documentElement.dataset.theme = recall("theme");
window.addEventListener("beforeunload", e => { if (state.dirty) { e.preventDefault(); e.returnValue = ""; } });

// ----- progress --------------------------------------------------------------

async function showProgress() {
  status("Leyendo…");
  state.exams = await api("/api/exams");
  status(`${state.exams.length} exámenes`, "ok");
  const t = state.exams.reduce((a, e) => ({ q: a.q + e.questions, r: a.r + e.ready, h: a.h + e.hidden, er: a.er + e.errors, k: a.k + (e.key.present ? 1 : 0) }), { q: 0, r: 0, h: 0, er: 0, k: 0 });
  const rows = state.exams.map(e => {
    const pct = e.questions ? Math.round(100 * e.ready / e.questions) : 0;
    return `<tr class="row" data-exam="${esc(e.exam)}">
      <td><b>${esc(e.exam)}</b><div class="muted">${esc(e.title)}</div></td>
      <td class="num">${fmt(e.questions)}${e.expected != null && e.expected !== e.questions ? ` <span class="flame">/ ${fmt(e.expected)}</span>` : ""}</td>
      <td><div class="bar"><i style="width:${pct}%"></i></div><span class="num">${fmt(e.ready)}</span></td>
      <td class="num ${e.hidden ? "flame" : ""}">${fmt(e.hidden)}</td>
      <td class="num ${e.errors ? "bad" : "ok"}">${fmt(e.errors)}</td>
      <td class="num muted">${fmt(e.warnings)}</td>
      <td>${e.key.present ? `<span class="num">${fmt(e.key.answers)}</span> claves${e.key.disputed ? ` <span class="flame">· ${e.key.disputed} disputadas</span>` : ""}` : '<span class="bad">sin clave</span>'}</td>
      <td>${e.figures.traced ? `${e.figures.traced} del escaneo${e.figures.pending_spec ? ` <span class="flame">· ${e.figures.pending_spec} pendientes</span>` : ""}${e.figures.to_crop ? ` <span class="flame">· ✂ ${e.figures.to_crop} por recortar</span>` : ""}` : '<span class="muted">ninguna</span>'}</td>
    </tr>`;
  }).join("");
  const last = recall("last");
  const resume = last && state.exams.some(e => e.exam === last.exam)
    ? `<div class="card" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><b>Seguir donde quedaste:</b> ${esc(last.exam)} · Q${last.n}
       <button class="btn sm primary" id="resume">Abrir</button>
       <button class="btn sm" onclick="openSearch()">🔍 Buscar una pregunta</button></div>` : "";
  app.innerHTML = resume + `
    <div class="stats">
      <div class="card"><div class="label">Preguntas</div><div class="display num">${fmt(t.q)}</div></div>
      <div class="card"><div class="label">Listas</div><div class="display num acc">${fmt(t.r)}</div><div class="muted">${Math.round(100 * t.r / (t.q || 1))} % de ${fmt(t.q)}</div></div>
      <div class="card"><div class="label">Ocultas a estudiantes</div><div class="display num flame">${fmt(t.h)}</div></div>
      <div class="card"><div class="label">Errores del validador</div><div class="display num bad">${fmt(t.er)}</div></div>
      <div class="card"><div class="label">Con clave</div><div class="display num">${t.k}<span class="muted" style="font-size:16px"> / ${state.exams.length}</span></div></div>
    </div>
    <table>
      <thead><tr><th>Examen</th><th>Preguntas</th><th>Listas</th><th>Ocultas</th><th>Errores</th><th>Avisos</th><th>Clave</th><th>Figuras</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <p class="muted">Toca un examen para ver sus preguntas.</p>`;
  app.querySelectorAll("tr[data-exam]").forEach(tr => tr.onclick = () => { state.exam = tr.dataset.exam; state.n = null; setTab("questions"); });
  if ($("#resume")) $("#resume").onclick = () => { state.exam = last.exam; openQuestion(last.n, { reloadExam: true }); };
}

// ----- question map ----------------------------------------------------------

const FILTERS = [["all", "Todas"], ["hidden", "Ocultas"], ["errors", "Con errores"], ["badfig", "Figura inválida"], ["crop", "Por recortar"], ["warnings", "Avisos"], ["notready", "No listas"]];

// Problems of one native figure, in plain words. An empty list means the engine can draw it.
const MSG = [
  [/^x\.label is required/, () => "Falta el título del eje X"],
  [/^y\.label is required/, () => "Falta el título del eje Y"],
  [/^y2.*label.*required/, () => "Falta el título del segundo eje Y"],
  [/^categories must be a non-empty array/, () => "Agrega al menos una categoría (fila)"],
  [/^series must be a non-empty array/, () => "Agrega al menos una serie"],
  [/^series\[(\d+)\]\.values must have one entry per category/, m => `La serie ${+m[1] + 1} necesita un valor en cada fila`],
  [/^series\[(\d+)\]\.values\[(\d+)\] must be a number/, m => `Serie ${+m[1] + 1}, fila ${+m[2] + 1}: escribe un número`],
  [/^series\[(\d+)\]\.values\[(\d+)\] must not be negative/, m => `Serie ${+m[1] + 1}, fila ${+m[2] + 1}: las barras no pueden ser negativas`],
  [/^series\[(\d+)\]\.points\[(\d+)\] must be \[x, y\]/, m => `Serie ${+m[1] + 1}, punto ${+m[2] + 1}: faltan x o y`],
  [/^series\[(\d+)\]\.points needs at least two/, m => `Serie ${+m[1] + 1}: la curva necesita al menos dos puntos`],
  [/^slices needs at least two/, () => "La torta necesita al menos dos partes"],
  [/^slices\[(\d+)\]\.value/, m => `Parte ${+m[1] + 1}: el valor debe ser un número mayor o igual a 0`],
  [/^row (\d+) covers (\d+) columns, expected (\d+)/, m => `La fila ${+m[1] + 1} tiene ${m[2]} celdas y deberían ser ${m[3]}`],
  [/^(\w+): min must be below max/, m => `Eje ${m[1].toUpperCase()}: el mínimo debe ser menor que el máximo`],
  [/^fills: unknown area (.+)/, m => `El mapa no tiene el área «${m[1]}»`],
  [/^region .* could not be loaded/, () => "No se pudo cargar el contorno del mapa"],
  [/^shapes must be a non-empty array/, () => "El diagrama no tiene formas"],
];
function friendly(msg) {
  for (const [rx, f] of MSG) { const m = rx.exec(msg); if (m) return f(m); }
  return msg;
}
function figProblems(f) {
  const E = window.ICFESFigures;
  if (!f.spec) return ["Figura sin dibujar todavía"];
  if (!E) return [];
  const spec = { ...f.spec, kind: f.kind || f.spec.kind };
  let errs = E.validate(spec);
  if (!errs.length) { try { E.render(spec); } catch (e) { errs = [e.message]; } }
  // The same problem repeated for every area or cell says nothing new.
  return [...new Set(errs.map(friendly))];
}
const isToCrop = (t) => t.method === "manual_crop_needed";
// Opens the figure's page and starts a box that replaces the placeholder.
function cropMissing(id) {
  const t = state.detail.figures.find(x => x.figure_id === id);
  if (!t) return;
  if (t.page && t.page !== state.page) goPage(t.page);
  startCrop(t.figure_id, traceOption(t) || "");
}
const traceShown = (t) => ["azure", "eyeballed_box"].includes(t.method) && t.svg;
// Figures whose native spec a scan picture replaces (the app drops them the same way).
function replacedIds(traced) { return new Set(traced.filter(traceShown).flatMap(t => [t.spec_id, t.figure_id])); }
function badFigure(n) {
  const traced = (state.detail && state.detail.number === n) ? state.detail.figures : [];
  const gone = replacedIds(traced || []);
  return (state.natives[String(n)] || []).some(f => !gone.has(f.id) && figProblems(f).length);
}

async function loadExam() {
  if (!state.exams.length) state.exams = await api("/api/exams");
  if (!state.exam) state.exam = state.exams[0]?.exam;
  const [rows, natives] = await Promise.all([
    api(`/api/exams/${encodeURIComponent(state.exam)}/questions`),
    STATIC ? Promise.resolve({}) : api(`/api/exams/${encodeURIComponent(state.exam)}/figures`).catch(() => ({})),
  ]);
  await mapsReady;
  state.rows = rows;
  state.natives = natives;
}
function cellClass(r) {
  const bad = badFigure(r.number);
  return (r.errors || bad ? "err" : r.hidden.length ? "hidden" : "ready") + (r.to_crop ? " crop" : "");
}

async function showQuestions() {
  status("Leyendo…");
  await loadExam();
  const rows = state.rows;
  const pass = rows.filter(r => ({
    all: true, hidden: r.hidden.length > 0 || badFigure(r.number), errors: r.errors > 0, warnings: r.warnings > 0, notready: !r.ready, badfig: badFigure(r.number), crop: r.to_crop > 0,
  })[state.filter]);
  status(`${rows.length} preguntas`, "ok");
  const opts = state.exams.map(e => `<option value="${esc(e.exam)}" ${e.exam === state.exam ? "selected" : ""}>${esc(e.exam)}</option>`).join("");
  const sections = [...new Set(rows.map(r => r.section).filter(Boolean))];
  app.innerHTML = `
    <div class="toolbar">
      <select id="pick-exam" aria-label="Examen">${opts}</select>
      ${FILTERS.map(([v, l]) => `<button class="chip ${v === state.filter ? "on" : ""}" data-filter="${v}">${l}</button>`).join("")}
      <span class="muted num">${pass.length} de ${rows.length}</span>
    </div>
    <div class="toolbar">
      ${sections.map(s => `<span class="chip" style="cursor:default"><i style="background:${areaColor(s)}"></i>${esc(s)}</span>`).join("")}
    </div>
    <div class="card">
      <div class="label">Mapa de preguntas</div>
      <div class="map">
        ${pass.map(r => `<button class="cell ${cellClass(r)}" data-n="${r.number}" title="${esc([...r.hidden.map(x => REASONS[x] || x), ...(badFigure(r.number) ? ["figura inválida"] : []), ...(r.to_crop ? [`${r.to_crop} figura(s) por recortar`] : [])].join(", ") || "visible para estudiantes")}">${r.number}</button>`).join("")}
      </div>
      <div class="muted" style="margin-top:12px">Relleno verde: visible para estudiantes. Borde punteado: oculta. Borde rojo: error del validador o figura que no se puede dibujar (los estudiantes no la ven). ✂: tiene una figura por recortar del PDF.</div>
    </div>`;
  $("#pick-exam").onchange = (e) => { state.exam = e.target.value; state.n = null; showQuestions(); };
  app.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { state.filter = b.dataset.filter; showQuestions(); });
  app.querySelectorAll("button[data-n]").forEach(b => b.onclick = () => openQuestion(Number(b.dataset.n)));
}

// ----- the question workspace ---------------------------------------------------

// Leaving a question with changes saves them first; a failed save keeps you on the question.
async function leave(go) {
  if (state.dirty && state.detail && document.body.classList.contains("editing")) {
    const ok = await saveQuestion();
    if (!ok) return;
  }
  go();
}

async function openQuestion(n, opts = {}) {
  status("Cargando…");
  if (!state.rows.length || opts.reloadExam) await loadExam();
  const detail = await api(`/api/exams/${encodeURIComponent(state.exam)}/questions/${n}`);
  state.n = n;
  state.detail = detail;
  state.natives[String(n)] = detail.native_figures;
  state.dirty = false;
  state.box = null;
  state.cropping = false;
  state.cropTarget = null;
  const sc = detail.scan;
  state.page = detail.anchor?.page ?? sc.pages[0] ?? sc.guess;
  document.body.classList.add("editing");
  renderWorkspace();
  status(`${state.exam} · Q${n}`, "ok");
}

function hiddenNow() {
  const d = state.detail;
  const reasons = [...d.hidden_reasons];
  if (badFigure(d.number)) reasons.push("figura inválida");
  return reasons;
}

function renderWorkspace() {
  const d = state.detail, q = d.question, g = d.group;
  const idx = d.numbers.indexOf(d.number);
  const prev = d.numbers[idx - 1], next = d.numbers[idx + 1];
  const exams = state.exams.map(e => `<option ${e.exam === state.exam ? "selected" : ""}>${esc(e.exam)}</option>`).join("");
  const reasons = hiddenNow();
  app.innerHTML = `
  <div class="ed">
    <div class="edbar">
      <button class="ib" id="back" title="Volver a la lista de preguntas">← Volver</button>
      <select id="ed-exam" aria-label="Examen">${exams}</select>
      <button class="ib" id="prev" ${prev ? "" : "disabled"} title="Pregunta anterior (Alt+←)">‹ Anterior</button>
      <span class="qnum">Pregunta ${d.number}</span>
      <button class="ib" id="next" ${next ? "" : "disabled"} title="Pregunta siguiente (Alt+→)">Siguiente ›</button>
      <span id="vis">${visBadges(reasons)}</span>
      <span class="spacer"></span>
      <button class="ib" id="fixnext" title="Salta a la próxima pregunta oculta o con errores (Alt+N)">⚑ Siguiente por arreglar</button>
      <span id="savestate" class="savestate">Sin cambios</span>
      <button class="ib go" id="save" title="Ctrl+S">Guardar</button>
      <span class="more">
        <button class="ib" id="morebtn" onclick="toggleMenu('moremenu', event)" aria-haspopup="true">Más ▾</button>
        <div class="menu" id="moremenu" hidden>
          <button onclick="openSearch()">🔍 Buscar preguntas <kbd>Ctrl+K</kbd></button>
          ${STATIC ? "" : `<button id="undo" ${d.undo ? "" : "disabled"}>${undoLabel(d.undo)}</button>`}
          <button id="toggle-prev">${prevLabel()}</button>
          <button onclick="setVisual(!state.visual)">‹/› Ver el texto como código</button>
          <hr>
          <button onclick="startTour()">💡 Ver la guía otra vez</button>
          <button onclick="showHelp()">⌨ Atajos de teclado</button>
        </div>
      </span>
    </div>
    <div class="edgrid ${state.preview ? "" : "noprev"}" id="edgrid">
      <section class="pane pdf" id="pdfpane">${pdfPane()}</section>
      <div class="split" id="split" title="Arrastra para cambiar el ancho"></div>
      <section class="pane form" id="form">${formPane(q, g)}</section>

  </div>`;

  state.opts = q.options.map(o => ({ ...o }));
  state.answer = d.key || "";
  drawOpts();
  drawFigs();
  bindPdf();
  refreshPreview();
  document.querySelectorAll("#form textarea").forEach(fit);
  attachAllRich();
  $("#form").classList.toggle("visual", state.visual);
  $("#back").onclick = () => leave(() => setTab("questions"));
  $("#prev").onclick = () => prev && leave(() => openQuestion(prev));
  $("#next").onclick = () => next && leave(() => openQuestion(next));
  $("#ed-exam").onchange = (e) => leave(async () => { state.exam = e.target.value; await loadExam(); openQuestion(state.rows[0].number); });
  $("#save").onclick = saveQuestion;
  $("#fixnext").onclick = () => { const n = nextToFix(); if (n == null) toast("No queda nada por arreglar en este examen 🎉"); else leave(() => openQuestion(n)); };
  remember("last", { exam: state.exam, n: d.number });
  $("#toggle-prev").onclick = () => { state.preview = !state.preview; $("#edgrid").classList.toggle("noprev", !state.preview); $("#toggle-prev").textContent = prevLabel(); };
  if ($("#undo")) $("#undo").onclick = undo;
  $("#qstrip").querySelectorAll("button").forEach(b => b.onclick = () => leave(() => openQuestion(Number(b.dataset.n))));
  $("#qstrip").querySelector(".cur")?.scrollIntoView({ inline: "center", block: "nearest" });
  $("#form").addEventListener("input", e => {
    if (e.target.tagName === "TEXTAREA") fit(e.target);
    if (e.target.dataset.letter) syncOpts();

    refreshPreview();
  });
  $("#form").addEventListener("change", e => { if (e.target.id === "f-section" || e.target.id === "f-ready") { markDirty(); refreshPreview(); } });
  bindSplit();
  if (!recall("tourDone")) setTimeout(startTour, 400);
}

// The checker's messages, in plain Spanish.
const CHECK = [
  [/still has review flags: (.+)/, m => `Tiene una marca de revisión pendiente (${m[1].replace("pending_figure", "falta la figura")}). Ábrela abajo en «Marcas de revisión y notas».`],
  [/duplicate question number/, () => "El número de la pregunta está repetido"],
  [/out of order after Q(\d+)/, m => `Está fuera de orden después de la pregunta ${m[1]}`],
  [/empty question text/, () => "La pregunta no tiene texto"],
  [/(\d+) options, expected (\d+)/, m => `Tiene ${m[1]} opciones y deberían ser ${m[2]}`],
  [/option letters are not/, () => "Las letras de las opciones no van A, B, C… en orden"],
  [/an option has no text/, () => "Una opción está vacía"],
  [/OCR\/layout artifacts/, () => "Quedan restos del OCR en el texto (marcas raras de la página). Usa 🧹 Limpiar."],
  [/unknown group/, () => "Apunta a un texto compartido que no existe"],
  [/unbalanced \$/, () => "Una fórmula tiene un $ sin cerrar"],
  [/two options have identical text/, () => "Dos opciones tienen el mismo texto"],
  [/more than one option carries a scan mark/, () => "Más de una opción está marcada en el escaneo"],
];
function checkMsg(msg) {
  for (const [rx, f] of CHECK) { const m = rx.exec(msg); if (m) return f(m); }
  return msg.replace(/^Q\d+:\s*/, "");
}

// ----- first-run guide: a few spotlights on the real screen, closable at any step -------------
const TOUR = [
  ["#pdfpane", "La página original", "Aquí ves el examen tal como está en el PDF. La línea naranja marca dónde empieza la pregunta."],
  ["#cropbtn", "Recortar o leer", "Dibuja un recuadro sobre la página. Puedes guardar lo que encierra como figura (y limpiarle el fondo) o copiar su texto a un campo."],
  ["#form", "Corregir la pregunta", "Escribe aquí como en Word. Si falta un texto, pulsa «⌖ Leer del PDF» junto al campo y encierra ese texto en la página."],
  ["#f-opts", "La respuesta", "Toca la letra de una opción para marcarla como respuesta correcta."],
  [".pane.prev", "Lo que ve el estudiante", "Así queda la pregunta en la aplicación. Cambia mientras escribes."],
  ["#nextstep", "El siguiente paso", "Cuando la pregunta esté bien, pulsa este botón: se guarda, queda visible para los estudiantes y pasas a la siguiente."],
  ["#morebtn", "Lo demás", "Buscar, deshacer, el código del texto y esta guía están en «Más»."],
];
function startTour(i = 0) {
  document.querySelectorAll(".menu").forEach(x => { x.hidden = true; });
  $("#tour")?.remove();
  const steps = TOUR.filter(([sel]) => $(sel));
  const step = steps[i];
  if (!step) return endTour();
  const el = $(step[0]);
  el.scrollIntoView?.({ block: "nearest" });
  const r = el.getBoundingClientRect(), pad = 6;
  const below = r.top + r.height / 2 < innerHeight / 2;
  const left = Math.max(12, Math.min(innerWidth - 372, r.left + r.width / 2 - 180));
  const top = below ? Math.min(innerHeight - 220, r.bottom + 14) : null;
  const bottom = below ? null : Math.min(innerHeight - 220, innerHeight - r.top + 14);
  document.body.insertAdjacentHTML("beforeend", `<div id="tour">
    <div class="tspot" style="left:${r.left - pad}px;top:${r.top - pad}px;width:${r.width + 2 * pad}px;height:${r.height + 2 * pad}px"></div>
    <div class="tbub" style="left:${left}px;${top != null ? `top:${Math.max(12, top)}px` : `bottom:${Math.max(12, bottom)}px`}">
      <div class="muted" style="font-size:12px">Paso ${i + 1} de ${steps.length}</div>
      <b style="font:700 17px 'Bricolage Grotesque'">${step[1]}</b>
      <p>${step[2]}</p>
      <div class="row"><button class="ib" onclick="endTour()">Cerrar la guía</button><span class="spacer"></span>
        ${i ? `<button class="ib" onclick="startTour(${i - 1})">Atrás</button>` : ""}
        <button class="ib go" onclick="startTour(${i + 1})">${i + 1 < steps.length ? "Siguiente" : "Entendido"}</button></div>
    </div></div>`);
}
function endTour() { $("#tour")?.remove(); $("#form")?.scrollTo(0, 0); remember("tourDone", true); }

// ----- options: tap a letter to set the key ------------------------------------------

function syncOpts() {
  const old = Object.fromEntries((state.opts || []).map(o => [o.letter, o]));
  state.opts = [...document.querySelectorAll("#f-opts [data-letter]")].map(t => ({
    letter: t.dataset.letter, text_md: t.value, marked_in_scan: old[t.dataset.letter]?.marked_in_scan ?? false }));
}

function drawOpts() {
  $("#f-opts").innerHTML = state.opts.map((o, i) => `
    <div class="orow">
      <button type="button" class="ltile ${state.answer === o.letter ? "key" : ""}" onclick="setAnswer('${esc(o.letter)}')" title="${state.answer === o.letter ? "Respuesta correcta" : "Marcar como respuesta correcta"}">${esc(o.letter)}${o.marked_in_scan ? '<i class="mk" title="marcada en el escaneo"></i>' : ""}</button>
      <textarea data-letter="${esc(o.letter)}" spellcheck="true" lang="es" placeholder="Texto de la opción ${esc(o.letter)}">${esc(o.text_md)}</textarea>
      <span class="otools">
        <button type="button" onclick="moveOpt(${i}, -1)" ${i === 0 ? "disabled" : ""} title="Mover esta opción arriba">↑ Subir</button>
        <button type="button" onclick="moveOpt(${i}, 1)" ${i === state.opts.length - 1 ? "disabled" : ""} title="Mover esta opción abajo">↓ Bajar</button>
        <button type="button" onclick="removeOpt(${i})" title="Quitar esta opción">Quitar</button>
      </span>
    </div>`).join("") + `<button class="ib" type="button" onclick="addOpt()">+ Agregar opción</button>
    <span class="muted" style="font-size:12px;margin-left:8px">Respuesta: <b>${esc(state.answer || "sin clave")}</b>${state.answer ? ` <a href="#" onclick="setAnswer('');return false">quitar</a>` : ""}</span>`;
  document.querySelectorAll("#f-opts textarea").forEach(fit);
  attachAllRich();
}
function setAnswer(letter) { syncOpts(); state.answer = state.answer === letter ? "" : letter; drawOpts(); markDirty(); }
function addOpt() {
  syncOpts();
  const used = state.opts.map(o => o.letter);
  state.opts.push({ letter: "ABCDEFGHIJ".split("").find(l => !used.includes(l)) || "?", text_md: "", marked_in_scan: false });
  drawOpts(); markDirty(); refreshPreview();
}
function removeOpt(i) { syncOpts(); state.opts.splice(i, 1); drawOpts(); markDirty(); refreshPreview(); }
function moveOpt(i, delta) {
  syncOpts();
  const j = i + delta;
  if (j < 0 || j >= state.opts.length) return;
  [state.opts[i], state.opts[j]] = [state.opts[j], state.opts[i]];
  drawOpts(); markDirty(); refreshPreview();
}

// ----- figures: native charts and tables, and pictures cut from the scan ---------------

function drawNative(f, slot = true) {
  const E = window.ICFESFigures;
  const problems = figProblems(f);
  if (problems.length) return slot ? `<span class="figure-slot bad">No se puede dibujar: ${esc(problems.slice(0, 3).join("; "))}${problems.length > 3 ? "…" : ""}</span>` : "";
  try {
    const markup = window.DOMPurify.sanitize(E.render({ ...f.spec, kind: f.kind || f.spec.kind }), { USE_PROFILES: { svg: true, svgFilters: true, html: true } });
    return `<div class="figure native">${markup}</div>`;
  } catch (e) {
    return slot ? `<span class="figure-slot bad">${esc(e.message)}</span>` : "";
  }
}
const scanUrl = (t) => `/api/figure?path=${encodeURIComponent(t.svg)}`;
function traceOption(t) { return t.option || (/[-_](?:opt|opcion|opción)[-_]([a-d])(?=[-_]|$)/i.exec(t.figure_id || "")?.[1]?.toUpperCase() ?? null); }

function drawFigs() {
  const d = state.detail;
  const gone = replacedIds(d.figures);
  const natives = d.native_figures.map(f => {
    const problems = figProblems(f);
    const replaced = gone.has(f.id);
    return `<div class="figcard">
      <div class="head"><b>${esc(KIND_NAMES[f.kind] || f.kind)}</b>
        <span class="muted">${f.target === "option" ? `opción ${esc(f.option)}` : "enunciado"}</span>
        ${replaced ? '<span class="badge">reemplazada por un recorte</span>' : problems.length ? '<span class="badge hid">no se puede dibujar</span>' : '<span class="badge ok">se ve bien</span>'}
        <span class="spacer"></span>
        <button class="ib" type="button" onclick="openStudio('${esc(f.id)}')">Editar</button>
        ${STATIC ? "" : `<button class="ib" type="button" onclick="startCrop('${esc(f.id)}', '${f.target === "option" ? esc(f.option) : ""}')" title="Cambiar esta figura por un recorte de la página">✂ Usar recorte</button>
        <button class="ib warn" type="button" onclick="deleteNative('${esc(f.id)}')" title="Quitar esta figura">Quitar</button>`}
      </div>
      ${problems.length && !replaced ? `<ul class="problems">${problems.slice(0, 4).map(p => `<li>${esc(p)}</li>`).join("")}${problems.length > 4 ? `<li>y ${problems.length - 4} más</li>` : ""}</ul>` : `<div class="mini">${drawNative(f)}</div>`}
    </div>`;
  });
  const scans = d.figures.filter(traceShown).map(t => `<div class="figcard">
      <div class="head"><b>Imagen del escaneo</b><span class="muted">${traceOption(t) ? `opción ${esc(traceOption(t))}` : "enunciado"}</span>
        <span class="spacer"></span>
        ${STATIC ? "" : `<button class="ib" type="button" onclick="cleanSaved('${esc(t.figure_id)}')" title="Quitar el fondo o tapar texto encima">✨ Limpiar</button><button class="ib warn" type="button" onclick="deleteScan('${esc(t.figure_id)}')" title="Quitar esta imagen">Quitar</button>`}</div>
      <div class="mini"><img src="${scanUrl(t)}" alt="${esc(t.figure_id)}"></div></div>`);
  const todo = d.figures.filter(isToCrop).map(t => `<div class="figcard todo">
      <div class="head"><b>Falta recortar esta figura</b><span class="muted">${traceOption(t) ? `opción ${esc(traceOption(t))}` : "enunciado"}${t.page ? ` · página ${t.page}` : ""}</span>
        <span class="spacer"></span>
        ${STATIC ? "" : `<button class="ib go" type="button" onclick="cropMissing('${esc(t.figure_id)}')">✂ Recortarla del PDF</button>`}</div>
      <div class="muted" style="font-size:12px">Dibuja un recuadro sobre la figura en la página. El recorte toma su lugar.</div></div>`);
  const pending = d.figures.filter(t => !traceShown(t) && !isToCrop(t)).map(t => `<div class="figcard"><div class="head"><b>${esc(t.figure_id || t.spec_id)}</b><span class="badge hid">${t.pending_spec ? "pendiente" : esc(t.method || "")}</span></div></div>`);

}

// ----- student preview (same renderer and figure engine as the app) -------------------

function studentView(q, g, d) {
  const gone = replacedIds(d.figures);
  const natives = d.native_figures.filter(f => !gone.has(f.id));
  const scans = d.figures.filter(traceShown);
  const stemFigs = natives.filter(f => f.target !== "option").map(f => drawNative(f)).join("");
  const stemScans = scans.filter(t => !traceOption(t)).map(t => `<img class="scanfig" src="${scanUrl(t)}" alt="">`).join("");
  const opts = q.options.map(o => {
    const nat = natives.find(f => f.target === "option" && f.option === o.letter);
    const sc = scans.find(t => traceOption(t) === o.letter);
    const body = nat ? drawNative(nat) : sc ? `<img class="scanfig" src="${scanUrl(sc)}" alt="">` : render(o.text_md);
    return `<div class="opt ${state.answer === o.letter ? "marked" : ""}" style="pointer-events:none"><span class="tile">${esc(o.letter)}</span><div class="body">${body}</div></div>`;
  }).join("");
  const gText = g ? (g.passage_md || g.stimulus_md || "") : "";
  const plain = h => (h ?? "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim().toLowerCase();
  const stemInPassage = !!g && plain(q.stem_md).length > 20 && plain(gText).includes(plain(q.stem_md));
  const dir = g ? `<div class="label" style="color:var(--paper-2)">${esc(g.directions)}</div><div class="stimulus">${render(gText)}</div><hr style="border:0;border-top:1px solid #d8d6cc;margin:12px 0">` : "";
  return `
    <div class="paper">
      <div class="label" style="color:var(--paper-2)">Pregunta ${q.number}</div>
      ${dir}
      ${q.stimulus_md ? `<div class="stimulus">${render(q.stimulus_md)}</div>` : ""}
      ${stemScans}${stemFigs}
      ${stemInPassage ? "" : `<div class="stem">${render(q.stem_md)}</div>`}
      <div class="src">Fuente: ICFES, Saber 11 · ${esc(state.exam)}</div>
    </div>
    ${opts}
    <p class="muted" style="font-size:12px">El borde naranja marca la respuesta de la clave (solo en el editor).</p>`;
}

let previewQueued = false;
function refreshPreview() {
  if (previewQueued) return;
  previewQueued = true;
  requestAnimationFrame(() => {
    previewQueued = false;
    const d = state.detail; if (!d || !$("#preview")) return;
    const q = { ...d.question, stem_md: $("#f-stem").value, stimulus_md: $("#f-stimulus").value, options: state.opts };
    const g = d.group && $("#f-passage") ? { ...d.group, passage_md: $("#f-passage").value } : d.group;

}

async function saveQuestion() {
  const d = state.detail;
  if (!d) return false;
  syncOpts();
  const ready = $("#f-ready").checked;
  if (ready && badFigure(d.number)) {
    setSave("No se guardó: una figura no se puede dibujar. Arréglala, recórtala del PDF o desmarca «Lista».", "bad");
    toast("Una figura no se puede dibujar; los estudiantes no deben verla así.", true);
    return false;
  }
  const body = {
    stem_md: $("#f-stem").value,
    stimulus_md: $("#f-stimulus").value,
    options: state.opts.map(o => ({ letter: o.letter, text_md: o.text_md })),
    ready,
    answer: state.answer || null,
    section: $("#f-section").value.trim(),
  };
  if (d.group) body.group_passage_md = $("#f-passage").value;
  setSave("Guardando…", "");
  try {
    const fresh = await api(qpath(d), J("PUT", body));
    state.detail = { ...fresh };
    state.dirty = false;
    const r = state.rows.find(x => x.number === d.number);
    if (r) { r.ready = fresh.question.ready; r.hidden = fresh.hidden_reasons; r.errors = fresh.messages.errors.length; r.warnings = fresh.messages.warnings.length; }
    if (document.body.classList.contains("editing") && state.n === d.number) {
      state.detail.question.options = fresh.question.options;
      refreshChrome();
      setSave(`Guardado ${new Date().toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" })}`, "ok");
    }
    return true;
  } catch (err) {
    if (err.status === 409) setSave(`No se guardó: no puede estar lista todavía (${(err.body.reasons || []).join(", ")}). Corrige eso o desmarca «Lista».`, "bad");
    else setSave(`No se guardó: ${err.message}`, "bad");
    toast("No se guardó. Mira el aviso arriba.", true);
    return false;
  }
}
function setSave(text, cls) { const s = $("#savestate"); if (s) { s.textContent = text; s.className = "savestate " + cls; } }

async function readyAndNext() {
  $("#f-ready").checked = true;
  markDirty();
  if (await saveQuestion()) $("#next").disabled ? toast("Era la última pregunta del examen") : $("#next").click();
}

function nextToFix() {
  const rows = state.rows, cur = rows.findIndex(r => r.number === state.n);
  const needs = r => r.errors || r.hidden.length || badFigure(r.number) || r.to_crop;
  for (let k = 1; k <= rows.length; k++) { const r = rows[(cur + k) % rows.length]; if (needs(r)) return r.number; }
  return null;
}

document.addEventListener("keydown", e => {
  if (!document.body.classList.contains("editing")) return;
  if ($("#tour")) { if (e.key === "Escape") endTour(); return; }
  if ($("#cleaner")) { cleanerKey(e); return; }
  if ($(".studio")) {
    if (cvKey(e)) return;
    if (e.key === "Escape") closeStudio();
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveStudio(); }
    return;
  }
  if ($("#overlay")) { if (e.key === "Escape") closeOverlay(); return; }
  const typing = /TEXTAREA|INPUT|SELECT/.test(e.target.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveQuestion(); }
  else if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); readyAndNext(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openSearch(); }
  else if (e.altKey && e.key.toLowerCase() === "n") { e.preventDefault(); $("#fixnext").click(); }
  else if (e.altKey && e.key.toLowerCase() === "r") { e.preventDefault(); state.cropping ? cancelCrop() : startCrop(); }
  else if (!typing && e.key === "?") { showHelp(); }
  else if (e.altKey && e.key === "ArrowRight") { e.preventDefault(); $("#next").click(); }
  else if (e.altKey && e.key === "ArrowLeft") { e.preventDefault(); $("#prev").click(); }
  else if (e.key === "Escape") { cancelCrop(); }
});

// Remembers the text field last used, so the format buttons and OCR know where to write.
document.addEventListener("focusin", e => { if (e.target.tagName === "TEXTAREA" && e.target.closest("#form")) state.lastArea = e.target; });

// Typing through execCommand keeps Ctrl+Z working for inserted text.
function insertAt(area, text, selectInserted = false) {
  const rich = state.visual && richOf(area);
  if (rich) { richInsert(rich, text); return; }
  const start = area.selectionStart ?? area.value.length, end = area.selectionEnd ?? start;
  area.focus();
  area.setSelectionRange(start, end);
  if (!document.execCommand("insertText", false, text)) area.value = area.value.slice(0, start) + text + area.value.slice(end);
  if (selectInserted) area.setSelectionRange(start, start + text.length); else area.setSelectionRange(start + text.length, start + text.length);
  area.dispatchEvent(new Event("input", { bubbles: true }));
}
// ----- Word-style text fields ------------------------------------------------------------------
// Each text field shows formatted text you edit as in Word; the hidden textarea keeps the exam text the app reads.
// Only formatting the student app's renderer shows is stored: **bold**, <em>, <u>, <sub>, <sup>, lists,
// aligned paragraphs and tables. Math stays as $...$ and is drawn in the student view.

state.visual = recall("visual") ?? true;
const RICH_BLOCK = /^(DIV|P|UL|OL|TABLE|H[1-6]|BLOCKQUOTE|PRE|FIGURE|FIGCAPTION)$/;
const MATH_SPLIT = /(\$[^$\n]+?\$)/;

// Exam text to editable HTML.
function toVisual(src) {
  if (!src) return "";
  const blocks = pipeTables(src).split(/\n\s*\n/).map(b => b.trim()).filter(Boolean)
    .map(b => (/^<(p|div|ul|ol|table|h\d)\b/i.test(b) ? b : `<div>${b.replace(/\n/g, "<br>")}</div>`));
  const html = blocks.join("").split(MATH_SPLIT).map((part, i) => (i % 2 ? part
    : part.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*\w])\*([^*\n]+?)\*(?![*\w])/g, (m, pre, body) => (/<\/?(t[dhr]|div|p)\b/i.test(body) ? m : `${pre}<i>${body}</i>`)))).join("");
  return window.DOMPurify.sanitize(html);
}
function pipeTables(text) {
  const lines = text.split("\n"), out = [];
  const cells = (l) => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
  const row = (l) => /^\s*\|.*\|\s*$/.test(l), sep = (l) => /^\s*\|[\s:|-]+\|\s*$/.test(l) && l.includes("-");
  for (let i = 0; i < lines.length;) {
    if (row(lines[i]) && i + 1 < lines.length && sep(lines[i + 1])) {
      const head = cells(lines[i]); i += 2;
      const body = [];
      while (i < lines.length && row(lines[i])) body.push(cells(lines[i++]));
      out.push("", `<table class="exam-table"><thead><tr>${head.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`, "");
    } else out.push(lines[i++]);
  }
  return out.join("\n");
}

// Editable HTML back to exam text. Unknown markup (from Word or a web page) keeps only its text.
function toSource(root) {
  const blocks = [];
  let inline = "";
  const flush = () => { const t = inline.replace(/[ \t]+\n/g, "\n").replace(/\n+$/, "").trim(); if (t) blocks.push(t); inline = ""; };
  root.childNodes.forEach(n => {
    if (n.nodeType === 1 && RICH_BLOCK.test(n.tagName)) { flush(); const b = blockSource(n); if (b) blocks.push(b); }
    else inline += inlineSource(n);
  });
  flush();
  return blocks.join("\n\n");
}
function blockSource(el) {
  const tag = el.tagName;
  // Figure notes left by the scan reading are kept as they are; the app uses them to hide unfinished questions.
  if (tag === "FIGURE" || tag === "FIGCAPTION") return `<${tag.toLowerCase()}>${toSource(el)}</${tag.toLowerCase()}>`;
  if (tag === "UL" || tag === "OL") {
    const items = [...el.children].filter(li => li.tagName === "LI").map(li => `<li>${inlineHtml(li)}</li>`).join("");
    return items ? `<${tag.toLowerCase()}>${items}</${tag.toLowerCase()}>` : "";
  }
  if (tag === "TABLE") {
    const rows = [...el.querySelectorAll("tr")].map(tr => `<tr>${[...tr.children].map(c => {
      const t = c.tagName === "TH" ? "th" : "td";
      const span = (c.colSpan > 1 ? ` colspan="${c.colSpan}"` : "") + (c.rowSpan > 1 ? ` rowspan="${c.rowSpan}"` : "");
      return `<${t}${span}>${inlineHtml(c)}</${t}>`;
    }).join("")}</tr>`).join("");
    const cap = el.querySelector("caption") ? inlineHtml(el.querySelector("caption")) : "";
    return rows ? `<table class="exam-table">${cap ? `<caption>${cap}</caption>` : ""}<tbody>${rows}</tbody></table>` : "";
  }
  if ([...el.children].some(c => RICH_BLOCK.test(c.tagName))) return toSource(el);
  const align = (el.style.textAlign || el.getAttribute("align") || "").toLowerCase();
  const inner = [...el.childNodes].map(inlineSource).join("").replace(/\n+$/, "");
  if (["center", "right", "justify"].includes(align) && inner.trim()) return `<p style="text-align:${align}">${inner.trim().replace(/\n/g, "<br>")}</p>`;
  return inner.trim();
}
const inlineHtml = (el) => [...el.childNodes].map(inlineSource).join("").replace(/\n+$/, "").trim().replace(/\n/g, "<br>");
function inlineSource(n) {
  // A typed asterisk stays an asterisk: written as &#42; so the app never reads it as italics.
  if (n.nodeType === 3) return n.nodeValue.replace(/\u00a0/g, " ").replace(/<(?=[A-Za-z/!])/g, "&lt;")
    .split(MATH_SPLIT).map((part, i) => (i % 2 ? part : part.replace(/\*/g, "&#42;"))).join("");
  if (n.nodeType !== 1) return "";
  const tag = n.tagName;
  if (tag === "BR") return "\n";
  if (RICH_BLOCK.test(tag)) return "\n" + blockSource(n) + "\n";
  let inner = [...n.childNodes].map(inlineSource).join("");
  const st = n.style || {};
  const bold = tag === "B" || tag === "STRONG" || /^(bold|[6-9]00)$/.test(st.fontWeight || "");
  const italic = tag === "I" || tag === "EM" || st.fontStyle === "italic";
  const under = tag === "U" || /underline/.test(st.textDecoration || st.textDecorationLine || "");
  const sub = tag === "SUB" || st.verticalAlign === "sub", sup = tag === "SUP" || st.verticalAlign === "super";
  if (!inner.trim()) return inner;
  if (sub) inner = `<sub>${inner}</sub>`;
  if (sup) inner = `<sup>${inner}</sup>`;
  if (under) inner = `<u>${inner}</u>`;
  if (italic) inner = `<em>${inner}</em>`;
  if (bold) {
    const [, lead, core, trail] = /^(\s*)([\s\S]*?)(\s*)$/.exec(inner);
    inner = /[*\n]/.test(core) ? `${lead}<strong>${core}</strong>${trail}` : `${lead}**${core}**${trail}`;
  }
  return inner;
}

const richOf = (ta) => (ta && ta.nextElementSibling?.classList.contains("rich") ? ta.nextElementSibling : null);
// Gives a textarea its Word-style twin. The textarea stays the source of truth for saving and the preview.
function attachRich(ta) {
  if (!ta || richOf(ta)) return;
  ta.classList.add("src");
  const rich = Object.assign(document.createElement("div"), { className: "rich", contentEditable: "true", spellcheck: true });
  rich.lang = "es";
  rich.dataset.ph = ta.placeholder || "";
  rich.innerHTML = toVisual(ta.value);
  ta.after(rich);
  rich.addEventListener("input", e => {
    e.stopPropagation();
    ta._fromRich = true;
    ta.value = toSource(rich);
    ta.dispatchEvent(new Event("input", { bubbles: true }));
    ta._fromRich = false;
    rich.classList.toggle("empty", !rich.textContent.trim() && !rich.querySelector("table,li"));
  });
  ta.addEventListener("input", () => { if (!ta._fromRich) { rich.innerHTML = toVisual(ta.value); } });
  rich.addEventListener("focus", () => { state.lastArea = ta; });
  rich.addEventListener("paste", e => {
    const html = e.clipboardData?.getData("text/html"), text = e.clipboardData?.getData("text/plain");
    if (e.clipboardData?.files?.length) return;
    e.preventDefault();
    // Pasted Word or web text keeps bold, italics, lists and tables, and drops the rest.
    let src = text || "";
    if (html) { const tmp = document.createElement("div"); tmp.innerHTML = window.DOMPurify.sanitize(html); src = toSource(tmp); }
    document.execCommand("insertHTML", false, toVisual(src));
  });
  rich.addEventListener("keydown", e => {
    const cell = window.getSelection()?.anchorNode?.parentElement?.closest?.("td,th");
    if (e.key === "Tab" && cell && rich.contains(cell)) {
      e.preventDefault();
      const all = [...rich.querySelectorAll("td,th")];
      const next = all[all.indexOf(cell) + (e.shiftKey ? -1 : 1)];
      if (next) { const r = document.createRange(); r.selectNodeContents(next); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
      else if (!e.shiftKey) {
        richTable("row+");
        const first = cell.parentElement.nextElementSibling?.firstElementChild;
        if (first) { const r = document.createRange(); r.selectNodeContents(first); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
      }
    }
  });
  rich.classList.toggle("empty", !rich.textContent.trim() && !rich.querySelector("table,li"));
}
function attachAllRich() { document.querySelectorAll("#form #f-stem, #form #f-stimulus, #form #f-passage, #f-opts textarea[data-letter]").forEach(attachRich); }

// Remembers where the caret was in each Word-style field, so OCR and symbols land there.
document.addEventListener("selectionchange", () => {
  const s = window.getSelection();
  if (!s?.rangeCount) return;
  const rich = s.anchorNode?.parentElement?.closest?.(".rich") || (s.anchorNode?.classList?.contains?.("rich") ? s.anchorNode : null);
  if (rich) rich._range = s.getRangeAt(0).cloneRange();
  richToolbarState();
});
function richFocus(rich) {
  rich.focus();
  const s = window.getSelection();
  if (s.rangeCount && rich.contains(s.anchorNode)) return;
  const r = rich._range && rich.contains(rich._range.startContainer) ? rich._range : (() => { const x = document.createRange(); x.selectNodeContents(rich); x.collapse(false); return x; })();
  s.removeAllRanges();
  s.addRange(r);
}
function richInsert(rich, text) {
  richFocus(rich);
  if (/\n|\*\*|<|\|/.test(text)) document.execCommand("insertHTML", false, toVisual(text));
  else document.execCommand("insertText", false, text);
}
function selectAllField(area) {
  const rich = state.visual && richOf(area);
  if (!rich) { area.focus(); area.select(); return; }
  rich.focus();
  const r = document.createRange(); r.selectNodeContents(rich);
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
}

function setVisual(on) {
  state.visual = on;
  remember("visual", on);
  $("#form")?.classList.toggle("visual", on);
  document.querySelectorAll("#form textarea.src").forEach(ta => { const r = richOf(ta); if (r) r.innerHTML = toVisual(ta.value); fit(ta); });
  document.querySelectorAll(".fbar .vis-only").forEach(b => { b.hidden = !on; });
  $("#fmode").innerHTML = fmodeHtml();
}
const fmodeHtml = () => state.visual ? "" : `<button class="ib on" type="button" onclick="setVisual(true)" title="Estás viendo el texto como se guarda (marcas ** y $)">‹/› Código · volver al formato</button>`;

// Format commands. In the Word-style view they act on the selection; in the code view they wrap it in markup.
function richCmd(cmd, arg) {
  const area = state.lastArea;
  if (!area || !area.isConnected) { toast("Primero haz clic en un campo de texto"); return; }
  const rich = state.visual && richOf(area);
  if (rich) {
    richFocus(rich);
    if (cmd === "table") {
      const mark = "tbl" + Date.now();
      document.execCommand("insertHTML", false, `<table class="exam-table" data-new="${mark}"><tbody><tr><th>Columna 1</th><th>Columna 2</th></tr><tr><td>&nbsp;</td><td>&nbsp;</td></tr></tbody></table><div><br></div>`);
      // The caret starts in the first cell, ready to type over it.
      const t = rich.querySelector(`[data-new="${mark}"]`);
      if (t) { t.removeAttribute("data-new"); const r = document.createRange(); r.selectNodeContents(t.querySelector("th,td")); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
      return;
    }
    if (cmd === "clear") { document.execCommand("removeFormat"); document.execCommand("justifyLeft"); return; }
    document.execCommand(cmd, false, arg ?? null);
    return;
  }
  const sel = area.value.slice(area.selectionStart, area.selectionEnd) || "texto";
  const wrap = {
    bold: `**${sel}**`, italic: `<em>${sel}</em>`, underline: `<u>${sel}</u>`, subscript: `<sub>${sel}</sub>`, superscript: `<sup>${sel}</sup>`,
    insertUnorderedList: `\n\n<ul>${sel.split("\n").map(l => `<li>${l}</li>`).join("")}</ul>\n\n`,
    insertOrderedList: `\n\n<ol>${sel.split("\n").map(l => `<li>${l}</li>`).join("")}</ol>\n\n`,
    justifyCenter: `\n\n<p style="text-align:center">${sel}</p>\n\n`, justifyRight: `\n\n<p style="text-align:right">${sel}</p>\n\n`,
    justifyFull: `\n\n<p style="text-align:justify">${sel}</p>\n\n`, justifyLeft: sel,
    table: "\n| Columna 1 | Columna 2 |\n|---|---|\n| | |\n", clear: sel.replace(/<[^>]+>|\*\*/g, ""),
  }[cmd];
  if (wrap != null) insertAt(area, wrap);
}

// Rows and columns of a table being edited in a text field.
function richTable(op) {
  const s = window.getSelection();
  const cell = s?.anchorNode && (s.anchorNode.nodeType === 1 ? s.anchorNode : s.anchorNode.parentElement)?.closest("td,th");
  const rich = cell?.closest(".rich");
  if (!cell || !rich) { toast("Pon el cursor dentro de una celda de la tabla"); return; }
  const tr = cell.parentElement, table = cell.closest("table"), k = [...tr.children].indexOf(cell);
  if (op === "row+") { const n = tr.cloneNode(true); n.querySelectorAll("th,td").forEach(c => { const td = document.createElement("td"); td.innerHTML = "&nbsp;"; c.replaceWith(td); }); tr.after(n); }
  if (op === "row-" && table.querySelectorAll("tr").length > 1) tr.remove();
  if (op === "col+") table.querySelectorAll("tr").forEach(r => { const c = r.children[k]; const n = document.createElement(c?.tagName === "TH" ? "th" : "td"); n.innerHTML = "&nbsp;"; (c ? c.after(n) : r.appendChild(n)); });
  if (op === "col-" && tr.children.length > 1) table.querySelectorAll("tr").forEach(r => r.children[k]?.remove());
  if (op === "del") table.remove();
  rich.dispatchEvent(new Event("input", { bubbles: true }));
}

// Lights up the buttons for the formatting under the caret, and shows the table buttons inside a table.
function richToolbarState() {
  const bar = $(".fbar");
  if (!bar || !state.visual) return;
  const s = window.getSelection();
  const inRich = s?.anchorNode && (s.anchorNode.nodeType === 1 ? s.anchorNode : s.anchorNode.parentElement)?.closest(".rich");
  bar.querySelectorAll("[data-cmd]").forEach(b => { let on = false; try { on = !!inRich && document.queryCommandState(b.dataset.cmd); } catch (e) { /* not a state command */ } b.classList.toggle("on", on); });
  const inTable = !!inRich && !!(s.anchorNode.nodeType === 1 ? s.anchorNode : s.anchorNode.parentElement).closest("td,th");
  const tb = $("#ftable");
  if (tb) tb.hidden = !inTable;
}

const SYMBOLS = ["≤", "≥", "≠", "≈", "±", "×", "÷", "√", "π", "°", "²", "³", "½", "¼", "∞", "→", "←", "↔", "α", "β", "Δ", "θ", "λ", "μ", "Ω", "%", "€", "—"];
function fmtInsert(kind) {
  const area = state.lastArea;
  if (!area || !area.isConnected) { toast("Primero haz clic en un campo de texto"); return; }
  const rich = state.visual && richOf(area);
  if (rich) richFocus(rich);
  const sel = rich ? window.getSelection().toString() : area.value.slice(area.selectionStart, area.selectionEnd);
  insertAt(area, {
    bold: `**${sel || "texto"}**`,
    italic: `*${sel || "texto"}*`,
    math: `$${sel || "x^2"}$`,
    frac: `$\\frac{${sel || "a"}}{b}$`,
    table: "\n| Columna 1 | Columna 2 |\n|---|---|\n| | |\n",
    sym: arguments[1],
  }[kind]);
}

// Pasting or dropping a picture into the form adds it as a figure of the question.
async function addPictureFile(file, option = null) {
  try {
    const res = await fetch(`${qpath()}/scan-figures${option ? `?option=${option}` : ""}`, { method: "POST", headers: { "Content-Type": file.type }, body: file });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
    await reloadFigures("Imagen añadida como figura");
  } catch (err) { toast(err.message, true); }
}
document.addEventListener("paste", e => {
  if (!document.body.classList.contains("editing") || $(".studio") || STATIC) return;
  const file = [...(e.clipboardData?.items || [])].find(i => i.kind === "file" && i.type.startsWith("image/"))?.getAsFile();
  if (file) { e.preventDefault(); addPictureFile(file, e.target.dataset?.letter || null); }
});
document.addEventListener("dragover", e => { if (e.target.closest?.("#form")) e.preventDefault(); });
document.addEventListener("drop", e => {
  const file = [...(e.dataTransfer?.files || [])].find(f => f.type.startsWith("image/"));
  if (file && e.target.closest?.("#form") && !STATIC) { e.preventDefault(); addPictureFile(file, e.target.dataset?.letter || null); }
});

// ----- the PDF page: zoom, turn pages, draw a box ---------------------------------------
