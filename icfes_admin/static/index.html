<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICFES editor</title>
<style>
:root { --bg:#f6f7f9; --panel:#fff; --text:#1d2330; --muted:#667085; --line:#d9dde5; --ok:#1f7a4d; --warn:#a15c00; --bad:#b42318; --accent:#2b5bd7; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#14171d; --panel:#1d2129; --text:#e7eaf0; --muted:#98a2b3; --line:#343b48; --ok:#4cc38a; --warn:#f0b35a; --bad:#ff7a6b; --accent:#7ea6ff; } }
:root[data-theme="dark"] { --bg:#14171d; --panel:#1d2129; --text:#e7eaf0; --muted:#98a2b3; --line:#343b48; --ok:#4cc38a; --warn:#f0b35a; --bad:#ff7a6b; --accent:#7ea6ff; }
* { box-sizing: border-box; }
body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--text); }
header { display:flex; gap:16px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
header h1 { font-size:16px; margin:0; }
nav button, button { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; }
nav button.on { border-color:var(--accent); color:var(--accent); }
button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
button:disabled { opacity:.45; cursor:default; }
select, input[type=text], textarea { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:5px 8px; max-width:100%; }
textarea { width:100%; min-height:120px; font-family:ui-monospace, Menlo, monospace; font-size:13px; }
main { padding:16px; max-width:1400px; margin:0 auto; }
table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); }
th, td { padding:7px 9px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
th { font-size:12px; color:var(--muted); font-weight:600; }
tr.click { cursor:pointer; } tr.click:hover td { background:color-mix(in srgb, var(--accent) 8%, transparent); }
.badge { display:inline-block; border-radius:999px; padding:1px 8px; font-size:12px; border:1px solid var(--line); margin:1px 2px 1px 0; }
.bad { color:var(--bad); } .warn { color:var(--warn); } .ok { color:var(--ok); } .muted { color:var(--muted); }
.card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:12px; }
.card h3 { margin:0 0 8px; font-size:13px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
.grid { display:grid; grid-template-columns: minmax(0,1.1fr) minmax(0,.9fr); gap:16px; }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } main { padding:12px; } }
.toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.qlist { display:grid; grid-template-columns: repeat(auto-fill, minmax(70px,1fr)); gap:6px; }
.qlist button { padding:6px 0; text-align:center; }
.qlist button.hidden { border-style:dashed; color:var(--muted); }
.qlist button.err { border-color:var(--bad); }
.qlist button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
.passage { max-height:260px; overflow:auto; border:1px dashed var(--line); padding:8px; border-radius:6px; background:var(--bg); }
.passage table, .preview table { font-size:12px; }
.preview { white-space:pre-wrap; border:1px solid var(--line); border-radius:6px; padding:8px; background:var(--bg); }
.preview table { white-space:normal; border-collapse:collapse; }
.preview td, .preview th { border:1px solid var(--line); padding:3px 6px; }
.opt { display:grid; grid-template-columns: 34px 1fr; gap:6px; align-items:start; margin-bottom:6px; }
.opt b { padding-top:6px; }
.opt textarea { min-height:44px; }
img.scan { width:100%; border:1px solid var(--line); border-radius:6px; }
img.fig { max-width:100%; background:#fff; border:1px solid var(--line); border-radius:6px; margin:4px 0; }
.msg { font-size:13px; margin:3px 0; }
#status { margin-left:auto; font-size:13px; }
ul { margin:4px 0; padding-left:18px; }
</style>
</head>
<body>
<header>
  <h1>ICFES editor</h1>
  <nav>
    <button id="tab-progress" data-tab="progress">Progress</button>
    <button id="tab-questions" data-tab="questions">Questions</button>
  </nav>
  <span id="status" class="muted"></span>
</header>
<main id="app">Loading…</main>
<script>
const $ = (s) => document.querySelector(s);
const app = $("#app");
const state = { tab: "progress", exam: null, filter: "all", n: null, detail: null, exams: [] };

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function status(text, cls = "muted") { const el = $("#status"); el.textContent = text; el.className = cls; }

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) { const err = new Error(body.error || res.statusText); err.body = body; err.status = res.status; throw err; }
  return body;
}

function setTab(tab) {
  state.tab = tab;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  if (tab === "progress") showProgress(); else showQuestions();
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => setTab(b.dataset.tab));

// ----- progress --------------------------------------------------------------

async function showProgress() {
  status("Reading…");
  state.exams = await api("/api/exams");
  status("");
  const rows = state.exams.map(e => `
    <tr class="click" data-exam="${esc(e.exam)}">
      <td><b>${esc(e.exam)}</b><br><span class="muted">${esc(e.title)}</span></td>
      <td>${e.questions}${e.expected != null ? ` <span class="muted">/ ${e.expected}</span>` : ""}</td>
      <td class="${e.ready === e.questions ? "ok" : ""}">${e.ready}</td>
      <td class="${e.hidden ? "warn" : ""}">${e.hidden}</td>
      <td class="${e.errors ? "bad" : "ok"}">${e.errors}</td>
      <td class="muted">${e.warnings}</td>
      <td>${e.key.present ? `${e.key.answers} answers` : '<span class="bad">no key</span>'}${e.key.disputed ? ` <span class="warn">${e.key.disputed} disputed</span>` : ""}</td>
      <td>${e.figures.traced ? `${e.figures.traced} traced` : '<span class="muted">none</span>'}${e.figures.pending_spec ? ` <span class="warn">${e.figures.pending_spec} pending</span>` : ""}</td>
    </tr>`).join("");
  const totals = state.exams.reduce((t, e) => ({ q: t.q + e.questions, r: t.r + e.ready, h: t.h + e.hidden, er: t.er + e.errors }), { q: 0, r: 0, h: 0, er: 0 });
  app.innerHTML = `
    <div class="card"><h3>Totals</h3>
      ${totals.q} questions · <span class="ok">${totals.r} ready</span> · <span class="warn">${totals.h} hidden from students</span> · <span class="bad">${totals.er} validator errors</span>
      <div class="muted">${state.exams.length} exams. Click an exam to browse its questions.</div></div>
    <table>
      <thead><tr><th>Exam</th><th>Questions</th><th>Ready</th><th>Hidden</th><th>Errors</th><th>Warnings</th><th>Answer key</th><th>Traced figures</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  app.querySelectorAll("tr[data-exam]").forEach(tr => tr.onclick = () => { state.exam = tr.dataset.exam; state.n = null; setTab("questions"); });
}

// ----- question list ---------------------------------------------------------

async function showQuestions() {
  if (!state.exams.length) state.exams = await api("/api/exams");
  if (!state.exam) state.exam = state.exams[0]?.exam;
  status("Reading…");
  const rows = await api(`/api/exams/${encodeURIComponent(state.exam)}/questions`);
  status("");
  const pass = rows.filter(r => ({
    all: true,
    hidden: r.hidden.length > 0,
    errors: r.errors > 0,
    warnings: r.warnings > 0,
    notready: !r.ready,
  })[state.filter]);
  const opts = state.exams.map(e => `<option value="${esc(e.exam)}" ${e.exam === state.exam ? "selected" : ""}>${esc(e.exam)}</option>`).join("");
  app.innerHTML = `
    <div class="toolbar">
      <select id="pick-exam">${opts}</select>
      <select id="pick-filter">
        ${[["all","All questions"],["hidden","Hidden from students"],["errors","Validator errors"],["warnings","Warnings"],["notready","Not ready"]]
          .map(([v, l]) => `<option value="${v}" ${v === state.filter ? "selected" : ""}>${l}</option>`).join("")}
      </select>
      <span class="muted">${pass.length} of ${rows.length}</span>
    </div>
    <div class="qlist">
      ${pass.map(r => `<button data-n="${r.number}" class="${r.hidden.length ? "hidden" : ""} ${r.errors ? "err" : ""}" title="${esc(r.hidden.join(", ") || "visible")}">Q${r.number}</button>`).join("")}
    </div>
    <p class="muted">Dashed = hidden from students. Red border = validator error. Click a question to edit it.</p>`;
  $("#pick-exam").onchange = (e) => { state.exam = e.target.value; state.n = null; showQuestions(); };
  $("#pick-filter").onchange = (e) => { state.filter = e.target.value; showQuestions(); };
  app.querySelectorAll("button[data-n]").forEach(b => b.onclick = () => openQuestion(Number(b.dataset.n)));
}

// ----- editor ----------------------------------------------------------------

async function openQuestion(n) {
  state.n = n;
  status("Loading…");
  state.detail = await api(`/api/exams/${encodeURIComponent(state.exam)}/questions/${n}`);
  status("");
  renderEditor();
}

function renderEditor() {
  const d = state.detail, q = d.question, g = d.group;
  const idx = d.numbers.indexOf(d.number);
  const prev = d.numbers[idx - 1], next = d.numbers[idx + 1];
  const scan = d.scan_pages.length ? `<img class="scan" src="/api/scan/${encodeURIComponent(d.exam)}/${d.scan_pages[0]}" alt="scan page ${d.scan_pages[0]}" loading="lazy">` : `<p class="muted">No scan page recorded.</p>`;
  const figs = d.figures.map(f => `
    <div class="msg"><b>${esc(f.spec_id || f.figure_id)}</b> · ${esc(f.kind)} · ${esc(f.method)}${f.pending_spec ? ' · <span class="warn">pending spec</span>' : ""}</div>
    ${f.svg ? `<img class="fig" src="/api/figure?path=${encodeURIComponent(f.svg)}" alt="traced ${esc(f.figure_id)}">` : ""}`).join("") || `<p class="muted">No traced figure for this question.</p>`;
  const msgs = [...d.messages.errors.map(m => `<div class="msg bad">${esc(m)}</div>`), ...d.messages.warnings.map(m => `<div class="msg warn">${esc(m)}</div>`)].join("") || `<div class="msg ok">Validator clean.</div>`;
  const flags = (q.provenance.flags || []).map(f => `<li>${esc(f)}</li>`).join("");
  const notes = (q.provenance.notes || []).map(f => `<li>${esc(f)}</li>`).join("");
  const letters = q.options.map(o => o.letter);
  const keyOpts = `<option value="">— none —</option>` + letters.map(l => `<option value="${l}" ${d.key === l ? "selected" : ""}>${l}</option>`).join("");

  app.innerHTML = `
    <div class="toolbar">
      <button id="prev" ${prev ? "" : "disabled"}>← Q${prev ?? ""}</button>
      <b>${esc(d.exam)} · Q${d.number}</b> <span class="muted">${esc(q.section || "")}${q.part ? " · " + esc(q.part) : ""}</span>
      <button id="next" ${next ? "" : "disabled"}>Q${next ?? ""} →</button>
      <button id="back">All questions</button>
      <span class="muted" style="margin-left:auto"></span>
    </div>
    <div class="toolbar">
      ${d.hidden_reasons.length ? d.hidden_reasons.map(r => `<span class="badge warn">hidden: ${esc(r)}</span>`).join("") : '<span class="badge ok">visible to students</span>'}
    </div>
    <div class="grid">
      <div>
        <div class="card"><h3>Question</h3>
          <label class="muted">Stem (markdown)</label>
          <textarea id="f-stem">${esc(q.stem_md)}</textarea>
          <div class="preview" id="p-stem"></div>
        </div>
        <div class="card"><h3>Options</h3>
          <div id="f-opts">
            ${q.options.map(o => `<div class="opt"><b>${esc(o.letter)}</b><textarea data-letter="${esc(o.letter)}">${esc(o.text_md)}</textarea></div>`).join("")}
          </div>
          <div class="muted">Marked in scan: ${esc(q.scan_marked_option || "—")} · expected options: ${esc(q.expected_options ?? "—")}</div>
        </div>
        <div class="card"><h3>Question-specific passage</h3>
          <label class="muted">Stimulus (markdown)</label>
          <textarea id="f-stimulus">${esc(q.stimulus_md)}</textarea>
        </div>
        <div class="card"><h3>Shared passage ${g ? `(${esc(g.id)}, Q${g.from}-${g.to})` : ""}</h3>
          <div class="muted">${esc(g?.directions || "No shared passage.")}</div>
          <div class="passage">${g ? g.passage_md : ""}</div>
          <div class="muted">Read-only here. Literary passages are never retyped: use [Texto pendiente: página N] and tools/fillpage.py.</div>
        </div>
      </div>
      <div>
        <div class="card"><h3>Save</h3>
          <label><input type="checkbox" id="f-ready" ${q.ready ? "checked" : ""}> Ready (visible to students)</label>
          <div style="margin:8px 0">Answer:
            <select id="f-answer">${keyOpts}</select>
            <span class="muted">from answer-keys/${esc(d.exam)}.key.json</span>
          </div>
          <div class="toolbar" style="margin:0"><button class="primary" id="save">Save</button><span id="save-msg" class="muted"></span></div>
        </div>
        <div class="card"><h3>Validator and flags</h3>
          ${msgs}
          ${flags ? `<h3 style="margin-top:10px">Review flags</h3><ul>${flags}</ul>` : ""}
          ${notes ? `<h3 style="margin-top:10px">Notes</h3><ul>${notes}</ul>` : ""}
        </div>
        <div class="card"><h3>Scan (first source page)</h3>${scan}</div>
        <div class="card"><h3>Traced figures</h3>${figs}</div>
      </div>
    </div>`;

  const stem = $("#f-stem"), pstem = $("#p-stem");
  const renderPreview = () => { pstem.innerHTML = stem.value; };
  stem.oninput = renderPreview; renderPreview();
  $("#back").onclick = () => setTab("questions");
  $("#prev").onclick = () => prev && openQuestion(prev);
  $("#next").onclick = () => next && openQuestion(next);
  $("#save").onclick = saveQuestion;
}

async function saveQuestion() {
  const d = state.detail;
  const options = [...document.querySelectorAll("#f-opts [data-letter]")].map(t => ({ letter: t.dataset.letter, text_md: t.value }));
  const body = {
    stem_md: $("#f-stem").value,
    stimulus_md: $("#f-stimulus").value,
    options,
    ready: $("#f-ready").checked,
    answer: $("#f-answer").value || null,
  };
  const msg = $("#save-msg");
  msg.textContent = "Saving…";
  try {
    state.detail = await api(`/api/exams/${encodeURIComponent(d.exam)}/questions/${d.number}`, {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    status("Saved", "ok");
    renderEditor();
    $("#save-msg").textContent = "Saved";
  } catch (err) {
    if (err.status === 409) {
      msg.innerHTML = `<span class="bad">Nothing saved. Cannot mark ready yet: ${esc((err.body.reasons || []).join(", "))}. Fix those, or untick Ready.</span>`;
    } else {
      msg.innerHTML = `<span class="bad">${esc(err.message)}</span>`;
    }
  }
}

setTab("progress");
</script>
</body>
</html>
