<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cóndor · Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="katex/katex.min.css">
<style>
/* Tokens from the student app's design spec (design/spec.md §2). Dark is the default. */
:root{--bg:#0D110F;--surface:#161B18;--surface-2:#20271F;--line:#2D3630;--text:#F2F5EF;--text-2:#A7B1AA;
 --accent:#C8F04A;--accent-ink:#C8F04A;--on-accent:#0D110F;--accent-soft:rgba(200,240,74,.14);--accent-shadow:#8DB01E;
 --flame:#FF9F43;--ok:#5FD48A;--ok-soft:rgba(95,212,138,.14);--bad:#FF7F6E;--bad-soft:rgba(255,127,110,.14);
 --paper:#FBFAF5;--paper-ink:#1B1B19;--paper-2:#5B5A55;--side:#090C0A;
 --area-lectura:#8AB4FF;--area-mate:#FFB547;--area-sociales:#F59EC4;--area-ciencias:#5ED3B4;--area-ingles:#C79BFF}
:root[data-theme="light"]{--bg:#F3F5EF;--surface:#FFFFFF;--surface-2:#E9EDE4;--line:#D8DED3;--text:#121612;--text-2:#545E57;
 --accent-ink:#4A6600;--on-accent:#121612;--accent-soft:#EEF8CF;--flame:#C25A00;--ok:#1B7F45;--ok-soft:#DDF3E5;--bad:#C2372B;--bad-soft:#FBE3E0;--side:#FFFFFF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.4 Figtree,system-ui,sans-serif;min-height:100vh}
button,select,input,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 24px;background:var(--side);border-bottom:1px solid var(--line)}
.brand{font:800 20px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.01em}
.brand small{display:block;font:700 11px/1 Figtree;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);margin-top:4px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:10px;padding:8px 14px;min-height:36px;cursor:pointer;color:var(--text-2);font-weight:600}
.seg button.on{background:var(--surface);color:var(--text)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--text-2)}
main{padding:20px 24px;max-width:1280px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.label{font:700 12px/1 Figtree;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);margin:0 0 10px}
.display{font:800 30px/1.05 "Bricolage Grotesque",sans-serif}
.title{font:600 22px/1.2 "Bricolage Grotesque",sans-serif;margin:0 0 12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.stats .card{margin:0}
.muted{color:var(--text-2)} .ok{color:var(--ok)} .bad{color:var(--bad)} .flame{color:var(--flame)} .acc{color:var(--accent-ink)}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:700 11px/1 Figtree;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
tr.row{cursor:pointer} tr.row:hover td{background:var(--surface-2)}
.num{font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--accent)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
select,input[type=text],textarea{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 10px}
textarea{width:100%;min-height:110px;font:400 14px/1.45 ui-monospace,Menlo,monospace;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:2px solid var(--line);background:var(--surface);border-radius:999px;cursor:pointer;font-weight:600}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.chip i{width:10px;height:10px;border-radius:3px;display:inline-block}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.cell{min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--text-2);font-weight:700;cursor:pointer;padding:0}
.cell.ready{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cell.hidden{border-style:dashed;color:var(--text-2)}
.cell.err{border-color:var(--bad);color:var(--bad)}
.cell.cur{border-width:3px;border-color:var(--text)}
.btn{min-height:52px;padding:0 20px;border-radius:16px;border:2px solid var(--line);background:transparent;cursor:pointer;font-weight:700}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);box-shadow:0 4px 0 var(--accent-shadow)}
.btn.primary:active{box-shadow:0 0 0 var(--accent-shadow);transform:translateY(4px)}
.btn:disabled{background:var(--surface-2);color:var(--text-2);border-color:transparent;box-shadow:none;cursor:not-allowed}
.btn.sm{min-height:44px;padding:0 14px}
/* The question is paper: stimulus, stem and source sit on a light card in both themes. */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:20px;padding:18px;margin-bottom:12px}
.paper .stimulus,.paper .stem{font:400 17px/1.45 Newsreader,Georgia,serif}
.paper .stem{font-weight:500;margin-top:12px}
.paper .stimulus table,.paper .stem table{border-collapse:collapse;font-size:14px}
.paper td,.paper th{border:1px solid #c9c7bd;padding:4px 8px;background:transparent;color:inherit}
.paper .src{font:400 12px/1.4 Figtree;color:var(--paper-2);margin-top:12px}
.paper p{margin:0 0 8px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;min-height:60px;padding:12px;border:2px solid var(--line);border-bottom-width:3px;border-radius:16px;background:var(--surface);margin-bottom:10px}
.opt .tile{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-weight:700}
.opt .body{font:600 16px/1.4 Figtree}
.opt.marked{border-color:var(--flame)}
.opt.marked .tile{background:var(--flame);color:#0D110F}
.opt .body table{font-size:13px;border-collapse:collapse}
.opt .body td,.opt .body th{border:1px solid var(--line);padding:3px 6px}
.note{padding:10px 12px;border-radius:12px;margin:6px 0;font-size:13px}
.note.bad{background:var(--bad-soft)} .note.warn{background:rgba(255,159,67,.14)} .note.ok{background:var(--ok-soft)}
.badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;border:1px solid var(--line);margin:2px 4px 2px 0;color:var(--text-2)}
.badge.ok{color:var(--ok);border-color:var(--ok)} .badge.hid{color:var(--flame);border-color:var(--flame)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:920px){.grid2{grid-template-columns:1fr} main{padding:16px}.top{padding:12px 16px}}
img.scan{width:100%;border-radius:12px;border:1px solid var(--line)}
.pager{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.pager button{min-width:36px;padding:4px 10px}
img.fig{max-width:100%;background:#fff;border-radius:12px;margin:4px 0}
.figure.native{background:transparent}
.figure.native svg{max-width:100%;height:auto}
.figure-slot{display:block;padding:12px;border:1px dashed #c9c7bd;border-radius:12px;color:var(--paper-2);font-size:13px}
.figure-slot.bad{color:#b42318;border-color:#b42318}
.opt .figure{background:var(--paper);color:var(--paper-ink);border-radius:12px;padding:8px;margin-top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-width:1200px){
 body{display:grid;grid-template-columns:232px minmax(0,1fr)}
 .top{position:sticky;top:0;height:100vh;flex-direction:column;align-items:stretch;gap:16px;padding:20px 16px;border-right:1px solid var(--line);border-bottom:0}
 .top .seg{flex-direction:column}
 .top .seg button{text-align:left;min-height:44px}
 .top .spacer{flex:1}
 .top .pill{justify-content:center}
 main{max-width:none;padding:24px 28px}
}
/* ----- question workspace: page, form and preview side by side ----- */
body.editing{display:block}
body.editing .top{display:none}
body.editing main{padding:0;max-width:none}
.ed{display:flex;flex-direction:column;height:100vh}
.edbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 14px;background:var(--side);border-bottom:1px solid var(--line)}
.edbar .qnum{font:800 20px/1 "Bricolage Grotesque",sans-serif;margin:0 4px}
.edbar select{padding:6px 8px}
.ib{min-height:36px;min-width:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;color:var(--text)}
.ib:hover{border-color:var(--text-2)}
.ib:disabled{opacity:.45;cursor:not-allowed}
.ib.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.ib.go{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.ib.warn{border-color:var(--bad);color:var(--bad)}
.savestate{font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--text-2)}
.savestate.dirty{color:var(--flame);border-color:var(--flame)}
.savestate.ok{color:var(--ok);border-color:var(--ok)}
.savestate.bad{color:var(--bad);border-color:var(--bad)}
.edgrid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,var(--pdfw,42%)) 6px minmax(0,1fr) minmax(0,1fr)}
.edgrid.noprev{grid-template-columns:minmax(0,var(--pdfw,42%)) 6px minmax(0,1fr) 0}
.edgrid.noprev .pane.prev{display:none}
.split{cursor:col-resize;background:var(--line)}
.split:hover{background:var(--accent)}
.pane{min-height:0;overflow:auto;padding:12px 14px}
.pane.form{border-right:1px solid var(--line)}
.pane.pdf{padding:0;display:flex;flex-direction:column;background:var(--surface-2)}
.pdfbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.pdfbar input{width:52px;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.pdfscroll{flex:1;overflow:auto;position:relative}
.pdfpage{position:relative;margin:10px auto;user-select:none}
.pdfpage img{display:block;width:100%;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.35)}
.pdfpage .ov{position:absolute;inset:0}
.pdfpage.cropping .ov{cursor:crosshair}
.box{position:absolute;border:2px solid var(--accent);background:rgba(200,240,74,.18);box-shadow:0 0 0 9999px rgba(0,0,0,.25)}
.anchor{position:absolute;left:0;right:0;height:0;border-top:2px dashed var(--flame);pointer-events:none}
.anchor span{position:absolute;left:4px;top:-20px;background:var(--flame);color:#0D110F;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px}
.cropbar{position:absolute;z-index:3;display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:420px}
.cropbar .ib{min-height:32px;font-size:13px}
.cropbar .lbl{width:100%;font-size:12px;color:var(--text-2)}
.fbar{position:sticky;top:-12px;z-index:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 0;background:var(--bg)}
.fld{margin-bottom:14px}
.fld > .label{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.fld textarea{min-height:44px;overflow:hidden;font:400 14px/1.45 Figtree,system-ui,sans-serif}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent)}
.orow{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:start;margin-bottom:8px}
.ltile{width:40px;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);font-weight:800;cursor:pointer;position:relative;color:var(--text)}
.ltile.key{background:var(--ok);border-color:var(--ok);color:#0D110F}
.ltile .mk{position:absolute;right:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--flame)}
.otools{display:flex;flex-direction:column;gap:2px}
.otools button{min-height:20px;min-width:26px;padding:0 4px;font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;color:var(--text-2)}
.figs{display:grid;gap:8px}
.figcard{border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--surface)}
.figcard .head{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:13px}
.figcard .mini{background:var(--paper);color:var(--paper-ink);border-radius:10px;padding:6px;max-height:220px;overflow:hidden}
.figcard .mini svg,.figcard .mini img{max-width:100%;max-height:200px;display:block;margin:0 auto}
.problems{margin:6px 0 0;padding-left:18px;color:var(--bad);font-size:13px}
.switch{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-weight:600}
.switch input{width:18px;height:18px}
.qstrip{display:flex;gap:4px;overflow-x:auto;padding:6px 10px;border-top:1px solid var(--line);background:var(--side)}
.qstrip button{flex:0 0 auto;min-width:34px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--text-2);font-weight:700;font-size:12px;cursor:pointer;padding:0 4px}
.qstrip button.ready{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.qstrip button.hidden{border-style:dashed}
.qstrip button.err{border-color:var(--bad);color:var(--bad)}
.qstrip button.cur{outline:3px solid var(--text);outline-offset:1px}
.toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);z-index:50;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:80vw}
.toast.bad{background:var(--bad);color:#fff}
.keys{font-size:12px;color:var(--text-2)}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 4px;font:600 11px Figtree}
.paper img.scanfig{max-width:100%;display:block;margin:8px auto}
.opt img.scanfig{max-width:100%;background:#fff}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:grid;place-items:start center;padding-top:8vh}
.sheet{width:min(720px,92vw);max-height:80vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.hits{display:grid;gap:6px}
.hit{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px;cursor:pointer;color:var(--text);font:400 13px/1.4 Figtree}
.hit:hover{border-color:var(--accent)}
table.help{border:0}
table.help td{border-bottom:1px solid var(--line);padding:8px}
select.ib{padding:0 8px}
/* Native tables keep the app's print look inside the editor's own table styles. */
table.icfes-table{width:auto;border:0;border-radius:0;overflow:visible;background:#fff;margin:8px auto}
table.icfes-table th,table.icfes-table td{border:1px solid #000;padding:4px 10px;text-align:center;color:#000;background:#fff;font:400 14px/1.3 Arial,Helvetica,sans-serif;text-transform:none;letter-spacing:0;vertical-align:middle}
table.icfes-table th{font-weight:700}
table.icfes-table caption{font-weight:700;color:#000;margin-bottom:4px}
/* ----- chart and table studio ----- */
.studio{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.stbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--side)}
.stgrid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,34%) minmax(0,36%) minmax(0,30%)}
.stgrid > div{min-height:0;overflow:auto;padding:12px 14px;border-right:1px solid var(--line)}
.kinds{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.kinds button{display:flex;flex-direction:column;align-items:center;gap:2px;width:78px;padding:6px 4px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-size:11px;font-weight:600;color:var(--text)}
.kinds button svg{width:34px;height:26px}
.kinds button.on{border-color:var(--accent);background:var(--accent-soft)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:10px}
.frow label,.fcol label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--text-2);font-weight:600}
.frow input,.frow select,.fcol input,.fcol select{padding:6px 8px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--text)}
.sec{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:12px;background:var(--surface)}
.sec > .label{margin-bottom:8px}
.grid{overflow:auto;max-height:52vh;border:1px solid var(--line);border-radius:10px}
.grid table{border:0;border-radius:0;background:transparent}
.grid td,.grid th{padding:0;border:1px solid var(--line);min-width:70px}
.grid th{background:var(--surface-2);padding:0}
.grid input{width:100%;min-width:64px;border:0;background:transparent;padding:6px 7px;color:var(--text);font:400 13px Figtree}
.grid th input{font-weight:700}
.grid input:focus{background:var(--accent-soft)}
.grid .rh{width:26px;min-width:26px;text-align:center;color:var(--text-2);font-size:11px;background:var(--surface-2)}
.grid .x{border:0;background:transparent;color:var(--text-2);cursor:pointer;font-size:12px;padding:2px 4px}
.grid .x:hover{color:var(--bad)}
.gbtns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.serrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px;padding:8px;border:1px dashed var(--line);border-radius:10px;margin-top:6px}
.prevbox{background:var(--paper);color:var(--paper-ink);border-radius:14px;padding:12px}
.prevbox svg{max-width:100%;height:auto}
.arealist{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;max-height:46vh;overflow:auto}
.arealist label{display:grid;grid-template-columns:1fr 120px;align-items:center;gap:6px;font-size:12px}
.arealist select{padding:3px 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.sw{display:inline-block;width:12px;height:12px;border:1px solid #000;vertical-align:middle}
@media (max-width:1100px){.edgrid{grid-template-columns:1fr;grid-template-rows:45vh auto auto}.split{display:none}.stgrid{grid-template-columns:1fr}.pane{overflow:visible}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Cóndor<small>Editor de preguntas</small></div>
  <div class="seg" role="tablist">
    <button id="tab-progress" data-tab="progress" role="tab">Progreso</button>
    <button id="tab-questions" data-tab="questions" role="tab">Preguntas</button>
  </div>
  <span class="spacer"></span>
  <span id="status" class="pill">Cargando…</span>
  <button class="pill" id="theme" title="Tema">Tema</button>
</header>
<main id="app"></main>
<script src="figures-render.js"></script>
<script src="render.bundle.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const app = $("#app");
const AREA = { "Lectura crítica": "--area-lectura", "Matemáticas": "--area-mate", "Sociales y ciudadanas": "--area-sociales", "Ciencias naturales": "--area-ciencias", "Inglés": "--area-ingles" };
const state = { tab: "progress", exam: null, filter: "all", n: null, detail: null, exams: [], rows: [], natives: {},
  page: 1, zoom: 1, engine: "auto", cropping: false, box: null, dirty: false, opts: [], lastArea: null, preview: true };
const STATIC = !!window.ICFES_STATIC;
try { state.engine = JSON.parse(localStorage.getItem("icfes-editor:engine")) || "auto"; } catch (e) { /* default */ }

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function status(text, cls = "") { const el = $("#status"); if (el) { el.textContent = text; el.className = "pill " + cls; } }
function render(html) { return window.renderRich ? window.renderRich(html || "") : esc(html); }
function areaColor(name) { return AREA[name] ? `var(${AREA[name]})` : "var(--text-2)"; }
function fmt(n) { return n == null ? "—" : Number(n).toLocaleString("es-CO"); }
let toastTimer;
function toast(text, bad = false) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div");

const FILTERS = [["all", "Todas"], ["hidden", "Ocultas"], ["errors", "Con errores"], ["badfig", "Figura inválida"], ["warnings", "Avisos"], ["notready", "No listas"]];

// Problems of one native figure, in plain words. An empty list means the engine can draw it.
const MSG = [
  [/^x\.label is required/, () => "Falta el título del eje X"],
  [/^y\.label is required/, () => "Falta el título del eje Y"],
  [/^y2.*label.*required/, () => "Falta el título del segundo eje Y"],
  [/^categories must be a non-empty array/, () => "Agrega al menos una categoría (fila)"],
  [/^series must be a non-empty array/, () => "Agrega al menos una serie"],
  [/^series\[(\d+)\]\.values must have one entry per category/, m => `La serie ${+m[1] + 1} necesita un valor en cada fila`],
  [/^series\[(\d+)\]\.values\[(\d+)\] must be a number/, m => `Serie ${+m[1] + 1}, fila ${+m[2] + 1}: escribe un número`],
  [/^series\[(\d+)\]\.values\[(\d+)\] must not be negative/, m => `Serie ${+m[1] + 1}, fila ${+m[2] + 1}: las barras no pueden ser negativas`],
  [/^series\[(\d+)\]\.points\[(\d+)\] must be \[x, y\]/, m => `Serie ${+m[1] + 1}, punto ${+m[2] + 1}: faltan x o y`],
  [/^series\[(\d+)\]\.points needs at least two/, m => `Serie ${+m[1] + 1}: la curva necesita al menos dos puntos`],
  [/^slices needs at least two/, () => "La torta necesita al menos dos partes"],
  [/^slices\[(\d+)\]\.value/, m => `Parte ${+m[1] + 1}: el valor debe ser un número mayor o igual a 0`],
  [/^row (\d+) covers (\d+) columns, expected (\d+)/, m => `La fila ${+m[1] + 1} tiene ${m[2]} celdas y deberían ser ${m[3]}`],
  [/^(\w+): min must be below max/, m => `Eje ${m[1].toUpperCase()}: el mínimo debe ser menor que el máximo`],
  [/^fills: unknown area (.+)/, m => `El mapa no tiene el área «${m[1]}»`],
  [/^region .* could not be loaded/, () => "No se pudo cargar el contorno del mapa"],
  [/^shapes must be a non-empty array/, () => "El diagrama no tiene formas"],
];
function friendly(msg) {
  for (const [rx, f] of MSG) { const m = rx.exec(msg); if (m) return f(m); }
  return msg;
}
function figProblems(f) {
  const E = window.ICFESFigures;
  if (!f.spec) return ["Figura sin dibujar todavía"];
  if (!E) return [];
  const spec = { ...f.spec, kind: f.kind || f.spec.kind };
  let errs = E.validate(spec);
  if (!errs.length) { try { E.render(spec); } catch (e) { errs = [e.message]; } }
  // The same problem repeated for every area or cell says nothing new.
  return [...new Set(errs.map(friendly))];
}
const traceShown = (t) => ["azure", "eyeballed_box"].includes(t.method) && t.svg;
// Figures whose native spec a scan picture replaces (the app drops them the same way).
function replacedIds(traced) { return new Set(traced.filter(traceShown).flatMap(t => [t.spec_id, t.figure_id])); }
function badFigure(n) {
  const traced = (state.detail && state.detail.number === n) ? state.detail.figures : [];
  const gone = replacedIds(traced || []);
  return (state.natives[String(n)] || []).some(f => !gone.has(f.id) && figProblems(f).length);
}

      <button type="button" class="ltile ${state.answer === o.letter ? "key" : ""}" onclick="setAnswer('${esc(o.letter)}')" title="${state.answer === o.letter ? "Respuesta correcta" : "Marcar como respuesta correcta"}">${esc(o.letter)}${o.marked_in_scan ? '<i class="mk" title="marcada en el escaneo"></i>' : ""}</button>
      <textarea data-letter="${esc(o.letter)}" spellcheck="true" lang="es" placeholder="Texto de la opción ${esc(o.letter)}">${esc(o.text_md)}</textarea>
      <span class="otools">
        <button type="button" onclick="moveOpt(${i}, -1)" ${i === 0 ? "disabled" : ""} title="Subir">↑</button>
        <button type="button" onclick="moveOpt(${i}, 1)" ${i === state.opts.length - 1 ? "disabled" : ""} title="Bajar">↓</button>
        <button type="button" onclick="removeOpt(${i})" title="Quitar opción">✕</button>
      </span>
    </div>`).join("") + `<button class="ib" type="button" onclick="addOpt()">+ Opción</button>
    <span class="muted" style="font-size:12px;margin-left:8px">Respuesta: <b>${esc(state.answer || "sin clave")}</b>${state.answer ? ` <a href="#" onclick="setAnswer('');return false">quitar</a>` : ""}</span>`;
  document.querySelectorAll("#f-opts textarea").forEach(fit);
}
function setAnswer(letter) { syncOpts(); state.answer = state.answer === letter ? "" : letter; drawOpts(); markDirty(); }
function addOpt() {
  syncOpts();
  const used = state.opts.map(o => o.letter);
  state.opts.push({ letter: "ABCDEFGHIJ".split("").find(l => !used.includes(l)) || "?", text_md: "", marked_in_scan: false });
  drawOpts(); markDirty(); refreshPreview();
}
function removeOpt(i) { syncOpts(); state.opts.splice(i, 1); drawOpts(); markDirty(); refreshPreview(); }
function moveOpt(i, delta) {
  syncOpts();
  const j = i + delta;
  if (j < 0 || j >= state.opts.length) return;
  [state.opts[i], state.opts[j]] = [state.opts[j], state.opts[i]];
  drawOpts(); markDirty(); refreshPreview();
}

// ----- figures: native charts and tables, and pictures cut from the scan ---------------

function drawNative(f, slot = true) {
  const E = window.ICFESFigures;
  const problems = figProblems(f);
  if (problems.length) return slot ? `<span class="figure-slot bad">No se puede dibujar: ${esc(problems.slice(0, 3).join("; "))}${problems.length > 3 ? "…" : ""}</span>` : "";
  try {
    const markup = window.DOMPurify.sanitize(E.render({ ...f.spec, kind: f.kind || f.spec.kind }), { USE_PROFILES: { svg: true, svgFilters: true, html: true } });
    return `<div class="figure native">${markup}</div>`;
  } catch (e) {
    return slot ? `<span class="figure-slot bad">${esc(e.message)}</span>` : "";
  }
}
const scanUrl = (t) => `/api/figure?path=${encodeURIComponent(t.svg)}`;
function traceOption(t) { return t.option || (/[-_](?:opt|opcion|opción)[-_]([a-d])(?=[-_]|$)/i.exec(t.figure_id || "")?.[1]?.toUpperCase() ?? null); }

function drawFigs() {
  const d = state.detail;
  const gone = replacedIds(d.figures);
  const natives = d.native_figures.map(f => {
    const problems = figProblems(f);
    const replaced = gone.has(f.id);
    return `<div class="figcard">
      <div class="head"><b>${esc(KIND_NAMES[f.kind] || f.kind)}</b>
        <span class="muted">${f.target === "option" ? `opción ${esc(f.option)}` : "enunciado"}</span>
        ${replaced ? '<span class="badge">reemplazada por un recorte</span>' : problems.length ? '<span class="badge hid">oculta a estudiantes</span>' : '<span class="badge ok">se dibuja</span>'}
        <span class="spacer"></span>
        <button class="ib" type="button" onclick="openStudio('${esc(f.id)}')">Editar</button>
        ${STATIC ? "" : `<button class="ib" type="button" onclick="startCrop('${esc(f.id)}', '${f.target === "option" ? esc(f.option) : ""}')" title="Cambiar esta figura por un recorte de la página">✂ Usar recorte</button>
        <button class="ib warn" type="button" onclick="deleteNative('${esc(f.id)}')" title="Quitar">✕</button>`}
      </div>
      ${problems.length && !replaced ? `<ul class="problems">${problems.slice(0, 4).map(p => `<li>${esc(p)}</li>`).join("")}${problems.length > 4 ? `<li>y ${problems.length - 4} más</li>` : ""}</ul>` : `<div class="mini">${drawNative(f)}</div>`}
    </div>`;
  });
  const scans = d.figures.filter(traceShown).map(t => `<div class="figcard">
      <div class="head"><b>Imagen del escaneo</b><span class="muted">${traceOption(t) ? `opción ${esc(traceOption(t))}` : "enunciado"}</span>
        <span class="spacer"></span>
        ${STATIC ? "" : `<button class="ib warn" type="button" onclick="deleteScan('${esc(t.figure_id)}')" title="Quitar">✕</button>`}</div>
      <div class="mini"><img src="${scanUrl(t)}" alt="${esc(t.figure_id)}"></div></div>`);
  const pending = d.figures.filter(t => !traceShown(t)).map(t => `<div class="figcard"><div class="head"><b>${esc(t.figure_id || t.spec_id)}</b><span class="badge hid">${t.pending_spec ? "pendiente" : esc(t.method || "")}</span></div></div>`);
  $("#figs").innerHTML = [...natives, ...scans, ...pending].join("") || `<p class="muted" style="margin:0">Sin figuras. Si la pregunta tiene un dibujo, mapa o foto, recórtalo del PDF. Si es una gráfica o tabla, créala con «+ Gráfica o tabla».</p>`;
}

async function deleteNative(id) {
  if (!confirm("¿Quitar esta figura? Puedes deshacerlo con «Deshacer».")) return;
  try {
    await api(`${qpath()}/figures/${encodeURIComponent(id)}`, { method: "DELETE" });

  } catch (e) { toast(e.message, true); }
}
async function deleteScan(id) {
  try {
    await api(`${qpath()}/scan-figures/${encodeURIComponent(id)}`, { method: "DELETE" });
    await reloadFigures("Imagen quitada");
  } catch (e) { toast(e.message, true); }

// Figures save on their own; the form keeps what was typed and is not redrawn.
async function reloadFigures(msg) {
  const fresh = await api(qpath());
  const d = state.detail;
  d.figures = fresh.figures; d.native_figures = fresh.native_figures; d.undo = fresh.undo; d.hidden_reasons = fresh.hidden_reasons;
  state.natives[String(d.number)] = fresh.native_figures;
  drawFigs(); refreshPreview(); refreshChrome();
  if (msg) toast(msg);
}

function refreshChrome() {
  const d = state.detail;
  $("#vis").innerHTML = visBadges(hiddenNow());
  const u = $("#undo");
  if (u) { u.disabled = !d.undo; u.textContent = `↶ Deshacer${d.undo ? ` (${d.undo})` : ""}`; }

// ----- student preview (same renderer and figure engine as the app) -------------------

function studentView(q, g, d) {
  const gone = replacedIds(d.figures);
  const natives = d.native_figures.filter(f => !gone.has(f.id));
  const scans = d.figures.filter(traceShown);
  const stemFigs = natives.filter(f => f.target !== "option").map(f => drawNative(f)).join("");
  const stemScans = scans.filter(t => !traceOption(t)).map(t => `<img class="scanfig" src="${scanUrl(t)}" alt="">`).join("");
  const opts = q.options.map(o => {
    const nat = natives.find(f => f.target === "option" && f.option === o.letter);
    const sc = scans.find(t => traceOption(t) === o.letter);
    const body = nat ? drawNative(nat) : sc ? `<img class="scanfig" src="${scanUrl(sc)}" alt="">` : render(o.text_md);
    return `<div class="opt ${state.answer === o.letter ? "marked" : ""}" style="pointer-events:none"><span class="tile">${esc(o.letter)}</span><div class="body">${body}</div></div>`;
  }).join("");
  const gText = g ? (g.passage_md || g.stimulus_md || "") : "";
  const plain = h => (h ?? "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim().toLowerCase();
  const stemInPassage = !!g && plain(q.stem_md).length > 20 && plain(gText).includes(plain(q.stem_md));
  const dir = g ? `<div class="label" style="color:var(--paper-2)">${esc(g.directions)}</div><div class="stimulus">${render(gText)}</div><hr style="border:0;border-top:1px solid #d8d6cc;margin:12px 0">` : "";
  return `
    <div class="paper">
      <div class="label" style="color:var(--paper-2)">Pregunta ${q.number}</div>
      ${dir}
      ${q.stimulus_md ? `<div class="stimulus">${render(q.stimulus_md)}</div>` : ""}
      ${stemScans}${stemFigs}
      ${stemInPassage ? "" : `<div class="stem">${render(q.stem_md)}</div>`}
      <div class="src">Fuente: ICFES, Saber 11 · ${esc(state.exam)}</div>
    </div>
    ${opts}
    <p class="muted" style="font-size:12px">El borde naranja marca la respuesta de la clave (solo en el editor).</p>`;
}

let previewQueued = false;
function refreshPreview() {
  if (previewQueued) return;
  previewQueued = true;
  requestAnimationFrame(() => {
    previewQueued = false;
    const d = state.detail; if (!d || !$("#preview")) return;
    const q = { ...d.question, stem_md: $("#f-stem").value, stimulus_md: $("#f-stimulus").value, options: state.opts };
    const g = d.group && $("#f-passage") ? { ...d.group, passage_md: $("#f-passage").value } : d.group;
    $("#preview").innerHTML = studentView(q, g, d);
  });
}

// ----- saving, undo and keys ---------------------------------------------------------

async function saveQuestion() {
  const d = state.detail;
  if (!d) return false;
  syncOpts();
  const ready = $("#f-ready").checked;
  if (ready && badFigure(d.number)) {
    setSave("No se guardó: una figura no se puede dibujar. Arréglala, recórtala del PDF o desmarca «Lista».", "bad");
    toast("Una figura no se puede dibujar; los estudiantes no deben verla así.", true);
    return false;
  }
  const body = {
    stem_md: $("#f-stem").value,
    stimulus_md: $("#f-stimulus").value,
    options: state.opts.map(o => ({ letter: o.letter, text_md: o.text_md })),
    ready,
    answer: state.answer || null,
    section: $("#f-section").value.trim(),
  };
  if (d.group) body.group_passage_md = $("#f-passage").value;
  setSave("Guardando…", "");
  try {
    const fresh = await api(qpath(d), J("PUT", body));
    state.detail = { ...fresh };
    state.dirty = false;
    const r = state.rows.find(x => x.number === d.number);
    if (r) { r.ready = fresh.question.ready; r.hidden = fresh.hidden_reasons; r.errors = fresh.messages.errors.length; r.warnings = fresh.messages.warnings.length; }
    if (document.body.classList.contains("editing") && state.n === d.number) {
      state.detail.question.options = fresh.question.options;
      refreshChrome();
      setSave(`Guardado ${new Date().toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" })}`, "ok");
    }
    return true;
  } catch (err) {
    if (err.status === 409) setSave(`No se guardó: no puede estar lista todavía (${(err.body.reasons || []).join(", ")}). Corrige eso o desmarca «Lista».`, "bad");
    else setSave(`No se guardó: ${err.message}`, "bad");
    toast("No se guardó. Mira el aviso arriba.", true);
    return false;
  }
}
function setSave(text, cls) { const s = $("#savestate"); if (s) { s.textContent = text; s.className = "savestate " + cls; } }

async function readyAndNext() {
  $("#f-ready").checked = true;
  markDirty();
  if (await saveQuestion()) $("#next").disabled ? toast("Era la última pregunta del examen") : $("#next").click();
}

function nextToFix() {
  const rows = state.rows, cur = rows.findIndex(r => r.number === state.n);
  const needs = r => r.errors || r.hidden.length || badFigure(r.number);
  for (let k = 1; k <= rows.length; k++) { const r = rows[(cur + k) % rows.length]; if (needs(r)) return r.number; }
  return null;
}

// Small per-viewer memory: theme, OCR engine and the last question opened.
function remember(key, value) { try { localStorage.setItem("icfes-editor:" + key, JSON.stringify(value)); } catch (e) { /* private window */ } }
function recall(key) { try { return JSON.parse(localStorage.getItem("icfes-editor:" + key)); } catch (e) { return null; } }

let searchTimer;
function openSearch() {
  overlay(`<div class="label">Buscar preguntas</div>
    <input id="q-search" placeholder="Palabras del enunciado, opciones o texto (sin importar tildes)" style="width:100%;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--text)">
    <label class="switch" style="margin:8px 0;font-size:13px"><input type="checkbox" id="q-all"> En todos los exámenes</label>
    <div id="q-hits" class="hits"></div>`);
  const run = async () => {
    const q = $("#q-search").value.trim();
    if (q.length < 3) { $("#q-hits").innerHTML = '<p class="muted">Escribe al menos 3 letras.</p>'; return; }
    const hits = await api(`/api/search?q=${encodeURIComponent(q)}${$("#q-all").checked ? "" : `&exam=${encodeURIComponent(state.exam)}`}`);
    $("#q-hits").innerHTML = hits.length ? hits.map(h => `<button class="hit" data-exam="${esc(h.exam)}" data-n="${h.number}"><b>${esc(h.exam)} · Q${h.number}</b> <span class="muted">${esc(h.section || "")}</span><br><span>${esc(h.snippet)}</span></button>`).join("") : '<p class="muted">Sin resultados.</p>';
    $("#q-hits").querySelectorAll(".hit").forEach(b => b.onclick = () => { closeOverlay(); leave(async () => { const ch = state.exam !== b.dataset.exam; state.exam = b.dataset.exam; await openQuestion(Number(b.dataset.n), { reloadExam: ch }); }); });
  };
  $("#q-search").oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(run, 250); };
  $("#q-all").onchange = run;

async function undo() {
  if (state.dirty && !confirm("Tienes cambios sin guardar. Deshacer los descarta y vuelve al último guardado anterior. ¿Seguir?")) return;
  try {
    await api(`${qpath()}/undo`, J("POST", {}));
    state.dirty = false;
    await openQuestion(state.n, { reloadExam: true });
    toast("Cambio deshecho");
  } catch (e) { toast(e.message, true); }
}

document.addEventListener("keydown", e => {
  if (!document.body.classList.contains("editing")) return;
  if ($(".studio")) {
    if (e.key === "Escape") closeStudio();
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveStudio(); }
    return;
  }
  if ($("#overlay")) { if (e.key === "Escape") closeOverlay(); return; }
  const typing = /TEXTAREA|INPUT|SELECT/.test(e.target.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveQuestion(); }
  else if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); readyAndNext(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openSearch(); }
  else if (e.altKey && e.key.toLowerCase() === "n") { e.preventDefault(); $("#fixnext").click(); }
  else if (e.altKey && e.key.toLowerCase() === "r") { e.preventDefault(); state.cropping ? cancelCrop() : startCrop(); }
  else if (!typing && e.key === "?") { showHelp(); }
  else if (e.altKey && e.key === "ArrowRight") { e.preventDefault(); $("#next").click(); }
  else if (e.altKey && e.key === "ArrowLeft") { e.preventDefault(); $("#prev").click(); }
  else if (e.key === "Escape") { cancelCrop(); }
});

// Remembers the text field last used, so the format buttons and OCR know where to write.
document.addEventListener("focusin", e => { if (e.target.tagName === "TEXTAREA" && e.target.closest("#form")) state.lastArea = e.target; });

// Typing through execCommand keeps Ctrl+Z working for inserted text.
function insertAt(area, text, selectInserted = false) {
  const start = area.selectionStart ?? area.value.length, end = area.selectionEnd ?? start;
  area.focus();
  area.setSelectionRange(start, end);
  if (!document.execCommand("insertText", false, text)) area.value = area.value.slice(0, start) + text + area.value.slice(end);
  if (selectInserted) area.setSelectionRange(start, start + text.length); else area.setSelectionRange(start + text.length, start + text.length);
  area.dispatchEvent(new Event("input", { bubbles: true }));
}
const SYMBOLS = ["≤", "≥", "≠", "≈", "±", "×", "÷", "√", "π", "°", "²", "³", "½", "¼", "∞", "→", "←", "↔", "α", "β", "Δ", "θ", "λ", "μ", "Ω", "%", "€", "—"];
function fmtInsert(kind) {
  const area = state.lastArea;
  if (!area || !area.isConnected) { toast("Primero haz clic en un campo de texto"); return; }
  const sel = area.value.slice(area.selectionStart, area.selectionEnd);
  insertAt(area, {
    bold: `**${sel || "texto"}**`,
    italic: `*${sel || "texto"}*`,
    math: `$${sel || "x^2"}$`,
    frac: `$\\frac{${sel || "a"}}{b}$`,
    table: "\n| Columna 1 | Columna 2 |\n|---|---|\n| | |\n",
    sym: arguments[1],
  }[kind]);
}

// Pasting or dropping a picture into the form adds it as a figure of the question.
async function addPictureFile(file, option = null) {

    const body = await res.json();
    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
    await reloadFigures("Imagen añadida como figura");
  } catch (err) { toast(err.message, true); }
}
document.addEventListener("paste", e => {
  if (!document.body.classList.contains("editing") || $(".studio") || STATIC) return;
  const file = [...(e.clipboardData?.items || [])].find(i => i.kind === "file" && i.type.startsWith("image/"))?.getAsFile();
  if (file) { e.preventDefault(); addPictureFile(file, e.target.dataset?.letter || null); }
});
document.addEventListener("dragover", e => { if (e.target.closest?.("#form")) e.preventDefault(); });
document.addEventListener("drop", e => {

// ----- the PDF page: zoom, turn pages, draw a box ---------------------------------------

function pageMissing(img) {
  img.replaceWith(Object.assign(document.createElement("div"), { className: "note warn", textContent: "La página original no se pudo abrir. En esta copia en línea no hay PDF: ábrela con el editor del computador." }));
}
function anchorMark() {
  const a = state.detail.anchor;
  return a && a.page === state.page ? `<div class="anchor" style="top:${a.y * 100}%"><span>Q${state.detail.number}</span></div>` : "";
}

function bindPdf() {
  const img = $("#pdfimg");
  img.onerror = () => { img.replaceWith(Object.assign(document.createElement("p"), { className: "muted", style: "padding:16px", textContent: "No se pudo cargar esta página. Revisa pdf-sources.json, o instala PyMuPDF: python -m pip install pymupdf" })); };
  img.onload = () => scrollToAnchor();
  $("#pg").onchange = (e) => goPage(Number(e.target.value));
  $("#pdfscroll").addEventListener("wheel", (e) => { if (!e.ctrlKey) return; e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.1 : 1 / 1.1); }, { passive: false });
  const ov = $("#ov");
  let start = null;
  const frac = (ev) => { const r = ov.getBoundingClientRect(); return [Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height))]; };

async function ocrTo(dest) {

      syncOpts();
      const byLetter = Object.fromEntries(state.opts.map(o => [o.letter, o]));
      for (const [letter, t] of Object.entries(parts)) {
        if (byLetter[letter]) byLetter[letter].text_md = t;
        else state.opts.push({ letter, text_md: t, marked_in_scan: false });
      }
      state.opts.sort((x, y) => x.letter.localeCompare(y.letter));
      drawOpts(); markDirty(); refreshPreview();

// "A. uno B. dos…" split by option letter. The first option's letter is often lost under the answer bubble, so text
// before the first letter found is the option just before it.
function splitOptions(text) {
  const rx = /(^|\n|\s)([A-E])[.)]\s+/g;
  const marks = [];
  let m;
  while ((m = rx.exec(text))) marks.push({ letter: m[2], at: m.index + m[1].length, start: rx.lastIndex });
  const seq = [];
  for (const mk of marks) { const want = seq.length ? String.fromCharCode(seq[seq.length - 1].letter.charCodeAt(0) + 1) : null; if (!want || mk.letter === want) seq.push(mk); }
  if (seq.length < 2) return null;
  const out = {};
  const head = text.slice(0, seq[0].at).replace(/^[^A-Za-zÁÉÍÓÚÑáéíóúñ¿¡0-9$(]+/, "").trim();
  if (head && seq[0].letter !== "A") out[String.fromCharCode(seq[0].letter.charCodeAt(0) - 1)] = head;
  seq.forEach((mk, i) => { out[mk.letter] = text.slice(mk.start, i + 1 < seq.length ? seq[i + 1].at : undefined).replace(/\s+/g, " ").trim(); });
  return out;
}

// Joins lines cut by the scan: hyphenated word breaks, single line breaks inside a paragraph, doubled spaces.
function cleanText(t) {

    .replace(/([^\n])\n(?!\n|\s*[A-E][.)]\s|\s*[-•*|]|\s*\d+[.)]\s)/g, "$1 ")
    .replace(/[ \t]{2,}/g, " ")
    .replace(/ +([,.;:?!)])/g, "$1")

}

// Moving between kinds keeps the data that fits: categories and series, or the table's cells.
function convert(spec, to) {
  const from = spec.kind;
  if (from === to) return spec;
  const keep = { title: spec.title };
  const base = starter(to);
  let cats = null, series = null;
  if (CAT_KINDS.includes(from)) { cats = spec.categories || []; series = spec.series || []; }
  if (from === "table") {
    const rows = spec.rows || [];
    const head = spec.headers || [];
    cats = rows.map(r => String(typeof r[0] === "object" ? r[0]?.text ?? "" : r[0] ?? ""));
    series = head.slice(1).map((h, i) => ({ name: String(typeof h === "object" ? h.text ?? "" : h), values: rows.map(r => parseNum(typeof r[i + 1] === "object" ? r[i + 1]?.text : r[i + 1])) }));
  }
  if (from === "pie" && spec.slices) { cats = spec.slices.map(s => s.label); series = [{ name: "", values: spec.slices.map(s => s.value) }]; }
  if (cats && series) {
    if (CAT_KINDS.includes(to)) {
      const s = series.map((x, i) => {
        const out = { name: x.name ?? "", values: x.values };
        if (to === "combo") out.type = i === 0 ? "bar" : "line";
        if (to !== "combo" && x.pattern && to === "bar") out.pattern = x.pattern;
        return out;
      });
      return { ...base, ...keep, x: spec.x || base.x, y: spec.y || base.y, categories: cats, series: s };
    }
    if (to === "table") return { ...base, ...keep, headers: [spec.x?.label || "", ...series.map(s => s.name || "")], rows: cats.map((c, j) => [c, ...series.map(s => numText(s.values?.[j]))]) };
    if (to === "pie") return { ...base, ...keep, slices: cats.map((c, j) => ({ label: c, value: series[0]?.values?.[j] ?? 0 })) };
  }
  return { ...base, ...keep };
}

// Numbers as typed in Colombia: 1.200 is twelve hundred and 12,5 is twelve and a half.
function parseNum(v) {
  if (v == null) return null;
  let s = String(v).trim().replace(/\s|%/g, "");
  if (s === "") return null;
  if (s.includes(",") && s.includes(".")) s = s.replace(/\./g, "").replace(",", ".");
  else if (s.includes(",")) s = s.replace(",", ".");
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  const n = Number(s);
  return Number.isFinite(n) ? n : v;
}

  if (studio.mode === "json") { try { studio.draft.spec = JSON.parse($("#st-json").value); } catch (e) { toast("El JSON no es válido: " + e.message, true); return; } }
  studio.mode = mode;
  $("#studio .seg").innerHTML = `<button class="${mode === "form" ? "on" : ""}" onclick="studioMode('form')">Formulario</button><button class="${mode === "json" ? "on" : ""}" onclick="studioMode('json')">JSON</button>`;
  drawStudioForm();
}

function studioPreview() {
  const sp = studio.draft.spec;
  const f = { kind: sp.kind, spec: sp };
  const problems = figProblems(f);
  $("#st-prev").innerHTML = problems.length ? `<p class="muted" style="color:var(--paper-2)">Todavía no se puede dibujar.</p>` : drawNative(f);
  $("#st-probs").innerHTML = problems.length
    ? `<div class="note bad" style="margin-top:10px"><b>Falta arreglar</b><ul class="problems" style="color:inherit">${problems.slice(0, 8).map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>`
    : `<div class="note ok" style="margin-top:10px">Lista: el motor de la app la dibuja así.</div>`;
}

const sel = (opts, cur) => opts.map(([v, l]) => `<option value="${esc(v)}" ${String(cur ?? "") === v ? "selected" : ""}>${esc(l)}</option>`).join("");
const inp = (path, label, val, type = "text", extra = "") => `<label>${label}<input data-p="${path}" data-t="${type === "number" ? "num" : "str"}" value="${esc(val ?? "")}" ${extra}></label>`;
function getPath(o, path) { return path.split(".").reduce((a, k) => (a == null ? a : a[k]), o); }
function setPath(o, path, v) {
  const keys = path.split(".");
  let cur = o;
  keys.slice(0, -1).forEach(k => { if (cur[k] == null || typeof cur[k] !== "object") cur[k] = {}; cur = cur[k]; });
  const last = keys[keys.length - 1];
  if (v === undefined || v === "" || v === null) delete cur[last]; else cur[last] = v;
}

function drawStudioForm() {
  const sp = studio.draft.spec, box = $("#st-form");
  if (studio.mode === "json") {
    box.innerHTML = `<div class="sec"><div class="label">JSON de la figura</div><textarea id="st-json" style="min-height:60vh;font:13px/1.4 ui-monospace,Menlo,monospace">${esc(JSON.stringify(sp, null, 2))}</textarea>
      <p class="muted" style="font-size:12px">Para opciones avanzadas (notas, celdas combinadas, formas). La vista previa se actualiza al escribir.</p></div>`;
    $("#st-json").oninput = (e) => { try { studio.draft.spec = JSON.parse(e.target.value); studioPreview(); } catch (err) { $("#st-probs").innerHTML = `<div class="note bad">JSON: ${esc(err.message)}</div>`; } };
    studioPreview();
    return;
  }
  const kinds = Object.keys(KIND_NAMES).map(k => `<button class="${sp.kind === k ? "on" : ""}" onclick="setKind('${k}')"><svg viewBox="0 0 34 26" fill="currentColor" stroke="currentColor">${KIND_ICONS[k]}</svg>${KIND_NAMES[k]}</button>`).join("");
  let body = "";
  if (CAT_KINDS.includes(sp.kind) && !(sp.series || []).some(s => Array.isArray(s.points))) body = catForm(sp);
  else if (PT_KINDS.includes(sp.kind) || sp.kind === "line") body = ptForm(sp);
  else if (sp.kind === "pie") body = pieForm(sp);
  else if (sp.kind === "table") body = tableForm(sp);
  else if (sp.kind === "map") body = mapForm(sp);
  else body = `<div class="sec"><div class="label">${esc(KIND_NAMES[sp.kind] || sp.kind)}</div>
    <p class="muted">Las figuras de ${sp.kind === "geometry" ? "geometría" : "diagrama"} se dibujan con coordenadas. Ajústalas en la pestaña JSON viendo la vista previa.
    Si es un dibujo, foto o esquema complejo, es más rápido cerrarlo y usar «✂ Recortar del PDF».</p>
    <div class="frow">${inp("title", "Título", sp.title)}</div></div>`;
  box.innerHTML = `<div class="kinds">${kinds}</div>${body}`;
  box.oninput = box.onchange = (e) => {
    const t = e.target;
    if (t.dataset.p) {
      const v = t.type === "checkbox" ? (t.dataset.inv ? (t.checked ? undefined : false) : (t.checked || undefined)) : t.dataset.t === "num" ? parseNum(t.value) ?? undefined : t.value;
      setPath(sp, t.dataset.p, v);
      if (["x", "y", "y2"].includes(t.dataset.p.split(".")[0])) { const ax = t.dataset.p.split(".")[0]; if (sp[ax] && !Object.keys(sp[ax]).length) delete sp[ax]; }
    }
    if (t.dataset.s != null) {
      const s = sp.series[+t.dataset.s];
      const v = t.type === "checkbox" ? (t.checked || undefined) : t.value;
      if (t.dataset.k === "axis") setPath(s, "axis", v === "2" ? 2 : undefined);
      else if (t.dataset.k === "name") { s.name = v; }
      else setPath(s, t.dataset.k, v);
      if (t.dataset.k === "type" && e.type === "change") { drawStudioForm(); return; }
    }
    if (t.dataset.area != null) { sp.fills = sp.fills || {}; if (t.value) sp.fills[t.dataset.area] = t.value; else delete sp.fills[t.dataset.area]; }
    studioPreview();
  };
  bindGrids();
  studioPreview();
}
function setKind(kind) { studio.draft.spec = convert(studio.draft.spec, kind); drawStudioForm(); }

function axisBlock(sp, { x = true, xnum = false, y = true, y2 = false } = {}) {
  return `<div class="sec"><div class="label">Títulos y ejes</div>
    <div class="frow">${inp("title", "Título de la gráfica", sp.title)}</div>
    <div class="frow">${x ? inp("x.label", "Título del eje X", sp.x?.label) : ""}${y ? inp("y.label", sp.orientation === "horizontal" ? "Título del eje de valores" : "Título del eje Y", sp.y?.label) : ""}</div>
    ${y ? `<div class="frow">${inp("y.min", "Y mínimo", numText(sp.y?.min), "number")}${inp("y.max", "Y máximo", numText(sp.y?.max), "number")}${inp("y.step", "Y cada", numText(sp.y?.step), "number")}
      <label>Números Y<select data-p="y.format">${sel([["", "Normal"], ["grouped", "Miles con punto"]], sp.y?.format)}</select></label></div>` : ""}
    ${xnum ? `<div class="frow">${inp("x.min", "X mínimo", numText(sp.x?.min), "number")}${inp("x.max", "X máximo", numText(sp.x?.max), "number")}${inp("x.step", "X cada", numText(sp.x?.step), "number")}</div>` : ""}
    ${y2 ? `<div class="frow">${inp("y2.label", "Título del 2.º eje Y", sp.y2?.label)}${inp("y2.min", "mín", numText(sp.y2?.min), "number")}${inp("y2.max", "máx", numText(sp.y2?.max), "number")}${inp("y2.step", "cada", numText(sp.y2?.step), "number")}</div>` : ""}
    <div class="frow"><label>Leyenda<select data-legend onchange="studio.draft.spec.legend = this.value === 'off' ? false : undefined; if (this.value !== 'off') delete studio.draft.spec.legend;">${sel([["", "Automática (nombres de serie)"], ["off", "Sin leyenda"]], sp.legend === false ? "off" : "")}</select></label>
      ${sp.kind === "bar" ? `<label>Barras<select data-p="orientation">${sel([["", "Verticales"], ["horizontal", "Horizontales"]], sp.orientation === "horizontal" ? "horizontal" : "")}</select></label>` : ""}
      ${["line", "curve"].includes(sp.kind) ? `<label class="switch" style="flex-direction:row;align-items:center"><input type="checkbox" data-p="inverted" ${sp.inverted ? "checked" : ""}> Fondo negro</label>` : ""}
      ${sp.kind === "curve" ? `<label class="switch" style="flex-direction:row;align-items:center"><input type="checkbox" data-p="y.ticks" ${sp.y?.ticks ? "checked" : ""}> Números en Y</label><label class="switch" style="flex-direction:row;align-items:center"><input type="checkbox" data-p="x.ticks" ${sp.x?.ticks ? "checked" : ""}> Números en X</label>` : ""}
    </div></div>`;
}

function seriesOpts(sp, i) {
  const s = sp.series[i];
  const isBar = sp.kind === "bar" || (sp.kind === "combo" && s.type === "bar");
  const isLine = sp.kind === "line" || sp.kind === "curve" || sp.kind === "scatter" || (sp.kind === "combo" && s.type === "line");
  return `<div class="serrow"><b style="grid-column:1/-1;font-size:12px">${esc(s.name || `Serie ${i + 1}`)}</b>
    ${sp.kind === "combo" ? `<span class="fcol"><label>Tipo<select data-s="${i}" data-k="type">${sel([["bar", "Barras"], ["line", "Línea"]], s.type)}</select></label></span>` : ""}
    ${isBar ? `<span class="fcol"><label>Relleno<select data-s="${i}" data-k="pattern">${sel(PATTERNS, s.pattern)}</select></label></span>` : ""}
    ${isLine ? `<span class="fcol"><label>Marcador<select data-s="${i}" data-k="marker">${sel(MARKERS, s.marker)}</select></label></span>
      <span class="fcol"><label>Trazo<select data-s="${i}" data-k="style">${sel(STYLES, s.style)}</select></label></span>` : ""}
    ${sp.kind === "scatter" ? `<label class="switch" style="font-size:12px"><input type="checkbox" data-s="${i}" data-k="lines" ${s.lines ? "checked" : ""}> Unir puntos</label>` : ""}
    ${sp.kind === "line" ? `<label class="switch" style="font-size:12px"><input type="checkbox" data-s="${i}" data-k="area" ${s.area ? "checked" : ""}> Área rellena</label>` : ""}
    ${sp.kind === "curve" ? `<span class="fcol"><label>Rótulo en la curva<input data-s="${i}" data-k="label" value="${esc(s.label || "")}"></label></span>` : ""}
    ${["bar", "combo"].includes(sp.kind) ? `<span class="fcol"><label>Eje<select data-s="${i}" data-k="axis">${sel([["", "Principal"], ["2", "Segundo eje"]], s.axis === 2 ? "2" : "")}</select></label></span>` : ""}
  </div>`;
}

// Bars, lines and combos: one row per category, one column per series. Paste straight from Excel.
function catForm(sp) {
  sp.categories = sp.categories || [];
  sp.series = sp.series || [];
  const matrix = [["Categoría", ...sp.series.map(s => s.name ?? "")], ...sp.categories.map((c, j) => [c, ...sp.series.map(s => numText(s.values?.[j]))])];
  const y2 = sp.series.some(s => s.axis === 2) || sp.y2;
  return `<div class="sec"><div class="label">Datos · cada fila es una categoría, cada columna una serie</div>
      <div class="grid" data-grid="cat" data-matrix="${esc(JSON.stringify(matrix))}"></div>
      <p class="muted" style="font-size:12px;margin:6px 0 0">Puedes pegar celdas copiadas de Excel o Sheets. La primera fila son los nombres de las series (déjalo vacío si el escaneo no muestra leyenda). Usa coma para decimales.</p>
      ${sp.series.map((_, i) => seriesOpts(sp, i)).join("")}
    </div>${axisBlock(sp, { y2 })}`;
}

// Scatter, curves and lines with numeric x: each series is a list of (x, y) points.
function ptForm(sp) {
  sp.series = sp.series || [];
  const blocks = sp.series.map((s, i) => `<div style="margin-bottom:10px">
      <div class="frow" style="align-items:end"><label>Nombre de la serie ${i + 1}<input data-s="${i}" data-k="name" value="${esc(s.name || "")}"></label>
        <button class="ib warn" onclick="dropSeries(${i})" style="justify-self:start">Quitar serie</button></div>
      <div class="grid" data-grid="pts" data-series="${i}" data-matrix="${esc(JSON.stringify([["x", "y"], ...(s.points || []).map(p => [numText(p[0]), numText(p[1])])]))}"></div>
      ${seriesOpts(sp, i)}</div>`).join("");
  return `<div class="sec"><div class="label">Puntos (x, y) por serie</div>${blocks}
      <button class="ib" onclick="addPtSeries()">+ Serie</button>
      ${sp.kind === "curve" ? `<p class="muted" style="font-size:12px">En una curva los puntos son la forma (de 0 a 1 sirve); no se imprimen números salvo que actives «Números».</p>` : ""}</div>
    ${axisBlock(sp, { xnum: true })}`;
}
function addPtSeries() { studio.draft.spec.series.push({ name: "", points: [[0, 0], [1, 1]] }); drawStudioForm(); }
function dropSeries(i) { studio.draft.spec.series.splice(i, 1); drawStudioForm(); }

function pieForm(sp) {
  if (sp.rings) return `<div class="sec"><div class="label">Torta con anillos</div><p class="muted">Esta torta tiene anillos: edítala en la pestaña JSON.</p></div>`;
  sp.slices = sp.slices || [];
  const matrix = [["Etiqueta", "Valor"], ...sp.slices.map(s => [s.label ?? "", numText(s.value)])];
  return `<div class="sec"><div class="label">Partes de la torta</div>
      <div class="grid" data-grid="pie" data-matrix="${esc(JSON.stringify(matrix))}"></div>
      <div class="frow" style="margin-top:8px">
        <label class="switch" style="flex-direction:row;align-items:center"><input type="checkbox" data-p="percent" data-inv="1" ${sp.percent === false ? "" : "checked"}> Mostrar %</label>
        <label class="switch" style="flex-direction:row;align-items:center"><input type="checkbox" data-p="values" data-inv="1" ${sp.values === false ? "" : "checked"}> Mostrar valores</label>
      </div></div>
    <div class="sec"><div class="frow">${inp("title", "Título", sp.title)}</div></div>`;
}

function tableForm(sp) {
  const spans = [...(sp.headers || []), ...(sp.rows || []).flat()].some(c => c && typeof c === "object");
  if (spans) return `<div class="sec"><div class="label">Tabla con celdas combinadas</div><p class="muted">Esta tabla une celdas: edítala en la pestaña JSON (cada celda combinada es {"text", "colspan", "rowspan"}).</p></div>
    <div class="sec"><div class="frow">${inp("title", "Título", sp.title)}</div></div>`;
  const head = sp.headers && sp.headers.length;
  const matrix = [...(head ? [sp.headers.map(String)] : []), ...(sp.rows || []).map(r => r.map(c => String(c ?? "")))];
  return `<div class="sec"><div class="label">Celdas</div>
      <label class="switch" style="margin-bottom:8px"><input type="checkbox" id="st-head" ${head ? "checked" : ""}> La primera fila es el encabezado</label>
      <div class="grid" data-grid="table" data-matrix="${esc(JSON.stringify(matrix.length ? matrix : [["", ""]]))}"></div>
      <p class="muted" style="font-size:12px;margin:6px 0 0">Copia la tabla tal como está impresa; deja vacías las celdas vacías. Puedes pegar desde Excel.</p></div>
    <div class="sec"><div class="frow">${inp("title", "Título", sp.title)}${inp("maxWidth", "Ancho máximo (px)", numText(sp.maxWidth), "number")}</div></div>`;
}

function mapForm(sp) {
  const doc = MAPDOCS[sp.region];
  const names = doc ? doc.features.map(f => f.name).sort((a, b) => a.localeCompare(b, "es")) : [];
  const fills = sp.fills || {};
  const unknown = Object.keys(fills).filter(n => !names.includes(n));
  const fillOpts = (cur) => sel(MAP_FILLS.some(([v]) => v === (cur ?? "")) ? MAP_FILLS : [...MAP_FILLS, [cur, cur]], cur ?? "");
  const legend = (sp.legend || []).map((l, i) => `<div class="frow" style="grid-template-columns:1fr 140px auto;align-items:end">
      <label>Texto<input data-p="legend.${i}.label" value="${esc(l.label)}"></label><label>Relleno<select data-p="legend.${i}.fill">${fillOpts(l.fill)}</select></label>
      <button class="ib warn" onclick="studio.draft.spec.legend.splice(${i},1);drawStudioForm()">✕</button></div>`).join("");
  return `<div class="sec"><div class="label">Mapa</div>
      <div class="frow"><label>Región<select onchange="studio.draft.spec.region = this.value; drawStudioForm()">${sel(Object.entries(REGIONS), sp.region)}</select></label>${inp("title", "Título", sp.title)}</div>
      ${doc ? "" : `<div class="note bad">No se cargó el contorno de esta región.</div>`}
      ${unknown.length ? `<div class="note warn">Áreas que el mapa no tiene: ${esc(unknown.join(", "))}. <a href="#" onclick="unknownOut();return false">Quitarlas</a></div>` : ""}
    </div>
    <div class="sec"><div class="label">Relleno de cada área (como en el escaneo)</div>
      <div class="frow" style="grid-template-columns:1fr auto auto"><label>Pintar todas con<select id="st-allfill">${sel(MAP_FILLS, "")}</select></label>
        <button class="ib" style="align-self:end" onclick="fillAll()">Aplicar a todas</button></div>
      <div class="arealist">${names.map(n => `<label><span>${esc(n)}</span><select data-area="${esc(n)}">${fillOpts(fills[n])}</select></label>`).join("")}</div>
    </div>
    <div class="sec"><div class="label">Leyenda</div>${legend}<button class="ib" onclick="(studio.draft.spec.legend = studio.draft.spec.legend || []).push({label:'', fill:'#bbbbbb'});drawStudioForm()">+ Entrada</button>
      <p class="muted" style="font-size:12px">Puntos y rótulos (ciudades, nombres) van en la pestaña JSON: points y labels con lon y lat.</p></div>`;
}
function unknownOut() { const sp = studio.draft.spec, names = new Set((MAPDOCS[sp.region]?.features || []).map(f => f.name)); Object.keys(sp.fills || {}).forEach(n => { if (!names.has(n)) delete sp.fills[n]; }); drawStudioForm(); }
function fillAll() { const v = $("#st-allfill").value, sp = studio.draft.spec; sp.fills = {}; if (v) (MAPDOCS[sp.region]?.features || []).forEach(f => { sp.fills[f.name] = v; }); drawStudioForm(); }

// A small spreadsheet: edit cells, add or remove rows and columns, paste a block from Excel.
function bindGrids() {
  document.querySelectorAll("#st-form [data-grid]").forEach(el => {
    const kind = el.dataset.grid;
    let m = JSON.parse(el.dataset.matrix);
    const fixedCols = kind === "pts" || kind === "pie";
    const hasHead = () => kind !== "table" || $("#st-head")?.checked;
    const draw = () => {
      const cols = Math.max(...m.map(r => r.length));
      m = m.map(r => [...r, ...Array(cols - r.length).fill("")]);
      el.innerHTML = `<table><tbody>${m.map((r, i) => `<tr>
        <td class="rh">${i === 0 && hasHead() ? "" : `<button class="x" title="Quitar fila" data-delrow="${i}">✕</button>`}</td>
        ${r.map((c, j) => { const head = i === 0 && hasHead(); const tag = head ? "th" : "td";
          const ro = head && fixedCols ? "readonly" : "";
          return `<${tag}><input ${head ? `data-hcol="${j}"` : ""} data-r="${i}" data-c="${j}" value="${esc(c)}" ${ro} ${head && j === 0 && kind === "cat" ? "readonly" : ""} placeholder="${head && kind === "cat" && j > 0 ? `Serie ${j}` : ""}"></${tag}>`; }).join("")}
        ${i === 0 && !fixedCols && cols > 1 ? "" : ""}</tr>`).join("")}
        ${!fixedCols ? `<tr><td class="rh"></td>${m[0].map((_, j) => `<td style="text-align:center">${(kind === "cat" && j === 0) || m[0].length <= 1 ? "" : `<button class="x" data-delcol="${j}" title="Quitar columna">✕ col</button>`}</td>`).join("")}</tr>` : ""}
        </tbody></table>`;
      const btns = el.nextElementSibling?.classList?.contains("gbtns") ? el.nextElementSibling : el.insertAdjacentElement("afterend", Object.assign(document.createElement("div"), { className: "gbtns" }));
      btns.innerHTML = `<button class="ib" data-addrow>+ Fila</button>${fixedCols ? "" : `<button class="ib" data-addcol>+ ${kind === "cat" ? "Serie" : "Columna"}</button>`}`;
      btns.querySelector("[data-addrow]").onclick = () => { m.push(Array(m[0].length).fill("")); commit(true); };
      const ac = btns.querySelector("[data-addcol]"); if (ac) ac.onclick = () => { m = m.map(r => [...r, ""]); commit(true); };
    };
    const commit = (redraw) => { apply(kind, m, el); if (redraw && (kind === "cat")) { drawStudioForm(); return; } if (redraw) draw(); studioPreview(); };
    el.addEventListener("input", e => {
      const t = e.target; if (t.dataset.r == null) return;
      m[+t.dataset.r][+t.dataset.c] = t.value;
      commit(false);
      if (kind === "cat" && t.dataset.hcol) { const b = document.querySelectorAll("#st-form .serrow > b")[+t.dataset.hcol - 1]; if (b) b.textContent = t.value || `Serie ${t.dataset.hcol}`; }
    });
    el.addEventListener("click", e => {
      const t = e.target;
      if (t.dataset.delrow != null) { m.splice(+t.dataset.delrow, 1); if (!m.length) m = [Array(2).fill("")]; commit(true); }
      if (t.dataset.delcol != null) { const j = +t.dataset.delcol; m = m.map(r => r.filter((_, k) => k !== j)); commit(true); }
    });
    el.addEventListener("keydown", e => {
      const t = e.target;
      if (e.key === "Enter" && t.dataset.r != null) {
        e.preventDefault();
        const r = +t.dataset.r + 1, c = +t.dataset.c;
        if (r >= m.length) { m.push(Array(m[0].length).fill("")); commit(true); }
        el.querySelector(`[data-r="${r}"][data-c="${c}"]`)?.focus();
      }
    });
    el.addEventListener("paste", e => {
      const t = e.target, text = e.clipboardData?.getData("text/plain") || "";
      if (t.dataset.r == null || !/[\t\n]/.test(text.trim())) return;
      e.preventDefault();
      const rows = text.replace(/\r/g, "").replace(/\n$/, "").split("\n").map(l => l.split("\t"));
      const r0 = +t.dataset.r, c0 = +t.dataset.c;
      rows.forEach((row, i) => row.forEach((v, j) => {
        const r = r0 + i, c = c0 + j;
        if (fixedCols && c >= m[0].length) return;
        while (m.length <= r) m.push(Array(m[0].length).fill(""));
        if (c >= m[0].length) m = m.map(x => [...x, ""]);
        m[r][c] = v.trim();
      }));
      commit(true);
      toast(`${rows.length} filas pegadas`);
    });
    if (kind === "table") $("#st-head").onchange = () => { apply(kind, m, el); draw(); studioPreview(); };
    draw();
  });
}

// Writes the grid back into the spec. Blank rows at the end are ignored.
function apply(kind, m, el) {
  const sp = studio.draft.spec;
  const blank = r => r.every(c => String(c).trim() === "");
  const body = m.slice(1);
  while (body.length && blank(body[body.length - 1])) body.pop();
  if (kind === "cat") {
    const names = m[0].slice(1);
    sp.categories = body.map(r => r[0]);
    sp.series = names.map((nm, i) => {
      const old = sp.series[i] || (sp.kind === "combo" ? { type: "line" } : {});
      return { ...old, name: nm, values: body.map(r => { const v = parseNum(r[i + 1]); return v === null && sp.kind === "bar" ? 0 : v; }) };
    });
  } else if (kind === "pts") {
    const s = sp.series[+el.dataset.series];
    s.points = body.filter(r => !blank(r)).map(r => [parseNum(r[0]), parseNum(r[1])]);
  } else if (kind === "pie") {
    sp.slices = body.filter(r => !blank(r)).map((r, i) => ({ ...(sp.slices?.[i] || {}), label: r[0], value: parseNum(r[1]) }));
  } else if (kind === "table") {
    const all = [...m];
    while (all.length > 1 && blank(all[all.length - 1])) all.pop();
    if ($("#st-head")?.checked) { sp.headers = all[0]; sp.rows = all.slice(1); }
    else { delete sp.headers; sp.rows = all; }
  }
}

async function saveStudio() {
  const dr = studio.draft;
  if (!dr) return;
  if (studio.mode === "json") { try { dr.spec = JSON.parse($("#st-json").value); } catch (e) { toast("El JSON no es válido: " + e.message, true); return; } }
  const problems = figProblems({ kind: dr.spec.kind, spec: dr.spec });
  if (problems.length && !confirm(`La figura todavía tiene problemas y la pregunta seguirá oculta:\n\n• ${problems.slice(0, 5).join("\n• ")}\n\n¿Guardar de todos modos?`)) return;
  try {
    await api(`${qpath()}/figures/${encodeURIComponent(dr.id)}`, J("PUT", { kind: dr.spec.kind, target: dr.target, option: dr.option || null, fidelity: dr.fidelity, spec: dr.spec }));
    closeStudio();
    await reloadFigures("Figura guardada");
  } catch (e) { toast(e.message, true); }
}

setTab("progress");
</script>
</body>
</html>
